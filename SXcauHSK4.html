<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sắp xếp câu HSK4</title>
<style>
:root{
  --bg:#fff6f2; --surface:#ffffff; --surface2:#fffaf8; --ink:#3d2b2b; --muted:#8c7070; --line:#f2d8d0;
  --hd1:#f7a6bd; --hd2:#ffc49c; --hd-ink:#4a2630;
  --primary:#e2622a; --primary-h:#c9531f; --primary-ink:#fff; --primary-soft:#ffe6d8;
  --pink-soft:#ffe8ee; --tile:#fff; --tile-line:#f0c7b8; --tile-ink:#3d2b2b;
  --ok:#23915a; --ok-soft:#e1f5ea; --bad:#d23a48; --bad-soft:#fde6e8; --warn:#c77d12;
  --shadow:0 1px 2px rgba(120,60,40,.06),0 4px 14px rgba(120,60,40,.07);
  --zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif;
  --ui:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1517; --surface:#291e21; --surface2:#2f2326; --ink:#f5e8e5; --muted:#bba3a0; --line:#45333a;
    --hd1:#7d3550; --hd2:#8c5232; --hd-ink:#fff1ec;
    --primary:#ff8248; --primary-h:#ff9a68; --primary-ink:#2a1208; --primary-soft:#4a2a1d;
    --pink-soft:#3a252c; --tile:#352a2d; --tile-line:#5b4148; --tile-ink:#f5e8e5;
    --ok:#4cc68a; --ok-soft:#1d3a2b; --bad:#ff6b77; --bad-soft:#47232a; --warn:#f0b04a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
    --bg:#1d1517; --surface:#291e21; --surface2:#2f2326; --ink:#f5e8e5; --muted:#bba3a0; --line:#45333a;
    --hd1:#7d3550; --hd2:#8c5232; --hd-ink:#fff1ec;
    --primary:#ff8248; --primary-h:#ff9a68; --primary-ink:#2a1208; --primary-soft:#4a2a1d;
    --pink-soft:#3a252c; --tile:#352a2d; --tile-line:#5b4148; --tile-ink:#f5e8e5;
    --ok:#4cc68a; --ok-soft:#1d3a2b; --bad:#ff6b77; --bad-soft:#47232a; --warn:#f0b04a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.zh{font-family:var(--zh)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
/* header */
header.top{background:linear-gradient(100deg,var(--hd1),var(--hd2));color:var(--hd-ink);padding:10px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(200,90,80,.18)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:52px;height:52px;border-radius:12px;background:#fbf6ef;object-fit:cover;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.brand .b1{white-space:nowrap;font-weight:800;letter-spacing:.06em;font-size:17px;line-height:1.1}
.brand .b2{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .b2 .zh{font-weight:600}
header.top .sp{flex:1}
.iconbtn{border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.45);border-radius:10px;padding:6px 10px;font-size:14px}
:root[data-theme="dark"] .iconbtn{background:rgba(0,0,0,.2)}
/* layout */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 270px;gap:16px;padding:16px;max-width:1440px;margin:0 auto;align-items:start}
aside.left,aside.right{position:sticky;top:88px;max-height:calc(100vh - 100px);overflow:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
aside.left{padding:12px}
.boardbtn{width:100%;border:none;background:var(--primary);color:var(--primary-ink);font-weight:700;padding:10px 12px;border-radius:10px;margin-bottom:10px}
.boardbtn:hover{background:var(--primary-h)}
.boardbtn.on{outline:3px solid var(--primary-soft)}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 4px 6px;display:flex;justify-content:space-between}
.tlist{display:flex;flex-direction:column;gap:3px}
.titem{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:6px 8px;width:100%}
.titem:hover{background:var(--pink-soft)}
.titem.on{background:var(--primary-soft);border-color:var(--primary);font-weight:600}
.titem .tn{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.titem .tn small{display:block;color:var(--muted);font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .best{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.titem .best.low{background:var(--bad-soft);color:var(--bad)}
/* main */
main{min-width:0}
.panel{padding:16px 18px;margin-bottom:14px}
.ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.ttl h1{font-size:21px;margin:0}
.ttl .sub{color:var(--muted);font-size:14px}
.intro{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--pink-soft);color:var(--ink);margin:2px 4px 2px 0;white-space:nowrap}
.tag.p{background:var(--primary-soft);color:var(--primary)}
.tag.r{background:var(--bad-soft);color:var(--bad)}
.tag.g{background:var(--ok-soft);color:var(--ok)}
/* history table */
.hist h2,.panel h2{font-size:16px;margin:0 0 10px}
.tablewrap{overflow-x:auto}
table.ht{width:100%;border-collapse:collapse;font-size:13.5px}
table.ht th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
table.ht td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
table.ht tr:last-child td{border-bottom:none}
.score b{font-size:15px}
.mono{font-variant-numeric:tabular-nums}
.linkbtn{border:1px solid var(--primary);color:var(--primary);background:transparent;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.linkbtn:hover{background:var(--primary-soft)}
.empty{color:var(--muted);font-size:13.5px}
/* questions */
.q{padding:14px 16px;margin-bottom:12px;scroll-margin-top:96px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qnum{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--primary-ink);font-weight:800;display:grid;place-items:center;flex:none}
.st{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.st.doing{color:var(--warn);border-color:var(--warn)}
.st.done{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.qhead .sp{flex:1}
.clr{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:13px}
.clr:hover{border-color:var(--bad);color:var(--bad)}
.lbl{font-size:11.5px;color:var(--muted);font-weight:600;margin:2px 0 4px}
.bank,.ans{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border-radius:12px}
.bank{background:var(--surface2);border:1px dashed var(--line)}
.ans{background:var(--pink-soft);border:2px dashed var(--tile-line);margin-top:8px;align-items:center;position:relative}
.ans.over,.bank.over{border-color:var(--primary);background:var(--primary-soft)}
.ans .ph{color:var(--muted);font-size:13px;padding:0 4px;pointer-events:none}
.ans::after{content:"。";font-family:var(--zh);font-size:20px;color:var(--muted);margin-left:2px}
.ans.emptyans::after{content:none}
.tile{font-family:var(--zh);font-size:20px;line-height:1.2;padding:8px 13px;border-radius:10px;background:var(--tile);color:var(--tile-ink);border:1.5px solid var(--tile-line);box-shadow:0 2px 0 var(--tile-line);user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;white-space:nowrap}
.tile:hover{border-color:var(--primary)}
.tile.ghosting{opacity:.3}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.25);border-color:var(--primary)}
.caret{width:3px;align-self:stretch;min-height:36px;background:var(--primary);border-radius:3px;margin:0 -2px}
.dragging .mbar,.dragging header.top{pointer-events:none}
.dragging{cursor:grabbing}
.locked .tile{cursor:default;touch-action:auto}
/* right */
aside.right{padding:14px}
.timer{font-size:38px;font-weight:800;text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.timer.red{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.tnote{text-align:center;font-size:12px;color:var(--muted);margin:2px 0 8px}
.seg{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.seg button.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cnt div{border-radius:10px;padding:8px;text-align:center;border:1px solid var(--line)}
.cnt b{display:block;font-size:22px;line-height:1.1}
.cnt span{font-size:12px}
.cnt .d{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.cnt .u{background:var(--surface);}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.grid button{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:0}
.grid button.d{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.grid button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.grid button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.submit{width:100%;border:none;border-radius:11px;background:var(--primary);color:var(--primary-ink);font-weight:800;font-size:16px;padding:12px}
.submit:hover{background:var(--primary-h)}
.submit:disabled{opacity:.5;cursor:default}
.legend{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
/* result */
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.sumrow div,.stats div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sumrow b,.stats b{display:block;font-size:24px;line-height:1.2}
.sumrow span,.stats span{font-size:12px;color:var(--muted)}
.big b{color:var(--primary)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.pri:hover{background:var(--primary-h)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff}
.rq{padding:14px 16px;margin-bottom:10px;border-left:5px solid var(--line)}
.rq.ok{border-left-color:var(--ok)}
.rq.bad{border-left-color:var(--bad)}
.rq .qhead{margin-bottom:6px}
.verdict{font-weight:700;font-size:13px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.rrow{display:grid;grid-template-columns:118px 1fr;gap:4px 10px;font-size:14px;padding:3px 0}
.rrow>span:first-child{color:var(--muted);font-size:12.5px;padding-top:3px}
.words{font-family:var(--zh);font-size:16px;color:var(--muted)}
.sent{font-family:var(--zh);font-size:19px}
.sent.wrong{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px;color:var(--bad)}
.sent.right{color:var(--ok);font-weight:600}
.alts{font-family:var(--zh);font-size:15px;color:var(--ink)}
.expl{background:var(--surface2);border-radius:8px;padding:6px 10px;font-size:13.5px}
/* board */
.who{display:flex;align-items:center;gap:6px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.55);border-radius:99px;padding:5px 12px 5px 8px;font-size:14px;font-weight:600;max-width:46vw;color:var(--hd-ink)}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.empty{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);animation:pulse 1.6s infinite}
:root[data-theme="dark"] .who:not(.empty){background:rgba(0,0,0,.2)}
.namebox label{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}
.namebox input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
.namebox input:focus{outline:none;border-color:var(--primary)}
.namebox .err{color:var(--bad);font-size:12.5px;min-height:18px;margin-top:4px}
.tag.n{background:var(--ok-soft);color:var(--ok)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select{font:inherit;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);max-width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(40,20,20,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--surface);color:var(--ink);border-radius:16px;max-width:420px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal .actions{justify-content:flex-end}
/* mobile bar */
.mbar{display:none}
@media (max-width:980px){
  .layout{grid-template-columns:1fr;padding:10px 12px;gap:10px}
  aside.left,aside.right{position:static;max-height:none;overflow:visible}
  aside.left{padding:8px;display:flex;gap:8px;overflow-x:auto;align-items:stretch;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  aside.left .boardbtn{width:auto;flex:none;margin:0;white-space:nowrap}
  aside.left .grp{display:flex;flex:none;flex-direction:column;justify-content:center;margin:0 2px;font-size:10.5px;line-height:1.2}
  aside.left .grp span+span{font-weight:500}
  aside.left .tlist{flex-direction:row;gap:6px;flex:none}
  .titem{flex:none;width:auto;max-width:190px;border:1px solid var(--line);background:var(--surface2)}
  .titem .tn small{max-width:120px}
  aside.right{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;padding:12px}
  aside.right .tbox{grid-row:span 2}
  .timer{font-size:30px}
  .seg{margin-bottom:0}
  .cnt{margin:0}
  .grid{grid-column:1/-1;grid-template-columns:repeat(10,1fr);margin:4px 0}
  .grid button{font-size:12.5px;border-radius:7px}
  .rsub{grid-column:1/-1}
  .legend{display:none}
  .q{padding:12px}
  .tile{font-size:18px;padding:7px 11px}
  .rrow{grid-template-columns:1fr}
  .rrow>span:first-child{padding:0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;align-items:center;gap:10px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08)}
  .mbar.on{display:flex}
  .mbar .mt{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
  .mbar .mt.red{color:var(--bad)}
  .mbar .mc{flex:1;font-size:13px;color:var(--muted)}
  .mbar .submit{width:auto;padding:9px 18px;font-size:15px}
  body.hasbar{padding-bottom:70px}
  header.top{padding:8px 12px}
  .brand img{width:42px;height:42px}
  .brand .b1{font-size:15px}
  .brand .b2{font-size:12px}
  .who{font-size:12.5px;max-width:40vw;padding:4px 10px 4px 7px}
  header.top{gap:8px}
}
@media (max-width:640px){
  table.ht thead{display:none}
  table.ht,table.ht tbody{display:block}
  table.ht tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
  table.ht tr:last-child{border-bottom:none}
  table.ht td{border:none;padding:2px 0}
  table.ht td:last-child{grid-column:1/-1}
  table.ht td:last-child .linkbtn{width:100%;padding:7px}
}
@media (max-width:420px){
  .sumrow{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .sumrow b{font-size:19px}
  table.ht{font-size:12.5px}
  table.ht td,table.ht th{padding:6px 5px}
  aside.right{grid-template-columns:1fr}
  aside.right .tbox{grid-row:auto}
}
</style>
</head>
<body>

function bindDetail(root,back){

    const h=HIST.find(x=>x.id===b.dataset.h); if(!h) return;
    guard(()=>{ stopTimer(); if(!S||S.key!==h.key||S.started) newAttempt(h.key); VIEW='result'; S.last=h; S.back=back; renderLeft(); renderResult(h,true); renderRight(); scrollTo({top:0}); });
  });
}

function renderQ(i){

    <div class="ans ${used.length?'':'emptyans'}" data-q="${i}" data-z="ans">${used.length?used.map(k=>tileHtml(q,k,i,'ans')).join(''):'<span class="ph">Kéo hoặc chạm vào từ để xếp câu vào đây…</span>'}</div>`;

function tileHtml(q,k,i,z){return `<span class="tile" lang="zh-CN" data-q="${i}" data-k="${k}" data-from="${z}">${esc(q.w[k])}</span>`}
function changed(i){
  if(!S.started && S.ans.some(a=>a.length)){S.started=true;S.startTs=Date.now();startTimer()}
  renderQ(i);renderRight();
}

/* ---------- drag & drop (pointer events) ---------- */
let D=null;
document.addEventListener('pointerdown',e=>{
  const tile=e.target.closest('.tile'); if(!tile||VIEW!=='quiz'||!S||S.submitted) return;
  if(e.button!==undefined && e.button!==0) return;
  e.preventDefault();
  D={tile,q:+tile.dataset.q,k:+tile.dataset.k,from:tile.dataset.from,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,pid:e.pointerId};
  try{tile.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!D||e.pointerId!==D.pid) return;
  const dx=e.clientX-D.x0, dy=e.clientY-D.y0;
  if(!D.moved && Math.hypot(dx,dy)<6) return;
  if(!D.moved){D.moved=true;document.body.classList.add('dragging');const g=D.tile.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);D.ghost=g;D.tile.classList.add('ghosting')}
  D.ghost.style.left=e.clientX+'px';D.ghost.style.top=e.clientY+'px';
  updateTarget(e.clientX,e.clientY);
  autoScroll(e.clientY);
});
function zoneAt(x,y){
  const el=document.elementFromPoint(x,y); if(!el) return null;
  const z=el.closest('.ans,.bank'); if(!z||+z.dataset.q!==D.q) return null; return z;
}
function insertIndex(z,x,y){
  const tiles=[...z.querySelectorAll('.tile')].filter(t=>t!==D.tile);
  for(let j=0;j<tiles.length;j++){
    const r=tiles[j].getBoundingClientRect();
    if(y<r.top-4) return j;
    if(y<=r.bottom+4 && x<r.left+r.width/2) return j;
  }
  return tiles.length;
}
function clearMarks(){document.querySelectorAll('.over').forEach(z=>z.classList.remove('over'));document.querySelectorAll('.caret').forEach(c=>c.remove())}
function updateTarget(x,y){
  clearMarks(); const z=zoneAt(x,y); D.zone=z; if(!z) return;
  z.classList.add('over');
  if(z.dataset.z==='ans'){
    const idx=insertIndex(z,x,y); D.idx=idx;
    const tiles=[...z.querySelectorAll('.tile')].filter(t=>t!==D.tile);
    const c=document.createElement('span');c.className='caret';
    if(idx<tiles.length) z.insertBefore(c,tiles[idx]); else z.appendChild(c);
  }
}
let asRAF=null,asV=0;
function autoScroll(y){
  const top=($('header.top').getBoundingClientRect().bottom)+50, bar=$('#mbar').classList.contains('on')?$('#mbar').offsetHeight:0, bot=innerHeight-bar-50;
  asV= y<top?-(top-y)/3 : (y>bot? (y-bot)/3 : 0); asV=Math.max(-25,Math.min(25,asV));
  if(asV&&!asRAF){const step=()=>{if(!D||!D.moved||!asV){asRAF=null;return}scrollBy(0,asV);asRAF=requestAnimationFrame(step)};asRAF=requestAnimationFrame(step)}
}
function endDrag(e,cancel){
  if(!D||(e&&e.pointerId!==D.pid)) return;
  const d=D; D=null; asV=0; document.body.classList.remove('dragging');
  if(d.ghost) d.ghost.remove(); d.tile.classList.remove('ghosting');
  const i=d.q, arr=S.ans[i];
  if(cancel){clearMarks();return}
  if(!d.moved){ // tap: toggle
    clearMarks();
    if(d.from==='bank') arr.push(d.k); else arr.splice(arr.indexOf(d.k),1);
    changed(i); return;
  }
  const z=d.zone; clearMarks();
  if(!z) return;
  if(z.dataset.z==='bank'){ if(d.from==='ans'){arr.splice(arr.indexOf(d.k),1);changed(i)} return; }
  // to answer
  const without=arr.filter(k=>k!==d.k);
  const idx=Math.min(d.idx??without.length,without.length);
  without.splice(idx,0,d.k); S.ans[i]=without; changed(i);
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

/* ---------- timer & right panel ---------- */
function startTimer(){stopTimer();timerId=setInterval(tick,250)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function tick(){
  if(!S||!S.started||S.submitted) return stopTimer();
  const r=remaining();
  updTimerUI();
  if(r<=0){ closeModal(); submit(true); }
}
function updTimerUI(){
  const tEl=$('#timer'); const r = S? (S.started? remaining(): S.limit*60) : LIMIT*60;
  const red = S && S.started && r<60;
  if(tEl){tEl.textContent=mmss(r);tEl.classList.toggle('red',!!red)}
  $('#mt').textContent=mmss(r); $('#mt').classList.toggle('red',!!red);
}
function setLimit(m){
  LIMIT=m; lsSet(LS_T,m);
  if(S && !S.submitted){S.limit=m; if(S.started && remaining()<=0){submit(true);return}}
  renderRight();
}
function renderRight(){
  const R=$('#right'), bar=$('#mbar');
  if(VIEW==='board'||!S){
    R.innerHTML=`<div class="tbox"><div class="timer mono">${mmss(LIMIT*60)}</div><div class="tnote">Thời gian mặc định cho mỗi đề</div></div>
      <div class="seg">${[10,15,20].map(m=>`<button data-m="${m}" class="${m===LIMIT?'on':''}">${m} phút</button>`).join('')}</div>
      <div class="legend rsub">Chọn một đề ở cột trái để bắt đầu làm bài.</div>`;
    R.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setLimit(+b.dataset.m));
    bar.classList.remove('on');document.body.classList.remove('hasbar');return;
  }
  const res = VIEW==='result' ? S.last : null;
  const n=S.t.q.length;
  let doneN, cls;
  if(res){ doneN=res.ans.filter((a,i)=>a.length===S.t.q[i].w.length).length; cls=i=>res.ok[i]?'ok':'bad'; }
  else { doneN=S.ans.filter((a,i)=>qState(i)===2).length; cls=i=>qState(i)===2?'d':''; }
  const lock = !!res;
  const tval = res ? hms(res.used).replace(/^0:/,'') : (S.started?mmss(remaining()):mmss(S.limit*60));
  R.innerHTML=`<div class="tbox"><div class="timer mono" id="${res?'':'timer'}">${tval}</div><div class="tnote">${res?'Thời gian đã làm':(S.started?'Thời gian còn lại':'Bắt đầu khi bạn xếp từ đầu tiên')}</div></div>
    <div class="seg">${[10,15,20].map(m=>`<button data-m="${m}" class="${m===(res?res.limit:S.limit)?'on':''}" ${lock?'disabled':''}>${m} phút</button>`).join('')}</div>
    <div class="cnt"><div class="d"><b>${res?res.correct:doneN}</b><span>${res?'Câu đúng':'Đã làm'}</span></div><div class="u"><b>${res?n-res.correct:n-doneN}</b><span>${res?'Câu sai':'Chưa làm'}</span></div></div>
    <div class="grid">${S.t.q.map((_,i)=>`<button class="${cls(i)}" data-go="${i}" aria-label="Câu ${i+1}">${i+1}</button>`).join('')}</div>
    <div class="rsub">${res?`<button class="submit" id="redoR">Làm lại đề này</button>`:`<button class="submit" id="subR">Nộp bài</button>`}</div>
    <div class="legend">${res?'🟩 đúng · 🟥 sai — bấm số để xem câu.':'🟧 đã làm · ⬜ chưa làm — bấm số để tới câu.'}</div>`;
  if(!lock) R.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setLimit(+b.dataset.m));
  R.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const el=$((res?'#r-':'#q-')+b.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
  if(res) $('#redoR').onclick=()=>openTest(S.key); else $('#subR').onclick=trySubmit;
  // mobile bar
  if(!res){bar.classList.add('on');document.body.classList.add('hasbar');$('#mc').textContent=`Đã làm ${doneN}/${n}`;$('#msub').onclick=trySubmit;updTimerUI()}
  else {bar.classList.remove('on');document.body.classList.remove('hasbar')}

/* ---------- submit ---------- */
function trySubmit(){
  if(!S||S.submitted) return;
  if(!STU.name){ askName(trySubmit,true); $('#nmErr').textContent='Hãy nhập tên trước khi nộp bài.'; return; }
  const notDone=S.ans.map((a,i)=>[a,i]).filter(([a,i])=>a.length===0).map(([a,i])=>i+1);
  const partial=S.ans.map((a,i)=>[a,i]).filter(([a,i])=>a.length>0&&a.length<S.t.q[i].w.length).map(([a,i])=>i+1);
  if(notDone.length||partial.length){
    let msg=''; if(notDone.length) msg+=`Câu chưa làm: ${notDone.join(', ')}. `; if(partial.length) msg+=`Câu chưa dùng hết từ: ${partial.join(', ')}. `;
    modal('Nộp bài khi chưa làm xong?',msg+'Những câu này sẽ bị tính sai. Bạn có chắc muốn nộp bài?',[['Làm tiếp','btn'],['Vẫn nộp bài','btn pri',()=>submit(false)]]);
  } else modal('Nộp bài?','Bạn đã làm xong cả 10 câu. Nộp bài để xem kết quả?',[['Kiểm tra lại','btn'],['Nộp bài','btn pri',()=>submit(false)]]);
}
function submit(timeout){
  if(!S||S.submitted) return;
  stopTimer(); S.submitted=true;
  const used = S.started? Math.min(elapsed(), S.limit*60) : 0;
  const ok=S.t.q.map((q,i)=>S.ans[i].length===q.w.length && isCorrect(q,S.ans[i]));
  const correct=ok.filter(Boolean).length;
  const h={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), key:S.key, name:STU.name, cls:STU.cls, ts:Date.now(), correct, score:correct*6, used:Math.round(used), limit:S.limit, timeout:!!timeout, ans:S.ans.map(a=>a.slice()), ok};
  HIST.push(h); saveHist();
  S.last=h; S.back='quiz'; VIEW='result';
  renderLeft(); renderResult(h,false); renderRight(); scrollTo({top:0});
  $('#nameModal').classList.remove('on'); if(timeout) modal('Hết giờ!','Bài làm của bạn đã được tự động nộp.',[['Xem kết quả','btn pri']]);
}

      <div class="rrow"><span>Đáp án đúng</span><span class="sent right" lang="zh-CN">${esc(q.a)}</span></div>
      ${q.alt.length?`<div class="rrow"><span>Cũng chấp nhận</span><span class="alts" lang="zh-CN">${q.alt.map(esc).join('<br>')}</span></div>`:''}

/* ---------- board ---------- */
let FILTER='all', SFILTER='all', ARM=null;
function renderBoard(){
  const list=HIST.filter(h=>BYKEY[h.key] && (SFILTER==='all'||(h.name||'')===SFILTER) && (FILTER==='all'||(FILTER==='P'||FILTER==='E'?BYKEY[h.key].kind===FILTER:h.key===FILTER))).sort((a,b)=>b.ts-a.ts);
  const names=[...new Set(HIST.map(h=>h.name||''))].sort((a,b)=>a.localeCompare(b,'vi'));
  const cnt=list.length, avg=cnt?list.reduce((s,h)=>s+h.score,0)/cnt:0, mx=cnt?Math.max(...list.map(h=>h.score)):0, at=cnt?list.reduce((s,h)=>s+h.used,0)/cnt:0;
  const opts=`<option value="all">Tất cả các đề</option><option value="P">— Chỉ Luyện tập</option><option value="E">— Chỉ Đề thi thử</option>`+
    TESTS.filter(t=>HIST.some(h=>h.key===t.key)).map(t=>`<option value="${t.key}">${esc(t.name)} · ${esc(t.sub)}</option>`).join('');
  $('#main').innerHTML=`<section class="panel card"><div class="ttl"><h1>📊 Bảng kết quả</h1><span class="sub">Lịch sử tất cả các lần làm bài (lưu trên trình duyệt này)</span></div></section>
  <section class="panel card">
    <div class="filters"><select id="flt" aria-label="Lọc theo đề">${opts}</select>${names.length?`<select id="sflt" aria-label="Lọc theo học sinh"><option value="all">Tất cả học sinh</option>${names.map(n=>`<option value="${esc(n)}">👤 ${esc(n||'(chưa nhập tên)')}</option>`).join('')}</select>`:''}<span class="sp" style="flex:1"></span>
      <button class="btn" id="csvB" ${HIST.length?'':'disabled'}>⬇ Tải CSV</button><button class="btn danger" id="delB" ${HIST.length?'':'disabled'}>🗑 Xóa lịch sử</button></div>
    <div class="stats"><div><b class="mono">${cnt}</b><span>Số lần làm</span></div><div><b class="mono">${cnt?avg.toFixed(1):'–'}</b><span>Điểm trung bình /60</span></div><div><b class="mono">${cnt?mx:'–'}</b><span>Điểm cao nhất /60</span></div><div><b class="mono">${cnt?hms(at):'–'}</b><span>Thời gian trung bình</span></div></div>
    ${cnt?`<div class="tablewrap"><table class="ht"><thead><tr><th>Đề</th><th>Ngày làm</th><th>Kết quả</th><th>Thời gian làm bài</th><th>Xem chi tiết</th></tr></thead><tbody>${list.map(h=>rowHtml(h,true)).join('')}</tbody></table></div>`:'<p class="empty">Chưa có lần làm bài nào. Hãy chọn một đề ở cột trái để bắt đầu.</p>'}
  </section>`;
  const f=$('#flt'); f.value=FILTER; if(f.value!==FILTER){FILTER='all';f.value='all'}
  f.onchange=()=>{FILTER=f.value;renderBoard()};
  const sf=$('#sflt'); if(sf){sf.value=SFILTER; if(sf.value!==SFILTER){SFILTER='all';sf.value='all'} sf.onchange=()=>{SFILTER=sf.value;renderBoard()}}
  $('#csvB').onclick=()=>downloadCSV(list);
  const del=$('#delB');
  del.onclick=()=>{
    if(ARM){clearTimeout(ARM);ARM=null;HIST=[];saveHist();FILTER='all';SFILTER='all';render();return}
    del.classList.add('arm');del.textContent='Bấm lần nữa để xóa';
    ARM=setTimeout(()=>{ARM=null;del.classList.remove('arm');del.textContent='🗑 Xóa lịch sử'},4000);
  };
  bindDetail($('#main'),'board');
}
function downloadCSV(list){
  const rows=[['STT','Học sinh','Lớp/nhóm','Loại','Đề','Chủ điểm/Tháng','Lần','Ngày giờ nộp','Số câu đúng (/10)','Điểm (/60)','Thời gian làm','Giới hạn (phút)','Hết giờ']];
  list.slice().sort((a,b)=>a.ts-b.ts).forEach((h,i)=>{const t=BYKEY[h.key];rows.push([i+1,h.name||'',h.cls||'',kindLabel(t.kind),t.name,t.sub,attemptNo(h),dt(h.ts),h.correct,h.score,hms(h.used),h.limit,h.timeout?'Có':'Không'])});
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const d=new Date();a.download=`ket-qua-sap-xep-cau-HSK4_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.csv`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- student name ---------- */
function renderWho(){const b=$('#whoBtn');$('#whoName').textContent=STU.name?(STU.name+(STU.cls?' · '+STU.cls:'')):'Nhập tên';b.classList.toggle('empty',!STU.name)}
let nameCb=null;
function askName(cb,required){
  nameCb=cb||null; $('#nmIn').value=STU.name||''; $('#clIn').value=STU.cls||''; $('#nmErr').textContent='';
  $('#nmSkip').textContent=required?'Hủy':'Để sau';
  $('#nameModal').classList.add('on'); setTimeout(()=>$('#nmIn').focus(),30);
}
function saveName(){
  const n=$('#nmIn').value.trim().replace(/\s+/g,' '), c=$('#clIn').value.trim().replace(/\s+/g,' ');
  if(n.length<2){$('#nmErr').textContent='Vui lòng nhập họ tên (ít nhất 2 ký tự).';$('#nmIn').focus();return}
  STU={name:n,cls:c}; lsSet(LS_ST,STU); renderWho(); $('#nameModal').classList.remove('on');
  const cb=nameCb; nameCb=null; if(cb) cb(); else if(VIEW==='quiz'&&S&&!S.started){renderLeft();$('#hist').innerHTML=histTable(S.key);bindDetail($('#hist'),'quiz')} else render();
}
$('#nmOk').onclick=saveName;
$('#nmSkip').onclick=()=>{nameCb=null;$('#nameModal').classList.remove('on')};
['#nmIn','#clIn'].forEach(s=>$(s).addEventListener('keydown',e=>{if(e.key==='Enter')saveName()}));
$('#whoBtn').onclick=()=>askName(null,false);
const whoTag=h=>h.name?`<span class="tag n">👤 ${esc(h.name)}${h.cls?' · '+esc(h.cls):''}</span>`:'';

/* ---------- modal ---------- */
function modal(title,text,btns){
  $('#mh').textContent=title;$('#mp').textContent=text;const A=$('#ma');A.innerHTML='';
  btns.forEach(([label,cls,fn])=>{const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=()=>{closeModal();fn&&fn()};A.appendChild(b)});
  $('#modal').classList.add('on'); A.lastChild&&A.lastChild.focus();
}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- start ---------- */
window.__app={get S(){return S},TESTS,get HIST(){return HIST},submit,tick};
openTest(TESTS[0].key);
renderWho(); if(!STU.name) askName(null,false);
})();
</script>
