<style>
:root{
  --bg:#F7F4FC; --panel:#FFFFFF; --side:#FBF9FE; --line:#E6DEF5; --line2:#D6C9F0;
  --lav:#DCCFF3; --lav2:#EEE8FB; --mid:#8A6FC4; --deep:#5B3FA0; --ink:#2F2547; --sub:#6B6380;
  --ok:#2B8A3E; --okbg:#E8F5EB; --bad:#C92A2A; --badbg:#FDECEC; --warn:#D9480F;
  --zh:"Noto Serif SC","SimSun","Songti SC",serif; --vi:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --r:14px; --sh:0 6px 24px rgba(91,63,160,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--vi);font-size:16px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
.zh{font-family:var(--zh)}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:12px;padding:0 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{height:42px;width:auto}
.brand b{font-size:17px;letter-spacing:.06em;color:var(--deep)}
.brand small{display:block;font-size:12px;color:var(--sub);font-weight:500;letter-spacing:0}
.menu-btn{display:none;border:1px solid var(--line2);background:#fff;border-radius:10px;width:40px;height:40px;font-size:20px;color:var(--deep)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px}
.who .chip{background:var(--lav2);color:var(--deep);border-radius:999px;padding:6px 12px;font-weight:600;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who button{border:none;background:none;color:var(--sub);font-size:13px;text-decoration:underline}
/* ---------- layout ---------- */
.wrap{display:flex;min-height:calc(100vh - 64px)}
aside{width:280px;flex:none;background:var(--side);border-right:1px solid var(--line);position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;padding:16px 12px 30px}
aside h4{margin:8px 10px 10px;font-size:12px;letter-spacing:.12em;color:var(--sub);text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;margin-bottom:2px}
.nav a:hover{background:var(--lav2)}
.nav a.on{background:var(--lav);color:var(--deep);font-weight:600}
.nav .no{flex:none;width:28px;height:28px;border-radius:8px;background:#fff;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mid)}
.nav a.on .no{background:var(--mid);color:#fff;border-color:var(--mid)}
.nav .t{flex:1;min-width:0}
.nav .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .t .zh{font-size:13px;color:var(--sub)}
.nav .sc{font-size:11px;font-weight:700;color:var(--ok);background:var(--okbg);border-radius:6px;padding:2px 6px}
main{flex:1;min-width:0;padding:28px 36px 60px;max-width:1180px}
.scrim{display:none}
/* ---------- common ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.btn{text-decoration:none;display:inline-block;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;background:var(--mid);color:#fff}
.btn:hover{background:var(--deep)}
.btn.ghost{background:#fff;color:var(--deep);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--lav2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spk{border:1px solid var(--line2);background:#fff;border-radius:50%;width:34px;height:34px;flex:none;display:inline-grid;place-items:center;font-size:15px;color:var(--mid)}
.spk:hover{background:var(--lav2)}
.pos{display:inline-block;font-size:12px;font-weight:600;color:var(--deep);background:var(--lav2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.crumb{font-size:13px;color:var(--sub);margin-bottom:6px}
/* ---------- hero ---------- */
.hero{padding:26px 28px;display:flex;gap:24px;align-items:center;background:linear-gradient(135deg,#fff 0%,var(--lav2) 100%)}
.hero h1{margin:0;font-size:34px;line-height:1.25}
.hero .py{color:var(--mid);font-style:italic;margin:4px 0}
.hero .vi{font-weight:600;font-size:18px}
.hero .stats{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:center;min-width:92px}
.stat b{display:block;font-size:22px;color:var(--deep)}
.stat span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap;align-items:center}
.tabs .sp{flex:1}
.search{border:1px solid var(--line2);border-radius:10px;padding:10px 14px;font:inherit;min-width:220px;background:#fff}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);user-select:none}
section h2{font-size:22px;margin:34px 0 12px;display:flex;align-items:center;gap:10px}
section h2::before{content:"";width:6px;height:24px;border-radius:3px;background:var(--mid)}
/* ---------- vocab ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.v{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.v .top{display:flex;align-items:center;gap:12px}
.v .idx{font-size:12px;color:var(--sub);font-weight:600;width:22px}
.v .hz{font-family:var(--zh);font-size:32px;font-weight:700;color:var(--ink);line-height:1.1}
.v .pyn{color:var(--mid);font-style:italic;font-size:17px}
.v .top .spk{margin-left:auto}
.v .mean{font-size:16px}
.v .ex{background:var(--bg);border-radius:10px;padding:9px 12px;margin-top:4px;display:flex;gap:10px;align-items:flex-start}
.v .ex .zh{font-size:18px}
.v .ex .evi{font-size:14px;color:var(--sub)}
.v .ex .spk{width:30px;height:30px;font-size:13px}
.hide-mean .v .mean,.hide-mean .v .evi{filter:blur(6px);transition:filter .2s}
.hide-mean .v:hover .mean,.hide-mean .v:hover .evi{filter:none}
/* ---------- quiz ---------- */
.qbox{padding:24px 26px}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qtype{font-size:13px;font-weight:700;color:var(--deep);background:var(--lav2);border-radius:999px;padding:4px 12px}
.qcount{margin-left:auto;font-size:14px;color:var(--sub);font-weight:600}
.bar{height:8px;background:var(--lav2);border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mid),#B39DE6);border-radius:99px;transition:width .3s}
.prompt{text-align:center;margin:8px 0 22px}
.prompt .big{font-family:var(--zh);font-size:54px;font-weight:700;line-height:1.2}
.prompt .mid{font-size:22px;font-weight:600}
.prompt .hint{font-size:14px;color:var(--sub);margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;text-align:left;font-size:16px;color:var(--ink);display:flex;gap:10px;align-items:center;min-height:58px}
.opt:hover:not(:disabled){border-color:var(--mid);background:var(--lav2)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--lav2);color:var(--deep);font-weight:700;font-size:13px;display:grid;place-items:center}
.opt.zhopt{font-family:var(--zh);font-size:24px;justify-content:center}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fill{display:flex;gap:10px;max-width:560px;margin:0 auto}
.fill input{flex:1;border:2px solid var(--line2);border-radius:12px;padding:13px 16px;font:inherit;font-size:20px;text-align:center}
.fill input:focus{outline:none;border-color:var(--mid)}
.fill input.right{border-color:var(--ok);background:var(--okbg)}
.fill input.wrong{border-color:var(--bad);background:var(--badbg)}
.tones{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 0}
.tones button{border:1px solid var(--line2);background:#fff;border-radius:8px;min-width:38px;height:36px;font-size:17px;color:var(--deep)}
.tones button:hover{background:var(--lav2)}
.feedback{margin:18px auto 0;max-width:640px;border-radius:12px;padding:12px 16px;font-size:15px;display:none}
.feedback.ok{display:block;background:var(--okbg);color:var(--ok)}
.feedback.no{display:block;background:var(--badbg);color:var(--bad)}
.feedback b{font-weight:700}
.qnav{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.listen{display:flex;justify-content:center}
.listen .spk{width:84px;height:84px;font-size:34px;border-width:2px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:15px;text-align:left;min-height:54px;color:var(--ink)}
.mi.zh{font-family:var(--zh);font-size:24px;text-align:center}
.mi:hover:not(:disabled){border-color:var(--mid)}
.mi.sel{border-color:var(--mid);background:var(--lav2);box-shadow:0 0 0 3px rgba(138,111,196,.18)}
.mi.paired{border-style:dashed;border-color:var(--mid);background:#FBF9FE}
.mi .tag{display:inline-block;min-width:22px;height:22px;border-radius:6px;background:var(--mid);color:#fff;font:700 12px/22px var(--vi);text-align:center;margin-right:6px;vertical-align:middle}
.mi.right{border-color:var(--ok);background:var(--okbg);border-style:solid}
.mi.wrong{border-color:var(--bad);background:var(--badbg);border-style:solid}
.start{padding:30px;text-align:center}
.start .types{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 22px}
.start .types span{background:var(--lav2);color:var(--deep);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
/* ---------- result ---------- */
.result{padding:0;overflow:hidden}
.rtop{background:linear-gradient(135deg,var(--mid),#B39DE6);color:#fff;padding:24px 28px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.rtop .ring{width:116px;height:116px;border-radius:50%;background:conic-gradient(#fff var(--p),rgba(255,255,255,.25) 0);display:grid;place-items:center;flex:none}
.rtop .ring div{width:92px;height:92px;border-radius:50%;background:var(--mid);display:grid;place-items:center;text-align:center;line-height:1.1}
.rtop .ring b{font-size:30px}
.rtop .ring small{font-size:12px;opacity:.9}
.rtop h3{margin:0 0 6px;font-size:22px}
.rtop .meta{font-size:15px;opacity:.95}
.rtop .meta div{margin:2px 0}
.rbody{padding:22px 26px}
.rsum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.rsum .stat{flex:1}
.rlist{display:flex;flex-direction:column;gap:8px}
.ri{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);align-items:start}
.ri .m{font-size:18px;font-weight:700;text-align:center}
.ri.okk{background:#F6FBF7}.ri.okk .m{color:var(--ok)}
.ri.err{background:#FFF7F7}.ri.err .m{color:var(--bad)}
.ri .q{font-weight:600}
.ri .a{font-size:14px;color:var(--sub)}
.ri .a .you{color:var(--bad);font-weight:600}
.ri .a .cor{color:var(--ok);font-weight:600}
.filter{display:flex;gap:6px;margin:4px 0 12px}
.filter button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--deep)}
.filter button.on{background:var(--mid);color:#fff;border-color:var(--mid)}
.ractions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
/* ---------- overview ---------- */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.ol{padding:16px 18px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px;transition:transform .15s}
.ol:hover{transform:translateY(-2px);border-color:var(--line2)}
.ol .n{font-size:12px;font-weight:700;color:var(--mid);letter-spacing:.08em}
.ol .zh{font-size:20px;font-weight:700}
.ol .vi{font-size:14px;color:var(--sub)}
.ol .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--sub)}
/* ---------- login ---------- */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(47,37,71,.45);backdrop-filter:blur(6px)}
.modal[hidden]{display:none}
.login{width:100%;max-width:440px;padding:30px 28px;text-align:center}
.login img{height:84px}
.login h2{margin:10px 0 4px;font-size:22px;color:var(--deep)}
.login p{margin:0 0 20px;color:var(--sub);font-size:15px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input{width:100%;border:2px solid var(--line2);border-radius:12px;padding:12px 14px;font:inherit}
.field input:focus{outline:none;border-color:var(--mid)}
.err-msg{color:var(--bad);font-size:13px;min-height:18px;text-align:left}
.login .btn{width:100%;padding:13px;font-size:16px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
footer{margin-top:40px;font-size:13px;color:var(--sub);text-align:center}
/* ---------- responsive ---------- */
@media (max-width:900px){
  .menu-btn{display:grid;place-items:center}
  aside{position:fixed;left:0;top:64px;z-index:25;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--sh);background:#fff}
  body.nav-open aside{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:64px 0 0 0;background:rgba(47,37,71,.3);z-index:20}
  main{padding:18px 16px 50px}
  .hero{flex-direction:column;align-items:flex-start;padding:20px}
  .hero h1{font-size:26px}
  .hero .stats{margin-left:0}
  .brand small{display:none}
}
@media (max-width:600px){
  .vgrid{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .prompt .big{font-size:44px}
  .search{min-width:0;flex:1}
  .match{gap:10px}
  .mi.zh{font-size:20px}
  .qbox{padding:18px 16px}
  .rtop{padding:20px}
  .who .lbl{display:none}
  header{padding:0 10px;gap:8px}
  .brand img{height:36px}
  .brand b{font-size:14px;white-space:nowrap;letter-spacing:.02em}
  .who .chip{max-width:30vw;padding:5px 9px;font-size:12px}
  .who button{font-size:12px}
  .tabs .search{flex-basis:100%;width:100%}
  .tabs .sp{display:none}
}
@media print{
  header,aside,.tabs,#vocab,.ractions,.filter,.menu-btn{display:none!important}
  main{padding:0}
  .card{box-shadow:none}
}
/* ================= v2: lesson workspace ================= */
.nav .t{display:flex;flex-direction:column}
.nav .prog{height:5px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden;width:70%}
.nav .prog i{display:block;height:100%;background:linear-gradient(90deg,#F2B33D,#F59F00);border-radius:9px}
.nav a.on .prog{background:#fff}
.lhead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.lhead .badge{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--mid),#B39DE6);color:#fff;font-size:26px;font-weight:700;display:grid;place-items:center;flex:none;box-shadow:var(--sh)}
.lhead h1{margin:0;font-size:30px;line-height:1.2}
.lhead .sub{color:var(--sub);font-size:15px}
.lhead .home{margin-left:auto}
.parts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.parts .lbl{font-size:13px;color:var(--sub);font-weight:600;margin-right:2px}
.parts button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--deep);font-weight:600}
.parts button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.feat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.feat button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(91,63,160,.05);white-space:nowrap}
.feat button:hover{border-color:var(--line2);background:var(--lav2)}
.feat button.on{background:linear-gradient(135deg,var(--mid),#9C82D6);color:#fff;border-color:var(--mid)}
.feat button .ic{font-size:17px}
.pane{padding:22px 24px;margin-bottom:18px}
.pane h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pane h3 .zh{font-weight:500}
.note{font-size:14px;color:var(--sub);margin:-6px 0 14px}
/* vocab table */
table.vt{width:100%;border-collapse:collapse}
.vt th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);text-align:left;font-weight:700;padding:10px 10px;border-bottom:2px solid var(--line)}
.vt td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.vt tr:hover td{background:#FBF9FE}
.vt .hz{font-family:var(--zh);font-size:30px;font-weight:700;white-space:nowrap}
.vt .py{color:var(--warn);font-size:17px;white-space:nowrap}
.vt .ps{font-style:italic;color:var(--sub);font-size:14px;white-space:nowrap}
.vt .ex .zh{font-size:16px}
.vt .ex .evi{font-size:13px;color:var(--sub)}
.vt .pt{font-size:11px;font-weight:700;color:var(--mid);background:var(--lav2);border-radius:6px;padding:1px 6px;white-space:nowrap}
/* text */
.txt-tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.tbtn{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:6px 11px;font-size:13px;color:var(--deep);font-weight:600}
.tbtn.on{background:var(--lav);border-color:var(--mid)}
.scene{background:var(--bg);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:15px}
.scene .zh{font-size:17px}
.scene .vi{color:var(--sub);font-size:14px}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:start}
.dl .spn{background:var(--lav2);color:var(--deep);font-family:var(--zh);font-weight:700;border-radius:8px;padding:4px 10px;font-size:15px;white-space:nowrap;margin-top:6px}
.dl .ln{font-family:var(--zh);font-size:22px;line-height:1.9}
.para .ln{font-family:var(--zh);font-size:22px;line-height:2;text-indent:2em}
.cc{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;margin:0 1.5px 4px;vertical-align:bottom}
.cc i{font-style:normal;font-family:var(--vi);font-size:12.5px;color:var(--mid);font-weight:500;line-height:1.3}
mark.w{background:none;color:var(--bad);font-weight:700;cursor:help;border-bottom:2px dotted #F1A7A7}
.nohl mark.w{color:inherit;font-weight:inherit;border:none}
.qa{margin-top:16px;border-top:1px dashed var(--line2);padding-top:12px}
.qa h4{margin:0 0 8px;font-size:15px;color:var(--deep)}
.qa .it{padding:8px 0;border-bottom:1px solid var(--line)}
.qa .q{font-family:var(--zh);font-size:18px}
.qa .qv{font-size:13px;color:var(--sub)}
.qa .a{font-family:var(--zh);font-size:17px;color:var(--ok);margin-top:4px;display:none}
.qa .it.show .a{display:block}
.qa .rv{border:none;background:none;color:var(--mid);font-size:13px;text-decoration:underline;padding:0}
.tip{position:fixed;z-index:300;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;max-width:260px;pointer-events:none;box-shadow:var(--sh)}
.tip b{font-family:var(--zh);font-size:18px}
/* hanzi */
.chars{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chars button{font-family:var(--zh);font-size:24px;width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.chars button.on{border-color:var(--mid);background:var(--lav2)}
.hzwrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.hzbox{width:280px;height:280px;border:2px solid var(--line2);border-radius:16px;background:#fff;position:relative;flex:none}
.hzbox svg.grid{position:absolute;inset:0}
.hzinfo{flex:1;min-width:240px}
.hzinfo .big{font-family:var(--zh);font-size:64px;font-weight:700;line-height:1}
.hzinfo .py{color:var(--warn);font-size:20px;margin:6px 0}
.hzinfo .words{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.hzinfo .words div{background:var(--bg);border-radius:10px;padding:8px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat-line{font-size:14px;color:var(--sub);margin-top:10px}
/* flashcard */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.fc{width:min(460px,100%);height:300px;perspective:1200px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;border:1px solid var(--line);box-shadow:var(--sh)}
.fc .f{background:linear-gradient(160deg,#fff,var(--lav2))}
.fc .b{background:#fff;transform:rotateY(180deg)}
.fc .f .hz{font-family:var(--zh);font-size:84px;font-weight:700}
.fc .f .mean{font-size:26px;font-weight:600}
.fc .b .hz{font-family:var(--zh);font-size:40px;font-weight:700}
.fc .b .py{color:var(--warn);font-size:22px}
.fc .b .mean{font-size:19px;font-weight:600;margin:6px 0}
.fc .b .ex{font-family:var(--zh);font-size:16px;color:var(--ink)}
.fc .b .evi{font-size:13px;color:var(--sub)}
.fc .known{position:absolute;top:12px;right:14px;font-size:12px;font-weight:700;color:var(--ok);background:var(--okbg);border-radius:6px;padding:2px 8px}
.fc-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.fc-count{font-weight:700;color:var(--deep);min-width:70px;text-align:center}
.btn.okb{background:var(--ok)}.btn.okb:hover{background:#237032}
.btn.warnb{background:#E8590C}.btn.warnb:hover{background:#C2410C}
/* games */
.ghead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ghead .pill{background:var(--lav2);color:var(--deep);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.ghead .sp{flex:1}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mc{height:104px;perspective:900px;cursor:pointer}
.mc .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mc.open .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;padding:8px;text-align:center}
.mc .f{background:linear-gradient(135deg,var(--mid),#B39DE6);color:#fff;font-size:30px}
.mc .b{background:#fff;border:2px solid var(--line2);transform:rotateY(180deg);font-size:15px}
.mc .b.zhc{font-family:var(--zh);font-size:28px;font-weight:700}
.mc.done .b{border-color:var(--ok);background:var(--okbg)}
.mc.bad .b{border-color:var(--bad);background:var(--badbg)}
.done-box{text-align:center;padding:26px 10px}
.done-box .big{font-size:46px}
.done-box h4{margin:6px 0;font-size:22px}
/* sort */
.sort-q{text-align:center;margin-bottom:14px}
.sort-q .vi{font-size:18px;font-weight:600}
.slot{min-height:66px;border:2px dashed var(--line2);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#FBF9FE;margin-bottom:14px}
.slot.right{border-color:var(--ok);background:var(--okbg);border-style:solid}
.slot.wrong{border-color:var(--bad);background:var(--badbg);border-style:solid}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tile{font-family:var(--zh);font-size:22px;border:2px solid var(--line2);background:#fff;border-radius:10px;padding:6px 14px;color:var(--ink);box-shadow:0 2px 0 var(--line2)}
.tile:hover{border-color:var(--mid)}
.tile.used{visibility:hidden}
/* write */
.wr-q{text-align:center;margin-bottom:12px}
.wr-q .mean{font-size:24px;font-weight:700}
.wr-q .py{color:var(--warn);font-size:18px}
.wr-boxes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.wr-boxes .hzbox{width:200px;height:200px}
.wr-boxes .hzbox.cur{border-color:var(--mid);box-shadow:0 0 0 4px rgba(138,111,196,.18)}
.wr-boxes .hzbox.okk{border-color:var(--ok)}
/* stats */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.sgrid .stat{text-align:left}
.sgrid .stat b{font-size:24px}
table.st{width:100%;border-collapse:collapse;font-size:14px}
.st th,.st td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.st th{color:var(--mid);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.meter{height:8px;border-radius:9px;background:var(--line);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--mid)}
.known-list{display:flex;flex-wrap:wrap;gap:6px}
.known-list span{font-family:var(--zh);font-size:18px;border-radius:8px;padding:2px 10px;background:var(--badbg);color:var(--bad)}
.known-list span.k{background:var(--okbg);color:var(--ok)}
@media (max-width:900px){
  .feat{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .feat::-webkit-scrollbar{display:none}
  .lhead h1{font-size:23px}
  .lhead .badge{width:48px;height:48px;font-size:20px}
  .pane{padding:16px 14px}
  .vt thead{display:none}
  .vt tr{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .vt td{border:none;padding:0}
  .vt td.c1{grid-row:1/4}
  .vt td.c2{grid-column:2}
  .vt td.c4{grid-column:3;grid-row:1;text-align:right}
  .vt td.c3,.vt td.c5,.vt td.c6{grid-column:2/4}
  .dl{grid-template-columns:1fr auto}
  .dl .spn{grid-column:1/3;justify-self:start;margin-top:4px}
  .dl .ln,.para .ln{font-size:19px}
  .mem{grid-template-columns:repeat(3,1fr)}
  .mc{height:90px}
  .mc .b{font-size:13px}
  .hzbox{width:250px;height:250px}
  .lhead .home{display:none}
}
@media (max-width:600px){
  .wr-boxes .hzbox{width:150px;height:150px}
  .fc{height:270px}
  .fc .f .hz{font-size:70px}
}

/* bố cục kiểu sách: từ mới trái – bài khoá phải */
.book{display:grid;grid-template-columns:minmax(250px,32%) 1fr;gap:22px;align-items:start}
.nw{background:#FBF9FE;border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto}
.nwh{font-family:var(--zh);font-weight:700;font-size:18px;color:var(--deep);padding:0 4px 8px;border-bottom:2px solid var(--lav);margin-bottom:6px}
.nwh span{font-family:var(--vi);font-size:12px;font-weight:600;color:var(--sub);margin-left:6px}
.nwi{display:flex;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--line);border-radius:8px}
.nwi:hover{background:var(--lav2)}
.nwi .nn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--mid);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:4px}
.nwi .nb{flex:1;min-width:0}
.nwi .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nwi .l1 b{font-size:21px;cursor:pointer}
.nwi .np{color:var(--warn);font-size:15px}
.nwi .ns{font-style:italic;color:var(--sub);font-size:13px}
.nwi .l2{font-size:14.5px;line-height:1.4}
.nwi details{font-size:13px;margin-top:3px}
.nwi summary{color:var(--mid);cursor:pointer;font-size:12px}
.nwi details .zh{font-size:15px;cursor:pointer}
.nwi details .evi{color:var(--sub)}
.tb{min-width:0}
mark.w.lit{background:#FFF0C2;border-radius:4px}
@media (max-width:1000px){ .book{grid-template-columns:1fr} .nw{position:static;max-height:none} }

/* đục lỗ */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1px solid var(--line2);border-radius:12px;background:#FBF9FE;margin-bottom:16px;justify-content:center}
.bk{border:2px solid var(--line2);background:#fff;border-radius:10px;padding:6px 12px;display:flex;gap:8px;align-items:center;font-size:20px;color:var(--ink)}
.bk .k{font:700 13px var(--vi);color:#fff;background:var(--mid);border-radius:6px;width:22px;height:22px;display:grid;place-items:center}
.bk.used{opacity:.35}
.czl{display:flex;flex-direction:column;gap:10px}
.czi{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.czi .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lav2);color:var(--deep);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:6px}
.czs{font-size:21px;line-height:1.9}
.blank{font-family:var(--zh);font-size:18px;border:none;border-bottom:2px solid var(--mid);background:var(--lav2);border-radius:6px 6px 0 0;padding:0 10px;margin:0 3px;min-width:70px;color:var(--deep);font-weight:700}
.blank.act{background:#FFF0C2;border-color:#F59F00}
.blank.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.blank.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.czv{font-size:14px;color:var(--sub);margin-top:2px}
.pill{background:var(--lav2);color:var(--deep);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
/* sắp xếp ABC */
.abc{display:flex;flex-direction:column;gap:10px}
.abci{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;color:var(--ink);position:relative}
.abci:hover:not(:disabled){border-color:var(--mid)}
.abci .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--mid);color:#fff;font-weight:700;display:grid;place-items:center}
.abci .zh{font-size:20px;line-height:1.6}
.abci.used{border-color:var(--mid);background:var(--lav2)}
.abci .ord{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;background:#F59F00;color:#fff;font-weight:700;display:grid;place-items:center}
.ans-row{margin:14px 0 4px;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--sub)}
.ans-row .sq{width:40px;height:40px;border:2px dashed var(--line2);border-radius:10px;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--deep);background:#fff}

      {"n": 1, "type": "dialog", "scene": "在王一飞家客厅，杨同乐和王一飞在聊天儿。", "scenePy": ["zài", "wáng", "yì", "fēi", "jiā", "kè", "tīng", "", "yáng", "tóng", "lè", "hé", "wáng", "yì", "fēi", "zài", "liáo", "tiān", "r", ""], "sceneVi": "", "lines": [{"sp": "杨同乐", "zh": "这个假期咱们去哪儿玩玩吧。", "py": ["zhè", "ge", "jià", "qī", "zán", "men", "qù", "nǎ", "r", "wán", "wán", "ba", ""]}, {"sp": "王一飞", "zh": "好啊，你想去哪儿，咱们就去哪儿。", "py": ["hǎo", "a", "", "nǐ", "xiǎng", "qù", "nǎ", "r", "", "zán", "men", "jiù", "qù", "nǎ", "r", ""]}, {"sp": "杨同乐", "zh": "你喜欢海，找个海边住几天，怎么样？", "py": ["nǐ", "xǐ", "huan", "hǎi", "", "zhǎo", "gè", "hǎi", "biān", "zhù", "jǐ", "tiān", "", "zěn", "me", "yàng", ""]}, {"sp": "王一飞", "zh": "现在去海边有点儿冷。", "py": ["xiàn", "zài", "qù", "hǎi", "biān", "yǒu", "diǎn", "r", "lěng", ""]}, {"sp": "杨同乐", "zh": "那去草原吧？草原一点儿也不冷。", "py": ["nà", "qù", "cǎo", "yuán", "ba", "", "cǎo", "yuán", "yì", "diǎn", "r", "yě", "bù", "lěng", ""]}, {"sp": "王一飞", "zh": "这个主意好！我好久没骑马了。", "py": ["zhè", "ge", "zhǔ", "yi", "hǎo", "", "wǒ", "hǎo", "jiǔ", "méi", "qí", "mǎ", "le", ""]}, {"sp": "杨同乐", "zh": "对，在草原上骑马、吃羊肉、看月亮，一定很有意思。", "py": ["duì", "", "zài", "cǎo", "yuán", "shàng", "qí", "mǎ", "", "chī", "yáng", "ròu", "", "kàn", "yuè", "liang", "", "yí", "dìng", "hěn", "yǒu", "yì", "si", ""]}], "qa": [{"q": "王一飞为什么不想去海边？", "qVi": "Vì sao Vương Nhất Phi không muốn ra biển?", "a": "因为现在去海边有点儿冷。"}, {"q": "王一飞为什么觉得去草原好？", "qVi": "Vì sao Vương Nhất Phi thấy đi thảo nguyên hay?", "a": "因为草原一点儿也不冷，她也好久没骑马了。"}, {"q": "他们在草原上可以做什么？", "qVi": "Trên thảo nguyên họ có thể làm gì?", "a": "可以骑马、吃羊肉、看月亮。"}]},
      {"n": 2, "type": "dialog", "scene": "在王一飞家客厅，杨同乐和王一飞在聊天儿。", "scenePy": ["zài", "wáng", "yì", "fēi", "jiā", "kè", "tīng", "", "yáng", "tóng", "lè", "hé", "wáng", "yì", "fēi", "zài", "liáo", "tiān", "r", ""], "sceneVi": "", "lines": [{"sp": "杨同乐", "zh": "出去玩的机票买好了吗？", "py": ["chū", "qù", "wán", "de", "jī", "piào", "mǎi", "hǎo", "le", "ma", ""]}, {"sp": "王一飞", "zh": "买好了。星期六上午十点一刻起飞。", "py": ["mǎi", "hǎo", "le", "", "xīng", "qī", "liù", "shàng", "wǔ", "shí", "diǎn", "yí", "kè", "qǐ", "fēi", ""]}, {"sp": "杨同乐", "zh": "宾馆也选好了吗？", "py": ["bīn", "guǎn", "yě", "xuǎn", "hǎo", "le", "ma", ""]}, {"sp": "王一飞", "zh": "是的，这家宾馆很特别，跟别的都不一样，一出门就能看见牛和羊！", "py": ["shì", "de", "", "zhè", "jiā", "bīn", "guǎn", "hěn", "tè", "bié", "", "gēn", "bié", "de", "dōu", "bù", "yí", "yàng", "", "yì", "chū", "mén", "jiù", "néng", "kàn", "jiàn", "niú", "hé", "yáng", ""]}, {"sp": "杨同乐", "zh": "太好了！你看看要带什么东西？", "py": ["tài", "hǎo", "le", "", "nǐ", "kàn", "kan", "yào", "dài", "shén", "me", "dōng", "xi", ""]}, {"sp": "王一飞", "zh": "我们不用带太多东西，别忘了拿上新买的相机。", "py": ["wǒ", "men", "bú", "yòng", "dài", "tài", "duō", "dōng", "xi", "", "bié", "wàng", "le", "ná", "shàng", "xīn", "mǎi", "de", "xiàng", "jī", ""]}, {"sp": "杨同乐", "zh": "一定不会忘带的。我现在就去准备行李。", "py": ["yí", "dìng", "bú", "huì", "wàng", "dài", "de", "", "wǒ", "xiàn", "zài", "jiù", "qù", "zhǔn", "bèi", "xíng", "li", ""]}], "qa": [{"q": "他们什么时候坐飞机出去玩？", "qVi": "Khi nào họ đi máy bay đi chơi?", "a": "星期六上午十点一刻。"}, {"q": "王一飞选的宾馆怎么样？", "qVi": "Khách sạn Vương Nhất Phi chọn thế nào?", "a": "很特别，跟别的都不一样，一出门就能看见牛和羊。"}, {"q": "杨同乐说一定不会忘带什么？", "qVi": "Dương Đồng Lạc nói chắc chắn không quên mang gì?", "a": "新买的相机。"}]},
      {"n": 3, "type": "dialog", "scene": "在机场，杨同乐和王一飞走出来，跟他们预约的司机兼导游见面。", "scenePy": ["zài", "jī", "chǎng", "", "yáng", "tóng", "lè", "hé", "wáng", "yì", "fēi", "zǒu", "chū", "lái", "", "gēn", "tā", "men", "yù", "yuē", "de", "sī", "jī", "jiān", "dǎo", "yóu", "jiàn", "miàn", ""], "sceneVi": "", "lines": [{"sp": "小李", "zh": "欢迎你们！我是你们的司机，我姓李，叫我小李就可以。", "py": ["huān", "yíng", "nǐ", "men", "", "wǒ", "shì", "nǐ", "men", "de", "sī", "jī", "", "wǒ", "xìng", "lǐ", "", "jiào", "wǒ", "xiǎo", "lǐ", "jiù", "kě", "yǐ", ""]}, {"sp": "杨同乐", "zh": "您好！不好意思，飞机晚点了，让您久等了。", "py": ["nín", "hǎo", "", "bù", "hǎo", "yì", "si", "", "fēi", "jī", "wǎn", "diǎn", "le", "", "ràng", "nín", "jiǔ", "děng", "le", ""]}, {"sp": "小李", "zh": "没关系。除了这个行李箱以外，还有别的东西吗？", "py": ["méi", "guān", "xi", "", "chú", "le", "zhè", "ge", "xíng", "li", "xiāng", "yǐ", "wài", "", "hái", "yǒu", "bié", "de", "dōng", "xi", "ma", ""]}, {"sp": "杨同乐", "zh": "还有一个包，我自己拿就可以。", "py": ["hái", "yǒu", "yí", "ge", "bāo", "", "wǒ", "zì", "jǐ", "ná", "jiù", "kě", "yǐ", ""]}, {"sp": "小李", "zh": "车在一层，请跟我来。", "py": ["chē", "zài", "yì", "céng", "", "qǐng", "gēn", "wǒ", "lái", ""]}, {"sp": "杨同乐", "zh": "我们住的宾馆离机场远吗？", "py": ["wǒ", "men", "zhù", "de", "bīn", "guǎn", "lí", "jī", "chǎng", "yuǎn", "ma", ""]}, {"sp": "小李", "zh": "不远，三十分钟就能到。两位到了可以先休息休息，晚饭的时候我叫你们。", "py": ["bù", "yuǎn", "", "sān", "shí", "fēn", "zhōng", "jiù", "néng", "dào", "", "liǎng", "wèi", "dào", "le", "kě", "yǐ", "xiān", "xiū", "xi", "xiū", "xi", "", "wǎn", "fàn", "de", "shí", "hou", "wǒ", "jiào", "nǐ", "men", ""]}], "qa": [{"q": "他们为什么到晚了？", "qVi": "Vì sao họ đến muộn?", "a": "因为飞机晚点了。"}, {"q": "他们有几个行李箱？", "qVi": "Họ có mấy chiếc va li?", "a": "一个行李箱，还有一个包。"}, {"q": "宾馆离机场远吗？", "qVi": "Khách sạn có xa sân bay không?", "a": "不远，三十分钟就能到。"}]},
      {"n": 4, "type": "para", "scene": "在宾馆房间，王一飞在写日记。", "scenePy": ["zài", "bīn", "guǎn", "fáng", "jiān", "", "wáng", "yì", "fēi", "zài", "xiě", "rì", "jì", ""], "sceneVi": "", "lines": [{"sp": "", "zh": "今天是我们旅游的第一天。我们很早就起床去机场了，没想到飞机晚点了。我们到的时候，天已经黑了，但是司机小李一直在机场等我们，一点儿也没着急。他特别热情，路上给我们介绍了很多东西，还准备了水果。宾馆的房间跟我想的一样漂亮，又大又干净，我非常满意。", "py": ["jīn", "tiān", "shì", "wǒ", "men", "lǚ", "yóu", "de", "dì", "yī", "tiān", "", "wǒ", "men", "hěn", "zǎo", "jiù", "qǐ", "chuáng", "qù", "jī", "chǎng", "le", "", "méi", "xiǎng", "dào", "fēi", "jī", "wǎn", "diǎn", "le", "", "wǒ", "men", "dào", "de", "shí", "hou", "", "tiān", "yǐ", "jīng", "hēi", "le", "", "dàn", "shì", "sī", "jī", "xiǎo", "lǐ", "yì", "zhí", "zài", "jī", "chǎng", "děng", "wǒ", "men", "", "yì", "diǎn", "r", "yě", "méi", "zháo", "jí", "", "tā", "tè", "bié", "rè", "qíng", "", "lù", "shang", "gěi", "wǒ", "men", "jiè", "shào", "le", "hěn", "duō", "dōng", "xi", "", "hái", "zhǔn", "bèi", "le", "shuǐ", "guǒ", "", "bīn", "guǎn", "de", "fáng", "jiān", "gēn", "wǒ", "xiǎng", "de", "yí", "yàng", "piào", "liang", "", "yòu", "dà", "yòu", "gān", "jìng", "", "wǒ", "fēi", "cháng", "mǎn", "yì", ""]}], "qa": [{"q": "他们是怎么去宾馆的？", "qVi": "Họ đến khách sạn bằng cách nào?", "a": "司机小李开车送他们去的。"}, {"q": "王一飞为什么觉得小李很热情？", "qVi": "Vì sao Vương Nhất Phi thấy Tiểu Lý rất nhiệt tình?", "a": "因为小李一直在机场等他们，路上给他们介绍了很多东西，还准备了水果。"}, {"q": "宾馆的房间怎么样？", "qVi": "Phòng khách sạn thế nào?", "a": "跟她想的一样漂亮，又大又干净。"}]}

      {"n": 1, "type": "dialog", "scene": "在街上，白家月和李文边散步边聊天儿。", "scenePy": ["zài", "jiē", "shàng", "", "bái", "jiā", "yuè", "hé", "lǐ", "wén", "biān", "sàn", "bù", "biān", "liáo", "tiān", "r", ""], "sceneVi": "", "lines": [{"sp": "白家月", "zh": "这个星期总是阴天，今天终于晴了。", "py": ["zhè", "ge", "xīng", "qī", "zǒng", "shì", "yīn", "tiān", "", "jīn", "tiān", "zhōng", "yú", "qíng", "le", ""]}, {"sp": "李文", "zh": "现在天气好得很！我们去爬山怎么样？", "py": ["xiàn", "zài", "tiān", "qì", "hǎo", "dé", "hěn", "", "wǒ", "men", "qù", "pá", "shān", "zěn", "me", "yàng", ""]}, {"sp": "白家月", "zh": "好啊！又能锻炼身体，又能照好看的照片。", "py": ["hǎo", "a", "", "yòu", "néng", "duàn", "liàn", "shēn", "tǐ", "", "yòu", "néng", "zhào", "hǎo", "kàn", "de", "zhào", "piàn", ""]}, {"sp": "李文", "zh": "那我带点儿水和吃的，咱们现在就去？", "py": ["nà", "wǒ", "dài", "diǎn", "r", "shuǐ", "hé", "chī", "de", "", "zán", "men", "xiàn", "zài", "jiù", "qù", ""]}, {"sp": "白家月", "zh": "我回去穿上运动鞋，拿上大衣。要不要叫一雪姐一起去？", "py": ["wǒ", "huí", "qù", "chuān", "shàng", "yùn", "dòng", "xié", "", "ná", "shàng", "dà", "yī", "", "yào", "bu", "yào", "jiào", "yì", "xuě", "jiě", "yì", "qǐ", "qù", ""]}, {"sp": "李文", "zh": "好主意。给她打个电话吧。", "py": ["hǎo", "zhǔ", "yi", "", "gěi", "tā", "dǎ", "gè", "diàn", "huà", "ba", ""]}], "qa": [{"q": "白家月觉得爬山怎么样？", "qVi": "Bạch Gia Nguyệt thấy leo núi thế nào?", "a": "又能锻炼身体，又能照好看的照片。"}, {"q": "李文要带什么东西？", "qVi": "Lý Văn định mang gì?", "a": "他要带点儿水和吃的。"}, {"q": "白家月要先回去做什么？", "qVi": "Bạch Gia Nguyệt phải về làm gì trước?", "a": "她要回去穿上运动鞋，拿上大衣。"}]},
      {"n": 2, "type": "dialog", "scene": "在出租车上，王一雪和白家月在聊天儿。", "scenePy": ["zài", "chū", "zū", "chē", "shàng", "", "wáng", "yì", "xuě", "hé", "bái", "jiā", "yuè", "zài", "liáo", "tiān", "r", ""], "sceneVi": "", "lines": [{"sp": "白家月", "zh": "这些照片是谁给您照的？张张都非常好看。", "py": ["zhè", "xiē", "zhào", "piàn", "shì", "shuí", "gěi", "nín", "zhào", "de", "", "zhāng", "zhāng", "dōu", "fēi", "cháng", "hǎo", "kàn", ""]}, {"sp": "王一雪", "zh": "一飞。她对拍照一直很感兴趣，经常给我照相。", "py": ["yì", "fēi", "", "tā", "duì", "pāi", "zhào", "yì", "zhí", "hěn", "gǎn", "xìng", "qù", "", "jīng", "cháng", "gěi", "wǒ", "zhào", "xiàng", ""]}, {"sp": "白家月", "zh": "我喜欢您大笑的这张，看起来很漂亮。", "py": ["wǒ", "xǐ", "huan", "nín", "dà", "xiào", "de", "zhè", "zhāng", "", "kàn", "qǐ", "lái", "hěn", "piào", "liang", ""]}, {"sp": "王一雪", "zh": "我觉得这张有点儿难看，那时候我不知道她在给我照相。", "py": ["wǒ", "jué", "de", "zhè", "zhāng", "yǒu", "diǎn", "r", "nán", "kàn", "", "nà", "shí", "hou", "wǒ", "bù", "zhī", "dào", "tā", "zài", "gěi", "wǒ", "zhào", "xiàng", ""]}, {"sp": "白家月", "zh": "这样的照片才好看。我也喜欢拍照，爬山的时候我给您照几张照片吧。", "py": ["zhè", "yàng", "de", "zhào", "piàn", "cái", "hǎo", "kàn", "", "wǒ", "yě", "xǐ", "huan", "pāi", "zhào", "", "pá", "shān", "de", "shí", "hou", "wǒ", "gěi", "nín", "zhào", "jǐ", "zhāng", "zhào", "piàn", "ba", ""]}, {"sp": "王一雪", "zh": "好，我可以比较一下你们两个谁的水平高。", "py": ["hǎo", "", "wǒ", "kě", "yǐ", "bǐ", "jiào", "yí", "xià", "nǐ", "men", "liǎng", "ge", "shuí", "de", "shuǐ", "píng", "gāo", ""]}], "qa": [{"q": "白家月喜欢哪张照片？为什么？", "qVi": "Bạch Gia Nguyệt thích tấm ảnh nào? Vì sao?", "a": "她喜欢王一雪大笑的那张，因为看起来很漂亮。"}, {"q": "王一雪为什么不喜欢这张照片？", "qVi": "Vì sao Vương Nhất Tuyết không thích tấm ảnh này?", "a": "她觉得有点儿难看，那时候她不知道一飞在给她照相。"}, {"q": "爬山的时候，白家月打算做什么？", "qVi": "Khi leo núi, Bạch Gia Nguyệt định làm gì?", "a": "她打算给王一雪照几张照片。"}]},
      {"n": 3, "type": "dialog", "scene": "在山上，王一雪和白家月边走边聊。", "scenePy": ["zài", "shān", "shàng", "", "wáng", "yì", "xuě", "hé", "bái", "jiā", "yuè", "biān", "zǒu", "biān", "liáo", ""], "sceneVi": "", "lines": [{"sp": "王一雪", "zh": "家月，这里挺漂亮的，咱们在这里拍照吧。", "py": ["jiā", "yuè", "", "zhè", "li", "tǐng", "piào", "liang", "de", "", "zán", "men", "zài", "zhè", "li", "pāi", "zhào", "ba", ""]}, {"sp": "白家月", "zh": "这边没有太阳，咱们去那边吧。", "py": ["zhè", "biān", "méi", "yǒu", "tài", "yáng", "", "zán", "men", "qù", "nà", "biān", "ba", ""]}, {"sp": "王一雪", "zh": "好。你觉得我站在这些树中间怎么样？", "py": ["hǎo", "", "nǐ", "jué", "de", "wǒ", "zhàn", "zài", "zhè", "xiē", "shù", "zhōng", "jiān", "zěn", "me", "yàng", ""]}, {"sp": "白家月", "zh": "挺好的。等一下，后边走过去两个人。", "py": ["tǐng", "hǎo", "de", "", "děng", "yí", "xià", "", "hòu", "biān", "zǒu", "guò", "qù", "liǎng", "ge", "rén", ""]}, {"sp": "王一雪", "zh": "我准备好了，你照的时候告诉我。", "py": ["wǒ", "zhǔn", "bèi", "hǎo", "le", "", "nǐ", "zhào", "de", "shí", "hou", "gào", "su", "wǒ", ""]}, {"sp": "白家月", "zh": "你不用看着我，想干什么都可以。", "py": ["nǐ", "bú", "yòng", "kàn", "zhe", "wǒ", "", "xiǎng", "gàn", "shén", "me", "dōu", "kě", "yǐ", ""]}, {"sp": "王一雪", "zh": "树上飞来了几只鸟，我就看它们吧。", "py": ["shù", "shàng", "fēi", "lái", "le", "jǐ", "zhī", "niǎo", "", "wǒ", "jiù", "kàn", "tā", "men", "ba", ""]}, {"sp": "白家月", "zh": "啊，手机没电了。", "py": ["a", "", "shǒu", "jī", "méi", "diàn", "le", ""]}], "qa": [{"q": "王一雪想站在哪儿拍照？", "qVi": "Vương Nhất Tuyết muốn đứng ở đâu chụp ảnh?", "a": "她想站在这些树中间拍照。"}, {"q": "白家月为什么要等一下再照？", "qVi": "Vì sao Bạch Gia Nguyệt phải đợi một chút mới chụp?", "a": "因为后边走过去两个人。"}, {"q": "白家月的手机怎么了？", "qVi": "Điện thoại của Bạch Gia Nguyệt làm sao?", "a": "她的手机没电了。"}]},
      {"n": 4, "type": "para", "scene": "在咖啡厅里，王一雪给白家月发短信。", "scenePy": ["zài", "kā", "fēi", "tīng", "lǐ", "", "wáng", "yì", "xuě", "gěi", "bái", "jiā", "yuè", "fā", "duǎn", "xìn", ""], "sceneVi": "", "lines": [{"sp": "", "zh": "家月，我收到了你的那封邮件，也看到了你给我照的照片，张张都很漂亮。我已经告诉了一飞，你的拍照水平比她高，她难过得很，哈哈。不知道你对中国的音乐有没有兴趣？我送你一张明天下午音乐会的门票。音乐会七点多结束，你听完了音乐会就来我家吃饭，尝尝我做的中国菜。你觉得怎么样？", "py": ["jiā", "yuè", "", "wǒ", "shōu", "dào", "le", "nǐ", "de", "nà", "fēng", "yóu", "jiàn", "", "yě", "kàn", "dào", "le", "nǐ", "gěi", "wǒ", "zhào", "de", "zhào", "piàn", "", "zhāng", "zhāng", "dōu", "hěn", "piào", "liang", "", "wǒ", "yǐ", "jīng", "gào", "su", "le", "yì", "fēi", "", "nǐ", "de", "pāi", "zhào", "shuǐ", "píng", "bǐ", "tā", "gāo", "", "tā", "nán", "guò", "dé", "hěn", "", "hā", "hā", "", "bù", "zhī", "dào", "nǐ", "duì", "zhōng", "guó", "de", "yīn", "yuè", "yǒu", "méi", "yǒu", "xìng", "qù", "", "wǒ", "sòng", "nǐ", "yì", "zhāng", "míng", "tiān", "xià", "wǔ", "yīn", "yuè", "huì", "de", "mén", "piào", "", "yīn", "yuè", "huì", "qī", "diǎn", "duō", "jié", "shù", "", "nǐ", "tīng", "wán", "le", "yīn", "yuè", "huì", "jiù", "lái", "wǒ", "jiā", "chī", "fàn", "", "cháng", "cháng", "wǒ", "zuò", "de", "zhōng", "guó", "cài", "", "nǐ", "jué", "de", "zěn", "me", "yàng", ""]}], "qa": [{"q": "王一雪觉得白家月的拍照水平怎么样？", "qVi": "Vương Nhất Tuyết thấy trình độ chụp ảnh của Gia Nguyệt thế nào?", "a": "她觉得白家月的拍照水平比一飞高。"}, {"q": "音乐会什么时候结束？", "qVi": "Buổi hòa nhạc khi nào kết thúc?", "a": "七点多结束。"}, {"q": "听完音乐会，白家月可能做什么？", "qVi": "Nghe hòa nhạc xong, Gia Nguyệt có thể làm gì?", "a": "她可能去王一雪家吃饭，尝尝王一雪做的中国菜。"}]}

      {"n": 1, "type": "dialog", "scene": "在咖啡厅里，李文和白家月在聊天儿。", "scenePy": ["zài", "kā", "fēi", "tīng", "lǐ", "", "lǐ", "wén", "hé", "bái", "jiā", "yuè", "zài", "liáo", "tiān", "r", ""], "sceneVi": "", "lines": [{"sp": "李文", "zh": "家月，咱们该买去上海的票了。你打算怎么去上海？", "py": ["jiā", "yuè", "", "zán", "men", "gāi", "mǎi", "qù", "shàng", "hǎi", "de", "piào", "le", "", "nǐ", "dǎ", "suan", "zěn", "me", "qù", "shàng", "hǎi", ""]}, {"sp": "白家月", "zh": "我还没坐过高铁，咱们坐高铁去，怎么样？", "py": ["wǒ", "hái", "méi", "zuò", "guò", "gāo", "tiě", "", "zán", "men", "zuò", "gāo", "tiě", "qù", "", "zěn", "me", "yàng", ""]}, {"sp": "李文", "zh": "没问题，从北京到上海的高铁很多，非常方便。", "py": ["méi", "wèn", "tí", "", "cóng", "běi", "jīng", "dào", "shàng", "hǎi", "de", "gāo", "tiě", "hěn", "duō", "", "fēi", "cháng", "fāng", "biàn", ""]}, {"sp": "白家月", "zh": "行！怎么买高铁票？", "py": ["xíng", "", "zěn", "me", "mǎi", "gāo", "tiě", "piào", ""]}, {"sp": "李文", "zh": "用手机App就能买。给我你的护照，我帮你买。", "py": ["yòng", "shǒu", "jī", "", "", "", "A", "p", "p", "", "jiù", "néng", "mǎi", "gěi", "wǒ", "nǐ", "", "de", "hù", "zhào", "wǒ", ""]}, {"sp": "白家月", "zh": "早就听说过高铁，终于可以坐上了。", "py": ["zǎo", "jiù", "tīng", "shuō", "guò", "gāo", "tiě", "", "zhōng", "yú", "kě", "yǐ", "zuò", "shàng", "le", ""]}, {"sp": "李文", "zh": "高铁又快又舒服，你一定会喜欢的。", "py": ["gāo", "tiě", "yòu", "kuài", "yòu", "shū", "fu", "", "nǐ", "yí", "dìng", "huì", "xǐ", "huan", "de", ""]}], "qa": [{"q": "李文和白家月打算去哪个城市？", "qVi": "Lý Văn và Bạch Gia Nguyệt định đi thành phố nào?", "a": "他们打算去上海。"}, {"q": "白家月为什么想坐高铁？", "qVi": "Vì sao Bạch Gia Nguyệt muốn đi tàu cao tốc?", "a": "因为她还没坐过高铁，早就听说过高铁。"}, {"q": "他们打算怎么买高铁票？", "qVi": "Họ định mua vé tàu cao tốc thế nào?", "a": "用手机App买。"}]},
      {"n": 2, "type": "dialog", "scene": "在车上，刘明开车送白家月和李文去高铁站。", "scenePy": ["zài", "chē", "shàng", "", "liú", "míng", "kāi", "chē", "sòng", "bái", "jiā", "yuè", "hé", "lǐ", "wén", "qù", "gāo", "tiě", "zhàn", ""], "sceneVi": "", "lines": [{"sp": "刘明", "zh": "过了前面的路口就到高铁站了。", "py": ["guò", "le", "qián", "mian", "de", "lù", "kǒu", "jiù", "dào", "gāo", "tiě", "zhàn", "le", ""]}, {"sp": "白家月", "zh": "我看见了。马上就到了，这条路车很多，您小心点儿。", "py": ["wǒ", "kàn", "jiàn", "le", "", "mǎ", "shàng", "jiù", "dào", "le", "", "zhè", "tiáo", "lù", "chē", "hěn", "duō", "", "nín", "xiǎo", "xīn", "diǎn", "r", ""]}, {"sp": "刘明", "zh": "好，你们还有一个小时，应该不会迟到的。", "py": ["hǎo", "", "nǐ", "men", "hái", "yǒu", "yí", "ge", "xiǎo", "shí", "", "yīng", "gāi", "bú", "huì", "chí", "dào", "de", ""]}, {"sp": "白家月", "zh": "我发现这条路车多，红绿灯也多。", "py": ["wǒ", "fā", "xiàn", "zhè", "tiáo", "lù", "chē", "duō", "", "hóng", "lǜ", "dēng", "yě", "duō", ""]}, {"sp": "刘明", "zh": "是啊，这条路我走过一次，后来再也不走了。", "py": ["shì", "a", "", "zhè", "tiáo", "lù", "wǒ", "zǒu", "guò", "yí", "cì", "", "hòu", "lái", "zài", "yě", "bù", "zǒu", "le", ""]}, {"sp": "白家月", "zh": "那您今天为什么走了这条路？", "py": ["nà", "nín", "jīn", "tiān", "wèi", "shén", "me", "zǒu", "le", "zhè", "tiáo", "lù", ""]}, {"sp": "刘明", "zh": "我一急就走错了。如果没走错，二十分钟以前就到了。", "py": ["wǒ", "yì", "jí", "jiù", "zǒu", "cuò", "le", "", "rú", "guǒ", "méi", "zǒu", "cuò", "", "èr", "shí", "fēn", "zhōng", "yǐ", "qián", "jiù", "dào", "le", ""]}], "qa": [{"q": "刘明为什么说“应该不会迟到”？", "qVi": "Vì sao Lưu Minh nói “chắc sẽ không muộn”?", "a": "因为他们还有一个小时。"}, {"q": "白家月觉得这条路有什么问题？", "qVi": "Bạch Gia Nguyệt thấy đường này có vấn đề gì?", "a": "这条路车多，红绿灯也多。"}, {"q": "刘明为什么今天走了这条路？", "qVi": "Vì sao hôm nay Lưu Minh lại đi đường này?", "a": "因为他一急就走错了。"}]},
      {"n": 3, "type": "dialog", "scene": "在高铁站，李文和白家月排队安检、检票。", "scenePy": ["zài", "gāo", "tiě", "zhàn", "", "lǐ", "wén", "hé", "bái", "jiā", "yuè", "pái", "duì", "ān", "jiǎn", "", "jiǎn", "piào", ""], "sceneVi": "", "lines": [{"sp": "白家月", "zh": "李文，我的耳机没电了，你有充电宝吗？", "py": ["lǐ", "wén", "", "wǒ", "de", "ěr", "jī", "méi", "diàn", "le", "", "nǐ", "yǒu", "chōng", "diàn", "bǎo", "ma", ""]}, {"sp": "李文", "zh": "有，这些常用的东西我都放在包里了，我给你拿。", "py": ["yǒu", "", "zhè", "xiē", "cháng", "yòng", "de", "dōng", "xi", "wǒ", "dōu", "fàng", "zài", "bāo", "lǐ", "le", "", "wǒ", "gěi", "nǐ", "ná", ""]}, {"sp": "白家月", "zh": "前面的人越来越多。", "py": ["qián", "mian", "de", "rén", "yuè", "lái", "yuè", "duō", ""]}, {"sp": "李文", "zh": "对，马上就进高铁站了。咱们一起走，别分开。", "py": ["duì", "", "mǎ", "shàng", "jiù", "jìn", "gāo", "tiě", "zhàn", "le", "", "zán", "men", "yì", "qǐ", "zǒu", "", "bié", "fēn", "kāi", ""]}, {"sp": "白家月", "zh": "好，你检查一下，高铁票都拿好了吗？", "py": ["hǎo", "", "nǐ", "jiǎn", "chá", "yí", "xià", "", "gāo", "tiě", "piào", "dōu", "ná", "hǎo", "le", "ma", ""]}, {"sp": "李文", "zh": "不用拿票，刷护照就能检票进站。", "py": ["bú", "yòng", "ná", "piào", "", "shuā", "hù", "zhào", "jiù", "néng", "jiǎn", "piào", "jìn", "zhàn", ""]}, {"sp": "白家月", "zh": "去哪里检票？", "py": ["qù", "nǎ", "li", "jiǎn", "piào", ""]}, {"sp": "李文", "zh": "检票口在二层，我们一会儿坐电梯上去。", "py": ["jiǎn", "piào", "kǒu", "zài", "èr", "céng", "", "wǒ", "men", "yí", "huì", "r", "zuò", "diàn", "tī", "shàng", "qù", ""]}], "qa": [{"q": "白家月为什么要用充电宝？", "qVi": "Vì sao Bạch Gia Nguyệt cần dùng sạc dự phòng?", "a": "因为她的耳机没电了。"}, {"q": "他们怎么检票进站？", "qVi": "Họ soát vé vào ga bằng cách nào?", "a": "不用拿票，刷护照就能检票进站。"}, {"q": "他们怎么去检票口？", "qVi": "Họ lên cửa soát vé bằng cách nào?", "a": "坐电梯上去，检票口在二层。"}]},
      {"n": 4, "type": "para", "scene": "在家里，白家月给安妮打电话介绍自己的旅行。", "scenePy": ["zài", "jiā", "li", "", "bái", "jiā", "yuè", "gěi", "ān", "nī", "dǎ", "diàn", "huà", "jiè", "shào", "zì", "jǐ", "de", "lǚ", "xíng", ""], "sceneVi": "", "lines": [{"sp": "", "zh": "这次放假，我去了北京，还去了上海。我是从北京南站坐高铁去的上海。我觉得坐在高铁上跟坐在家里的沙发上一样，又安静又舒服。坐累了就站一会儿，饿了就点外卖。对，你没听错，高铁上可以点外卖，只需要选择好车站和想吃的东西，到站时不用下车，服务员就会给你拿过来。现在喜欢坐高铁的人越来越多。我爸妈来中国旅游的时候，必须带他们也坐一次高铁。", "py": ["zhè", "cì", "fàng", "jià", "", "wǒ", "qù", "le", "běi", "jīng", "", "hái", "qù", "le", "shàng", "hǎi", "", "wǒ", "shì", "cóng", "běi", "jīng", "nán", "zhàn", "zuò", "gāo", "tiě", "qù", "de", "shàng", "hǎi", "", "wǒ", "jué", "de", "zuò", "zài", "gāo", "tiě", "shàng", "gēn", "zuò", "zài", "jiā", "li", "de", "shā", "fā", "shàng", "yí", "yàng", "", "yòu", "ān", "jìng", "yòu", "shū", "fu", "", "zuò", "lèi", "le", "jiù", "zhàn", "yí", "huì", "r", "", "è", "le", "jiù", "diǎn", "wài", "mài", "", "duì", "", "nǐ", "méi", "tīng", "cuò", "", "gāo", "tiě", "shàng", "kě", "yǐ", "diǎn", "wài", "mài", "", "zhī", "xū", "yào", "xuǎn", "zé", "hǎo", "chē", "zhàn", "hé", "xiǎng", "chī", "de", "dōng", "xi", "", "dào", "zhàn", "shí", "bú", "yòng", "xià", "chē", "", "fú", "wù", "yuán", "jiù", "huì", "gěi", "nǐ", "ná", "guò", "lái", "", "xiàn", "zài", "xǐ", "huan", "zuò", "gāo", "tiě", "de", "rén", "yuè", "lái", "yuè", "duō", "", "wǒ", "bà", "mā", "lái", "zhōng", "guó", "lǚ", "yóu", "de", "shí", "hou", "", "bì", "xū", "dài", "tā", "men", "yě", "zuò", "yí", "cì", "gāo", "tiě", ""]}], "qa": [{"q": "白家月是怎么去上海的？", "qVi": "Bạch Gia Nguyệt đi Thượng Hải bằng cách nào?", "a": "她是从北京南站坐高铁去的上海。"}, {"q": "高铁上怎么点外卖？", "qVi": "Gọi đồ ăn trên tàu cao tốc thế nào?", "a": "选择好车站和想吃的东西，到站时服务员就会给你拿过来。"}, {"q": "白家月想带谁坐高铁？", "qVi": "Bạch Gia Nguyệt muốn đưa ai đi tàu cao tốc?", "a": "她想带爸妈坐一次高铁。"}]}

      {"n": 3, "type": "dialog", "scene": "在商店，王一雪在买东西。", "scenePy": ["zài", "shāng", "diàn", "", "wáng", "yì", "xuě", "zài", "mǎi", "dōng", "xi", ""], "sceneVi": "", "lines": [{"sp": "店员", "zh": "西瓜又大又新鲜，不甜不要钱！", "py": ["xī", "guā", "yòu", "dà", "yòu", "xīn", "xiān", "", "bù", "tián", "bú", "yào", "qián", ""]}, {"sp": "王一雪", "zh": "西瓜看起来不错，怎么卖？", "py": ["xī", "guā", "kàn", "qǐ", "lái", "bú", "cuò", "", "zěn", "me", "mài", ""]}, {"sp": "店员", "zh": "五块钱一公斤。来，您先尝尝这块冰西瓜，甜极了！", "py": ["wǔ", "kuài", "qián", "yì", "gōng", "jīn", "", "lái", "", "nín", "xiān", "cháng", "cháng", "zhè", "kuài", "bīng", "xī", "guā", "", "tián", "jí", "le", ""]}, {"sp": "王一雪", "zh": "是挺甜的！帮我选个大点儿的，再来两斤香蕉。", "py": ["shì", "tǐng", "tián", "de", "", "bāng", "wǒ", "xuǎn", "gè", "dà", "diǎn", "r", "de", "", "zài", "lái", "liǎng", "jīn", "xiāng", "jiāo", ""]}, {"sp": "店员", "zh": "一共五十八块五毛。", "py": ["yí", "gòng", "wǔ", "shí", "bā", "kuài", "wǔ", "máo", ""]}, {"sp": "王一雪", "zh": "我买了这么多，便宜点儿吧。", "py": ["wǒ", "mǎi", "le", "zhè", "me", "duō", "", "pián", "yi", "diǎn", "r", "ba", ""]}, {"sp": "店员", "zh": "您给我五十五吧，不能再便宜了。", "py": ["nín", "gěi", "wǒ", "wǔ", "shí", "wǔ", "ba", "", "bù", "néng", "zài", "pián", "yi", "le", ""]}], "qa": [{"q": "西瓜多少钱一斤？", "qVi": "Dưa hấu bao nhiêu tiền một cân (500g)?", "a": "两块五一斤（五块钱一公斤）。"}, {"q": "王一雪买了什么水果？", "qVi": "Vương Nhất Tuyết đã mua hoa quả gì?", "a": "她买了一个西瓜和两斤香蕉。"}, {"q": "店员给王一雪便宜了多少钱？", "qVi": "Nhân viên bớt cho Vương Nhất Tuyết bao nhiêu tiền?", "a": "便宜了三块五毛。"}]},

      {"n": 1, "type": "dialog", "scene": "在学校的体育馆，李文遇到了陈天中。", "scenePy": ["zài", "xué", "xiào", "de", "tǐ", "yù", "guǎn", "", "lǐ", "wén", "yù", "dào", "le", "chén", "tiān", "zhōng", ""], "sceneVi": "", "lines": [{"sp": "李文", "zh": "天中，最近常看见你来体育馆。", "py": ["tiān", "zhōng", "", "zuì", "jìn", "cháng", "kàn", "jiàn", "nǐ", "lái", "tǐ", "yù", "guǎn", ""]}, {"sp": "陈天中", "zh": "我每天下午都来跑一个小时步。", "py": ["wǒ", "měi", "tiān", "xià", "wǔ", "dōu", "lái", "pǎo", "yí", "ge", "xiǎo", "shí", "bù", ""]}, {"sp": "李文", "zh": "你的运动习惯真不错。", "py": ["nǐ", "de", "yùn", "dòng", "xí", "guàn", "zhēn", "bú", "cuò", ""]}, {"sp": "陈天中", "zh": "因为我今年胖了十多斤，不能再胖下去了，有点儿不健康。", "py": ["yīn", "wèi", "wǒ", "jīn", "nián", "pàng", "le", "shí", "duō", "jīn", "", "bù", "néng", "zài", "pàng", "xià", "qù", "le", "", "yǒu", "diǎn", "r", "bú", "jiàn", "kāng", ""]}, {"sp": "李文", "zh": "我下课以后常去打羽毛球，你也来玩吧。", "py": ["wǒ", "xià", "kè", "yǐ", "hòu", "cháng", "qù", "dǎ", "yǔ", "máo", "qiú", "", "nǐ", "yě", "lái", "wán", "ba", ""]}, {"sp": "陈天中", "zh": "我知道，但是你们的水平太高了，我打得不怎么样。", "py": ["wǒ", "zhī", "dào", "", "dàn", "shì", "nǐ", "men", "de", "shuǐ", "píng", "tài", "gāo", "le", "", "wǒ", "dǎ", "dé", "bù", "zěn", "me", "yàng", ""]}, {"sp": "李文", "zh": "没关系，我可以教你。", "py": ["méi", "guān", "xi", "", "wǒ", "kě", "yǐ", "jiào", "nǐ", ""]}], "qa": [{"q": "陈天中每天下午去体育馆做什么？", "qVi": "Chiều nào Trần Thiên Trung cũng đến nhà thi đấu làm gì?", "a": "他每天下午都去跑一个小时步。"}, {"q": "李文下课以后经常做什么？", "qVi": "Tan học Lý Văn thường làm gì?", "a": "他常去打羽毛球。"}, {"q": "陈天中羽毛球打得怎么样？", "qVi": "Trần Thiên Trung đánh cầu lông thế nào?", "a": "他打得不怎么样。"}]},
      {"n": 2, "type": "dialog", "scene": "在教室，安妮问候陈天中。", "scenePy": ["zài", "jiào", "shì", "", "ān", "nī", "wèn", "hòu", "chén", "tiān", "zhōng", ""], "sceneVi": "", "lines": [{"sp": "安妮", "zh": "你怎么了？看上去有点儿不舒服。", "py": ["nǐ", "zěn", "me", "le", "", "kàn", "shàng", "qù", "yǒu", "diǎn", "r", "bù", "shū", "fu", ""]}, {"sp": "陈天中", "zh": "昨天游完泳以后，耳朵一直有点儿疼。", "py": ["zuó", "tiān", "yóu", "wán", "yǒng", "yǐ", "hòu", "", "ěr", "duo", "yì", "zhí", "yǒu", "diǎn", "r", "téng", ""]}, {"sp": "安妮", "zh": "是不是感冒了？发烧吗？", "py": ["shì", "bu", "shì", "gǎn", "mào", "le", "", "fā", "shāo", "ma", ""]}, {"sp": "陈天中", "zh": "好像发低烧了。", "py": ["hǎo", "xiàng", "fā", "dī", "shāo", "le", ""]}, {"sp": "安妮", "zh": "我送你去医院，让医生检查一下吧。", "py": ["wǒ", "sòng", "nǐ", "qù", "yī", "yuàn", "", "ràng", "yī", "shēng", "jiǎn", "chá", "yí", "xià", "ba", ""]}, {"sp": "陈天中", "zh": "我先回去睡一觉，可能休息休息就好了。", "py": ["wǒ", "xiān", "huí", "qù", "shuì", "yí", "jiào", "", "kě", "néng", "xiū", "xi", "xiū", "xi", "jiù", "hǎo", "le", ""]}, {"sp": "安妮", "zh": "好吧，如果下午还发烧，就一定要去看医生。", "py": ["hǎo", "ba", "", "rú", "guǒ", "xià", "wǔ", "hái", "fā", "shāo", "", "jiù", "yí", "dìng", "yào", "qù", "kàn", "yī", "shēng", ""]}, {"sp": "陈天中", "zh": "谢谢关心，我会注意的。", "py": ["xiè", "xie", "guān", "xīn", "", "wǒ", "huì", "zhù", "yì", "de", ""]}], "qa": [{"q": "陈天中是什么时候开始不舒服的？", "qVi": "Trần Thiên Trung bắt đầu khó chịu từ khi nào?", "a": "昨天游完泳以后。"}, {"q": "安妮想怎么帮助他？", "qVi": "An Ni muốn giúp anh ấy thế nào?", "a": "她想送他去医院，让医生检查一下。"}, {"q": "陈天中想不想去医院？他想做什么？", "qVi": "Trần Thiên Trung có muốn đi viện không? Anh ấy muốn làm gì?", "a": "他不想去医院，他想先回去睡一觉。"}]},
      {"n": 3, "type": "dialog", "scene": "在医院病房，安妮探望陈天中。", "scenePy": ["zài", "yī", "yuàn", "bìng", "fáng", "", "ān", "nī", "tàn", "wàng", "chén", "tiān", "zhōng", ""], "sceneVi": "", "lines": [{"sp": "安妮", "zh": "你怎么突然住院了？大家都很担心你。", "py": ["nǐ", "zěn", "me", "tū", "rán", "zhù", "yuàn", "le", "", "dà", "jiā", "dōu", "hěn", "dān", "xīn", "nǐ", ""]}, {"sp": "陈天中", "zh": "我的腿疼了几个星期了，医生说需要住院做检查。", "py": ["wǒ", "de", "tuǐ", "téng", "le", "jǐ", "ge", "xīng", "qī", "le", "", "yī", "shēng", "shuō", "xū", "yào", "zhù", "yuàn", "zuò", "jiǎn", "chá", ""]}, {"sp": "安妮", "zh": "你看起来一点儿也不像病人。", "py": ["nǐ", "kàn", "qǐ", "lái", "yì", "diǎn", "r", "yě", "bú", "xiàng", "bìng", "rén", ""]}, {"sp": "陈天中", "zh": "是啊，我很少生病。我上次来医院已经过去差不多两年了。", "py": ["shì", "a", "", "wǒ", "hěn", "shǎo", "shēng", "bìng", "", "wǒ", "shàng", "cì", "lái", "yī", "yuàn", "yǐ", "jīng", "guò", "qù", "chà", "bu", "duō", "liǎng", "nián", "le", ""]}, {"sp": "安妮", "zh": "你每天跑步，有时候还去游泳，是不是运动太多了？", "py": ["nǐ", "měi", "tiān", "pǎo", "bù", "", "yǒu", "shí", "hou", "hái", "qù", "yóu", "yǒng", "", "shì", "bu", "shì", "yùn", "dòng", "tài", "duō", "le", ""]}, {"sp": "陈天中", "zh": "医生也这么说，但是还得做完检查才能知道。", "py": ["yī", "shēng", "yě", "zhè", "me", "shuō", "", "dàn", "shì", "hái", "dé", "zuò", "wán", "jiǎn", "chá", "cái", "néng", "zhī", "dào", ""]}, {"sp": "安妮", "zh": "别担心！听医生的话，好好休息，你的腿一定能好。", "py": ["bié", "dān", "xīn", "", "tīng", "yī", "shēng", "de", "huà", "", "hǎo", "hǎo", "xiū", "xi", "", "nǐ", "de", "tuǐ", "yí", "dìng", "néng", "hǎo", ""]}, {"sp": "陈天中", "zh": "谢谢。有人来看我，我就开心多了。", "py": ["xiè", "xie", "", "yǒu", "rén", "lái", "kàn", "wǒ", "", "wǒ", "jiù", "kāi", "xīn", "duō", "le", ""]}], "qa": [{"q": "陈天中为什么住院了？", "qVi": "Vì sao Trần Thiên Trung nằm viện?", "a": "因为他的腿疼了几个星期了，医生说需要住院做检查。"}, {"q": "安妮觉得陈天中为什么腿疼？", "qVi": "An Ni nghĩ vì sao chân Trần Thiên Trung đau?", "a": "她觉得可能是他运动太多了。"}, {"q": "医生是怎么说陈天中的腿的？", "qVi": "Bác sĩ nói gì về chân của Trần Thiên Trung?", "a": "医生也说可能是运动太多了，但是还得做完检查才能知道。"}]},
      {"n": 4, "type": "para", "scene": "在家里，陈天中吃药、休息。", "scenePy": ["zài", "jiā", "li", "", "chén", "tiān", "zhōng", "chī", "yào", "", "xiū", "xi", ""], "sceneVi": "", "lines": [{"sp": "", "zh": "今天我出院了。出院前，医生给我开了几种药，而且告诉了我吃药的方法。有一种药需要每天睡前吃一次，其他几种每天吃三次，饭后吃。除了吃药，医生还说最重要的是多休息。我都记在心里了，回家以后一定会多注意。希望我的腿能快一点儿好。", "py": ["jīn", "tiān", "wǒ", "chū", "yuàn", "le", "", "chū", "yuàn", "qián", "", "yī", "shēng", "gěi", "wǒ", "kāi", "le", "jǐ", "zhǒng", "yào", "", "ér", "qiě", "gào", "su", "le", "wǒ", "chī", "yào", "de", "fāng", "fǎ", "", "yǒu", "yì", "zhǒng", "yào", "xū", "yào", "měi", "tiān", "shuì", "qián", "chī", "yí", "cì", "", "qí", "tā", "jǐ", "zhǒng", "měi", "tiān", "chī", "sān", "cì", "", "fàn", "hòu", "chī", "", "chú", "le", "chī", "yào", "", "yī", "shēng", "huán", "shuō", "zuì", "zhòng", "yào", "de", "shì", "duō", "xiū", "xi", "", "wǒ", "dōu", "jì", "zài", "xīn", "li", "le", "", "huí", "jiā", "yǐ", "hòu", "yí", "dìng", "huì", "duō", "zhù", "yì", "", "xī", "wàng", "wǒ", "de", "tuǐ", "néng", "kuài", "yì", "diǎn", "r", "hǎo", ""]}], "qa": [{"q": "陈天中出院前，医生做什么了？", "qVi": "Trước khi Trần Thiên Trung ra viện, bác sĩ đã làm gì?", "a": "医生给他开了几种药，而且告诉了他吃药的方法。"}, {"q": "医生给陈天中开的药应该怎么吃？", "qVi": "Thuốc bác sĩ kê phải uống thế nào?", "a": "有一种药每天睡前吃一次，其他几种每天吃三次，饭后吃。"}, {"q": "陈天中回家以后应该注意什么？", "qVi": "Về nhà rồi Trần Thiên Trung phải chú ý gì?", "a": "应该按时吃药，多休息。"}]}

      {"n": 3, "type": "dialog", "scene": "在李文家，李文、白家月和陈天中一起看电视。", "scenePy": ["zài", "lǐ", "wén", "jiā", "", "lǐ", "wén", "", "bái", "jiā", "yuè", "hé", "chén", "tiān", "zhōng", "yì", "qǐ", "kàn", "diàn", "shì", ""], "sceneVi": "", "lines": [{"sp": "陈天中", "zh": "足球比赛已经开始了，快过来看吧！", "py": ["zú", "qiú", "bǐ", "sài", "yǐ", "jīng", "kāi", "shǐ", "le", "", "kuài", "guò", "lái", "kàn", "ba", ""]}, {"sp": "李文", "zh": "你们先看，冰箱里有啤酒和饮料，我去拿一下。", "py": ["nǐ", "men", "xiān", "kàn", "", "bīng", "xiāng", "lǐ", "yǒu", "pí", "jiǔ", "hé", "yǐn", "liào", "", "wǒ", "qù", "ná", "yí", "xià", ""]}, {"sp": "白家月", "zh": "今天怎么回事？总是踢不进去！", "py": ["jīn", "tiān", "zěn", "me", "huí", "shì", "", "zǒng", "shì", "tī", "bú", "jìn", "qù", ""]}, {"sp": "陈天中", "zh": "几个老球员生病了，新球员第一次参加这么重要的比赛，太紧张了。", "py": ["jǐ", "ge", "lǎo", "qiú", "yuán", "shēng", "bìng", "le", "", "xīn", "qiú", "yuán", "dì", "yī", "cì", "cān", "jiā", "zhè", "me", "zhòng", "yào", "de", "bǐ", "sài", "", "tài", "jǐn", "zhāng", "le", ""]}, {"sp": "李文", "zh": "是啊，主要的球员没参加比赛，所以大家也都受到影响了。", "py": ["shì", "a", "", "zhǔ", "yào", "de", "qiú", "yuán", "méi", "cān", "jiā", "bǐ", "sài", "", "suǒ", "yǐ", "dà", "jiā", "yě", "dōu", "shòu", "dào", "yǐng", "xiǎng", "le", ""]}, {"sp": "白家月", "zh": "越看越着急。我不看了，你们告诉我得分吧。", "py": ["yuè", "kàn", "yuè", "zháo", "jí", "", "wǒ", "bú", "kàn", "le", "", "nǐ", "men", "gào", "su", "wǒ", "dé", "fēn", "ba", ""]}], "qa": [{"q": "李文要去冰箱里拿什么？", "qVi": "Lý Văn ra tủ lạnh lấy gì?", "a": "拿啤酒和饮料。"}, {"q": "今天的足球比赛踢得怎么样？", "qVi": "Trận bóng hôm nay đá thế nào?", "a": "踢得不好，总是踢不进去。"}, {"q": "球员们受到什么影响了？", "qVi": "Các cầu thủ bị ảnh hưởng gì?", "a": "主要的球员没参加比赛，新球员太紧张了，大家都受到了影响。"}]},

      {"n": 2, "type": "dialog", "scene": "在教室里，刘小雪跟同学聊昨天的考试。", "scenePy": ["zài", "jiào", "shì", "lǐ", "", "liú", "xiǎo", "xuě", "gēn", "tóng", "xué", "liáo", "zuó", "tiān", "de", "kǎo", "shì", ""], "sceneVi": "", "lines": [{"sp": "同学", "zh": "小雪，昨天的考试，你考得怎么样？", "py": ["xiǎo", "xuě", "", "zuó", "tiān", "de", "kǎo", "shì", "", "nǐ", "kǎo", "dé", "zěn", "me", "yàng", ""]}, {"sp": "刘小雪", "zh": "我觉得历史有点儿难，你呢？", "py": ["wǒ", "jué", "de", "lì", "shǐ", "yǒu", "diǎn", "r", "nán", "", "nǐ", "ne", ""]}, {"sp": "同学", "zh": "数学考试我没看清楚要求，做错了好几个题，考得挺差的。", "py": ["shù", "xué", "kǎo", "shì", "wǒ", "méi", "kàn", "qīng", "chu", "yāo", "qiú", "", "zuò", "cuò", "le", "hǎo", "jǐ", "ge", "tí", "", "kǎo", "dé", "tǐng", "chà", "de", ""]}, {"sp": "刘小雪", "zh": "明天还有考试呢，别想那么多了，先复习外语吧。", "py": ["míng", "tiān", "hái", "yǒu", "kǎo", "shì", "ne", "", "bié", "xiǎng", "nà", "me", "duō", "le", "", "xiān", "fù", "xí", "wài", "yǔ", "ba", ""]}, {"sp": "同学", "zh": "外语作业里有几个问题，我可以问问你吗？", "py": ["wài", "yǔ", "zuò", "yè", "lǐ", "yǒu", "jǐ", "ge", "wèn", "tí", "", "wǒ", "kě", "yǐ", "wèn", "wèn", "nǐ", "ma", ""]}, {"sp": "刘小雪", "zh": "当然可以。在学习上，遇到什么问题都可以问我。", "py": ["dāng", "rán", "kě", "yǐ", "", "zài", "xué", "xí", "shàng", "", "yù", "dào", "shén", "me", "wèn", "tí", "dōu", "kě", "yǐ", "wèn", "wǒ", ""]}, {"sp": "刘小雪", "zh": "（……）不好意思，这几个题我也不会。咱们还是一起去办公室问问李老师吧。", "py": ["", "", "", "", "bù", "hǎo", "yì", "si", "", "zhè", "jǐ", "ge", "tí", "wǒ", "yě", "bú", "huì", "", "zán", "men", "hái", "shì", "yì", "qǐ", "qù", "bàn", "gōng", "shì", "wèn", "wèn", "lǐ", "lǎo", "shī", "ba", ""]}], "qa": [{"q": "明天还有什么考试？", "qVi": "Ngày mai còn thi môn gì?", "a": "外语考试。"}, {"q": "同学要问刘小雪什么问题？", "qVi": "Bạn học muốn hỏi Tiểu Tuyết câu gì?", "a": "外语作业里的几个问题。"}, {"q": "刘小雪和同学为什么一起去办公室？", "qVi": "Vì sao hai bạn cùng đến văn phòng?", "a": "因为这几个题小雪也不会，所以去办公室问李老师。"}]},
      {"n": 3, "type": "dialog", "scene": "在李老师办公室，刘小雪跟同学问问题。", "scenePy": ["zài", "lǐ", "lǎo", "shī", "bàn", "gōng", "shì", "", "liú", "xiǎo", "xuě", "gēn", "tóng", "xué", "wèn", "wèn", "tí", ""], "sceneVi": "", "lines": [{"sp": "同学", "zh": "李老师，书上有几个问题，我们想问问您。", "py": ["lǐ", "lǎo", "shī", "", "shū", "shàng", "yǒu", "jǐ", "ge", "wèn", "tí", "", "wǒ", "men", "xiǎng", "wèn", "wèn", "nín", ""]}, {"sp": "李老师", "zh": "好，坐下说吧，哪个题不会？", "py": ["hǎo", "", "zuò", "xià", "shuō", "ba", "", "nǎ", "ge", "tí", "bú", "huì", ""]}, {"sp": "同学", "zh": "书上第五页的这个对话我看不懂，小雪也不明白。", "py": ["shū", "shàng", "dì", "wǔ", "yè", "de", "zhè", "ge", "duì", "huà", "wǒ", "kàn", "bù", "dǒng", "", "xiǎo", "xuě", "yě", "bù", "míng", "bai", ""]}, {"sp": "李老师", "zh": "我课上讲过这几句话，再给你们讲一遍。", "py": ["wǒ", "kè", "shàng", "jiǎng", "guò", "zhè", "jǐ", "jù", "huà", "", "zài", "gěi", "nǐ", "men", "jiǎng", "yí", "biàn", ""]}, {"sp": "同学", "zh": "（李老师给学生讲题。）我终于懂了。这些句子一点儿也不难。", "py": ["", "lǐ", "lǎo", "shī", "gěi", "xué", "sheng", "jiǎng", "tí", "", "", "wǒ", "zhōng", "yú", "dǒng", "le", "", "zhè", "xiē", "jù", "zi", "yì", "diǎn", "r", "yě", "bù", "nán", ""]}, {"sp": "刘小雪", "zh": "我也明白了，谢谢您，李老师。", "py": ["wǒ", "yě", "míng", "bai", "le", "", "xiè", "xie", "nín", "", "lǐ", "lǎo", "shī", ""]}, {"sp": "李老师", "zh": "我这本书上还有几个练习，你们回家也做一做，明天再把书还给我。", "py": ["wǒ", "zhè", "běn", "shū", "shàng", "hái", "yǒu", "jǐ", "ge", "liàn", "xí", "", "nǐ", "men", "huí", "jiā", "yě", "zuò", "yi", "zuò", "", "míng", "tiān", "zài", "bǎ", "shū", "huán", "gěi", "wǒ", ""]}], "qa": [{"q": "刘小雪的同学听明白了吗？", "qVi": "Bạn của Tiểu Tuyết đã hiểu chưa?", "a": "听明白了，他觉得这些句子一点儿也不难。"}, {"q": "李老师上课的时候讲过这几句话吗？", "qVi": "Cô Lý đã giảng mấy câu này trên lớp chưa?", "a": "讲过。"}, {"q": "李老师为什么给他们一本书？", "qVi": "Vì sao cô Lý đưa họ một cuốn sách?", "a": "因为书上还有几个练习，让他们回家做一做。"}]},
      {"n": 4, "type": "para", "scene": "在家里，刘小雪在写邮件。", "scenePy": ["zài", "jiā", "li", "", "liú", "xiǎo", "xuě", "zài", "xiě", "yóu", "jiàn", ""], "sceneVi": "", "lines": [{"sp": "", "zh": "家月姐姐：你最近怎么样？忙不忙？我现在上初中二年级，学习越来越忙，后年就要考高中了。中国的学校一般是小学六年，初中三年，高中三年。妈妈说想考上好大学，就得上一个好高中；为了考上好高中，初中就得有一个不错的成绩，所以我现在非常努力。家月姐姐，你知道吗？在你的影响下，我也开始喜欢拍照了。下次你再来北京，我给你看看我照的照片。", "py": ["jiā", "yuè", "jiě", "jie", "", "nǐ", "zuì", "jìn", "zěn", "me", "yàng", "", "máng", "bu", "máng", "", "wǒ", "xiàn", "zài", "shàng", "chū", "zhōng", "èr", "nián", "jí", "", "xué", "xí", "yuè", "lái", "yuè", "máng", "", "hòu", "nián", "jiù", "yào", "kǎo", "gāo", "zhōng", "le", "", "zhōng", "guó", "de", "xué", "xiào", "yì", "bān", "shì", "xiǎo", "xué", "liù", "nián", "", "chū", "zhōng", "sān", "nián", "", "gāo", "zhōng", "sān", "nián", "", "mā", "mā", "shuō", "xiǎng", "kǎo", "shàng", "hǎo", "dà", "xué", "", "jiù", "dé", "shàng", "yí", "ge", "hǎo", "gāo", "zhōng", "", "wèi", "le", "kǎo", "shàng", "hǎo", "gāo", "zhōng", "", "chū", "zhōng", "jiù", "dé", "yǒu", "yí", "ge", "bú", "cuò", "de", "chéng", "jì", "", "suǒ", "yǐ", "wǒ", "xiàn", "zài", "fēi", "cháng", "nǔ", "lì", "", "jiā", "yuè", "jiě", "jie", "", "nǐ", "zhī", "dào", "ma", "", "zài", "nǐ", "de", "yǐng", "xiǎng", "xià", "", "wǒ", "yě", "kāi", "shǐ", "xǐ", "huan", "pāi", "zhào", "le", "", "xià", "cì", "nǐ", "zài", "lái", "běi", "jīng", "", "wǒ", "gěi", "nǐ", "kàn", "kan", "wǒ", "zhào", "de", "zhào", "piàn", ""]}], "qa": [{"q": "刘小雪什么时候考高中？", "qVi": "Khi nào Tiểu Tuyết thi vào cấp ba?", "a": "后年。"}, {"q": "中国的学校一般是几年？", "qVi": "Trường học ở TQ thường mấy năm?", "a": "小学六年，初中三年，高中三年。"}, {"q": "刘小雪为什么现在非常努力？", "qVi": "Vì sao bây giờ Tiểu Tuyết rất cố gắng?", "a": "因为为了考上好高中，初中就得有一个不错的成绩。"}]}

      {"n": 2, "type": "dialog", "scene": "在会议室，王一雪跟杨同乐在做会前准备。", "scenePy": ["zài", "huì", "yì", "shì", "", "wáng", "yì", "xuě", "gēn", "yáng", "tóng", "lè", "zài", "zuò", "huì", "qián", "zhǔn", "bèi", ""], "sceneVi": "", "lines": [{"sp": "王一雪", "zh": "电脑接好了吗？", "py": ["diàn", "nǎo", "jiē", "hǎo", "le", "ma", ""]}, {"sp": "杨同乐", "zh": "已经接好了，您开机看看有没有问题。", "py": ["yǐ", "jīng", "jiē", "hǎo", "le", "", "nín", "kāi", "jī", "kàn", "kan", "yǒu", "méi", "yǒu", "wèn", "tí", ""]}, {"sp": "王一雪", "zh": "现在什么都看不见。", "py": ["xiàn", "zài", "shén", "me", "dōu", "kàn", "bu", "jiàn", ""]}, {"sp": "杨同乐", "zh": "我检查一下哪里出问题了……您再试一下。", "py": ["wǒ", "jiǎn", "chá", "yí", "xià", "nǎ", "li", "chū", "wèn", "tí", "le", "", "", "nín", "zài", "shì", "yí", "xià", ""]}, {"sp": "王一雪", "zh": "看见了，但是听不见声音。", "py": ["kàn", "jiàn", "le", "", "dàn", "shì", "tīng", "bú", "jiàn", "shēng", "yīn", ""]}, {"sp": "杨同乐", "zh": "现在呢？", "py": ["xiàn", "zài", "ne", ""]}, {"sp": "王一雪", "zh": "听得见声音，但是声音有点儿小，听不清楚。", "py": ["tīng", "dé", "jiàn", "shēng", "yīn", "", "dàn", "shì", "shēng", "yīn", "yǒu", "diǎn", "r", "xiǎo", "", "tīng", "bù", "qīng", "chu", ""]}, {"sp": "杨同乐", "zh": "看来我没办法解决这个问题，只能找别人来帮帮忙了。", "py": ["kàn", "lái", "wǒ", "méi", "bàn", "fǎ", "jiě", "jué", "zhè", "ge", "wèn", "tí", "", "zhǐ", "néng", "zhǎo", "bié", "rén", "lái", "bāng", "bāng", "máng", "le", ""]}], "qa": [{"q": "开机以后，电脑有什么问题？", "qVi": "Bật máy xong, máy tính có vấn đề gì?", "a": "什么都看不见。"}, {"q": "杨同乐检查以后，电脑怎么样了？", "qVi": "Dương Đồng Lạc kiểm tra xong, máy thế nào?", "a": "看见了，但是听不见声音。"}, {"q": "听见声音以后，又出现了什么问题？", "qVi": "Nghe được tiếng rồi lại có vấn đề gì?", "a": "声音有点儿小，听不清楚。"}]},
      {"n": 3, "type": "dialog", "scene": "在办公室里，王一雪跟杨同乐在聊天儿。", "scenePy": ["zài", "bàn", "gōng", "shì", "lǐ", "", "wáng", "yì", "xuě", "gēn", "yáng", "tóng", "lè", "zài", "liáo", "tiān", "r", ""], "sceneVi": "", "lines": [{"sp": "王一雪", "zh": "同乐，你看见老张了吗？", "py": ["tóng", "lè", "", "nǐ", "kàn", "jiàn", "lǎo", "zhāng", "le", "ma", ""]}, {"sp": "杨同乐", "zh": "老张没来。他说家里有点儿事，所以请假了。", "py": ["lǎo", "zhāng", "méi", "lái", "", "tā", "shuō", "jiā", "li", "yǒu", "diǎn", "r", "shì", "", "suǒ", "yǐ", "qǐng", "jià", "le", ""]}, {"sp": "王一雪", "zh": "好几个同事都休假了，开会前这么多工作我怕干不完。", "py": ["hǎo", "jǐ", "ge", "tóng", "shì", "dōu", "xiū", "jià", "le", "", "kāi", "huì", "qián", "zhè", "me", "duō", "gōng", "zuò", "wǒ", "pà", "gān", "bù", "wán", ""]}, {"sp": "杨同乐", "zh": "十二点多了，咱们先去吃饭吧。吃完饭，我跟您一起把这些工作做完。", "py": ["shí", "èr", "diǎn", "duō", "le", "", "zán", "men", "xiān", "qù", "chī", "fàn", "ba", "", "chī", "wán", "fàn", "", "wǒ", "gēn", "nín", "yì", "qǐ", "bǎ", "zhè", "xiē", "gōng", "zuò", "zuò", "wán", ""]}, {"sp": "王一雪", "zh": "你先去吃，我想再干一会儿。明天开会前要发到公司的邮箱里。", "py": ["nǐ", "xiān", "qù", "chī", "", "wǒ", "xiǎng", "zài", "gān", "yí", "huì", "r", "", "míng", "tiān", "kāi", "huì", "qián", "yào", "fā", "dào", "gōng", "sī", "de", "yóu", "xiāng", "lǐ", ""]}, {"sp": "杨同乐", "zh": "您没看到邮件吗？经理还没回来呢，下周才能开会。", "py": ["nín", "méi", "kàn", "dào", "yóu", "jiàn", "ma", "", "jīng", "lǐ", "hái", "méi", "huí", "lái", "ne", "", "xià", "zhōu", "cái", "néng", "kāi", "huì", ""]}, {"sp": "王一雪", "zh": "那不着急了。走，吃饭去。", "py": ["nà", "bù", "zháo", "jí", "le", "", "zǒu", "", "chī", "fàn", "qù", ""]}], "qa": [{"q": "老张今天为什么没来上班？", "qVi": "Hôm nay vì sao lão Trương không đi làm?", "a": "因为他家里有点儿事，所以请假了。"}, {"q": "王一雪为什么没时间吃饭？", "qVi": "Vì sao Vương Nhất Tuyết không có thời gian ăn cơm?", "a": "因为好几个同事休假了，开会前工作很多，她怕干不完。"}, {"q": "明天公司开会吗？", "qVi": "Ngày mai công ty có họp không?", "a": "不开，经理还没回来，下周才能开会。"}]},
      {"n": 4, "type": "para", "scene": "在家里，王一雪在写日记。", "scenePy": ["zài", "jiā", "li", "", "wáng", "yì", "xuě", "zài", "xiě", "rì", "jì", ""], "sceneVi": "", "lines": [{"sp": "", "zh": "前几天，上海的同事来北京了。一起吃饭时，他们跟我说最近有不少同事去上海工作了，问我愿意不愿意也去上海。我是这样想的：现在丈夫和孩子都在北京，刘明的工作很忙，小雪和小明也还小，我去别的城市工作就要离开他们。虽然去上海可能会有更好的机会，但是对我来说，生活也很重要，我不愿意为工作或学习离开家人。", "py": ["qián", "jǐ", "tiān", "", "shàng", "hǎi", "de", "tóng", "shì", "lái", "běi", "jīng", "le", "", "yì", "qǐ", "chī", "fàn", "shí", "", "tā", "men", "gēn", "wǒ", "shuō", "zuì", "jìn", "yǒu", "bù", "shǎo", "tóng", "shì", "qù", "shàng", "hǎi", "gōng", "zuò", "le", "", "wèn", "wǒ", "yuàn", "yì", "bú", "yuàn", "yì", "yě", "qù", "shàng", "hǎi", "", "wǒ", "shì", "zhè", "yàng", "xiǎng", "de", "", "xiàn", "zài", "zhàng", "fu", "hé", "hái", "zi", "dōu", "zài", "běi", "jīng", "", "liú", "míng", "de", "gōng", "zuò", "hěn", "máng", "", "xiǎo", "xuě", "hé", "xiǎo", "míng", "yě", "hái", "xiǎo", "", "wǒ", "qù", "bié", "de", "chéng", "shì", "gōng", "zuò", "jiù", "yào", "lí", "kāi", "tā", "men", "", "suī", "rán", "qù", "shàng", "hǎi", "kě", "néng", "huì", "yǒu", "gèng", "hǎo", "de", "jī", "huì", "", "dàn", "shì", "duì", "wǒ", "lái", "shuō", "", "shēng", "huó", "yě", "hěn", "zhòng", "yào", "", "wǒ", "bú", "yuàn", "yì", "wèi", "gōng", "zuò", "huò", "xué", "xí", "lí", "kāi", "jiā", "rén", ""]}], "qa": [{"q": "上海的同事告诉王一雪什么了？", "qVi": "Đồng nghiệp ở Thượng Hải nói gì với Vương Nhất Tuyết?", "a": "最近有不少同事去上海工作了，问她愿意不愿意也去上海。"}, {"q": "王一雪觉得去上海工作有什么好处？", "qVi": "Vương Nhất Tuyết thấy đi Thượng Hải làm việc có lợi gì?", "a": "可能会有更好的机会。"}, {"q": "对王一雪来说，工作和生活哪个更重要？", "qVi": "Với Vương Nhất Tuyết, công việc hay cuộc sống quan trọng hơn?", "a": "生活更重要，她不愿意为工作离开家人。"}]}

      {"n": 1, "type": "dialog", "scene": "在街上，王一飞和白家月边走边聊。", "scenePy": ["zài", "jiē", "shàng", "", "wáng", "yì", "fēi", "hé", "bái", "jiā", "yuè", "biān", "zǒu", "biān", "liáo", ""], "sceneVi": "Trên phố, Vương Nhất Phi và Bạch Gia Nguyệt vừa đi vừa trò chuyện.", "lines": [{"sp": "白家月", "zh": "王老师，您看，这条街上的树都开花了。", "py": ["wáng", "lǎo", "shī", "", "nín", "kàn", "", "zhè", "tiáo", "jiē", "shàng", "de", "shù", "dōu", "kāi", "huā", "le", ""]}, {"sp": "王一飞", "zh": "上周我去公园坐船了，公园里的花也开了。", "py": ["shàng", "zhōu", "wǒ", "qù", "gōng", "yuán", "zuò", "chuán", "le", "", "gōng", "yuán", "lǐ", "de", "huā", "yě", "kāi", "le", ""]}, {"sp": "白家月", "zh": "天气这么好，下午我也想去公园坐船。", "py": ["tiān", "qì", "zhè", "me", "hǎo", "", "xià", "wǔ", "wǒ", "yě", "xiǎng", "qù", "gōng", "yuán", "zuò", "chuán", ""]}, {"sp": "王一飞", "zh": "去吧！今天是工作日，人应该不多。", "py": ["qù", "ba", "", "jīn", "tiān", "shì", "gōng", "zuò", "rì", "", "rén", "yīng", "gāi", "bù", "duō", ""]}, {"sp": "白家月", "zh": "您有时间吗？我想跟您一起去。", "py": ["nín", "yǒu", "shí", "jiān", "ma", "", "wǒ", "xiǎng", "gēn", "nín", "yì", "qǐ", "qù", ""]}, {"sp": "王一飞", "zh": "我今天下午有课，不能去太远的地方。", "py": ["wǒ", "jīn", "tiān", "xià", "wǔ", "yǒu", "kè", "", "bù", "néng", "qù", "tài", "yuǎn", "de", "dì", "fang", ""]}, {"sp": "白家月", "zh": "那咱们换一天去？", "py": ["nà", "zán", "men", "huàn", "yì", "tiān", "qù", ""]}, {"sp": "王一飞", "zh": "行。或者明天去，或者后天去，我给你打电话。", "py": ["xíng", "", "huò", "zhě", "míng", "tiān", "qù", "", "huò", "zhě", "hòu", "tiān", "qù", "", "wǒ", "gěi", "nǐ", "dǎ", "diàn", "huà", ""]}], "qa": [{"q": "上周王一飞去公园做什么了？", "qVi": "Tuần trước Vương Nhất Phi đi công viên làm gì?", "a": "她去公园坐船了。"}, {"q": "白家月今天想做什么？", "qVi": "Hôm nay Bạch Gia Nguyệt muốn làm gì?", "a": "她想下午去公园坐船。"}, {"q": "她们可能什么时候去公园？", "qVi": "Họ có thể đi công viên khi nào?", "a": "明天或者后天。"}]},
      {"n": 2, "type": "dialog", "scene": "在街上，王一飞和白家月一起散步。", "scenePy": ["zài", "jiē", "shàng", "", "wáng", "yì", "fēi", "hé", "bái", "jiā", "yuè", "yī", "qǐ", "sàn", "bù", ""], "sceneVi": "Trên phố, Vương Nhất Phi và Bạch Gia Nguyệt cùng đi dạo.", "lines": [{"sp": "白家月", "zh": "刚才还是大晴天呢，怎么突然就刮起风来了？", "py": ["gāng", "cái", "hái", "shì", "dà", "qíng", "tiān", "ne", "", "zěn", "me", "tū", "rán", "jiù", "guā", "qǐ", "fēng", "lái", "le", ""]}, {"sp": "王一飞", "zh": "好像新闻里说今天有雨。", "py": ["hǎo", "xiàng", "xīn", "wén", "lǐ", "shuō", "jīn", "tiān", "yǒu", "yǔ", ""]}, {"sp": "白家月", "zh": "啊？我每天书包里都放着雨伞，就今天没带。", "py": ["a", "", "wǒ", "měi", "tiān", "shū", "bāo", "lǐ", "dōu", "fàng", "zhe", "yǔ", "sǎn", "", "jiù", "jīn", "tiān", "méi", "dài", ""]}, {"sp": "王一飞", "zh": "我可以借给你，我车里有一把伞和一件雨衣。", "py": ["wǒ", "kě", "yǐ", "jiè", "gěi", "nǐ", "", "wǒ", "chē", "lǐ", "yǒu", "yì", "bǎ", "sǎn", "hé", "yí", "jiàn", "yǔ", "yī", ""]}, {"sp": "白家月", "zh": "谢谢，希望下午天气能变好。", "py": ["xiè", "xie", "", "xī", "wàng", "xià", "wǔ", "tiān", "qì", "néng", "biàn", "hǎo", ""]}, {"sp": "王一飞", "zh": "这个季节天气变化很快。", "py": ["zhè", "ge", "jì", "jié", "tiān", "qì", "biàn", "huà", "hěn", "kuài", ""]}, {"sp": "白家月", "zh": "雨已经下起来了，咱们快点儿走吧。", "py": ["yǔ", "yǐ", "jīng", "xià", "qǐ", "lái", "le", "", "zán", "men", "kuài", "diǎn", "r", "zǒu", "ba", ""]}], "qa": [{"q": "白家月今天带雨伞了吗？", "qVi": "Hôm nay Bạch Gia Nguyệt có mang ô không?", "a": "没带。她每天都带，就今天没带。"}, {"q": "王一飞可以借给白家月什么？", "qVi": "Vương Nhất Phi có thể cho Bạch Gia Nguyệt mượn gì?", "a": "一把伞和一件雨衣。"}, {"q": "她们现在要做什么？为什么？", "qVi": "Bây giờ họ phải làm gì? Vì sao?", "a": "她们要快点儿走，因为雨已经下起来了。"}]},
      {"n": 3, "type": "dialog", "scene": "在教室里，王一飞和白家月躲雨。", "scenePy": ["zài", "jiào", "shì", "lǐ", "", "wáng", "yì", "fēi", "hé", "bái", "jiā", "yuè", "duǒ", "yǔ", ""], "sceneVi": "Trong lớp học, Vương Nhất Phi và Bạch Gia Nguyệt trú mưa.", "lines": [{"sp": "白家月", "zh": "您来这里已经一年多了，习惯了吧？", "py": ["nín", "lái", "zhè", "li", "yǐ", "jīng", "yì", "nián", "duō", "le", "", "xí", "guàn", "le", "ba", ""]}, {"sp": "王一飞", "zh": "别的早就习惯了，就是天气我还不太习惯。", "py": ["bié", "de", "zǎo", "jiù", "xí", "guàn", "le", "", "jiù", "shì", "tiān", "qì", "wǒ", "hái", "bú", "tài", "xí", "guàn", ""]}, {"sp": "白家月", "zh": "为什么？您不喜欢这里的天气吗？", "py": ["wèi", "shén", "me", "", "nín", "bù", "xǐ", "huan", "zhè", "li", "de", "tiān", "qì", "ma", ""]}, {"sp": "王一飞", "zh": "我觉得冬天太冷了。", "py": ["wǒ", "jué", "de", "dōng", "tiān", "tài", "lěng", "le", ""]}, {"sp": "白家月", "zh": "冬天虽然冷，但是下雪的时候特别漂亮。", "py": ["dōng", "tiān", "suī", "rán", "lěng", "", "dàn", "shì", "xià", "xuě", "de", "shí", "hou", "tè", "bié", "piào", "liang", ""]}, {"sp": "王一飞", "zh": "我也喜欢雪。北京常常下雪，但听说今年就下了一次。", "py": ["wǒ", "yě", "xǐ", "huan", "xuě", "", "běi", "jīng", "cháng", "cháng", "xià", "xuě", "", "dàn", "tīng", "shuō", "jīn", "nián", "jiù", "xià", "le", "yí", "cì", ""]}, {"sp": "白家月", "zh": "我没关注过北京的天气，但是新闻里说过，今年冬天很多地方雪下得都少了。", "py": ["wǒ", "méi", "guān", "zhù", "guò", "běi", "jīng", "de", "tiān", "qì", "", "dàn", "shì", "xīn", "wén", "lǐ", "shuō", "guò", "", "jīn", "nián", "dōng", "tiān", "hěn", "duō", "dì", "fang", "xuě", "xià", "dé", "dōu", "shǎo", "le", ""]}], "qa": [{"q": "王一飞对什么还不太习惯？", "qVi": "Vương Nhất Phi còn chưa quen điều gì?", "a": "她对这里的天气还不太习惯。"}, {"q": "白家月为什么喜欢冬天？", "qVi": "Vì sao Bạch Gia Nguyệt thích mùa đông?", "a": "因为下雪的时候特别漂亮。"}, {"q": "新闻里说过什么？", "qVi": "Tin tức đã nói gì?", "a": "今年冬天很多地方雪下得都少了。"}]},
      {"n": 4, "type": "para", "scene": "在家里，王一飞在写日记。", "scenePy": ["zài", "jiā", "li", "", "wáng", "yì", "fēi", "zài", "xiě", "rì", "jì", ""], "sceneVi": "Ở nhà, Vương Nhất Phi đang viết nhật ký.", "lines": [{"sp": "", "zh": "我离开北京到这里工作一年多了。这一年多住下来，我还是更喜欢北京的四季。北京的春天最舒服，天气不冷不热。夏天白天很热，但是晚上比较凉快。秋天树上的叶子都变成了红色、黄色，非常漂亮。冬天不但冷，而且风很大，我最不喜欢冬天。每个人都有自己最喜欢的季节，你最喜欢哪个季节呢？", "py": ["wǒ", "lí", "kāi", "běi", "jīng", "dào", "zhè", "li", "gōng", "zuò", "yì", "nián", "duō", "le", "", "zhè", "yì", "nián", "duō", "zhù", "xià", "lái", "", "wǒ", "hái", "shì", "gèng", "xǐ", "huan", "běi", "jīng", "de", "sì", "jì", "", "běi", "jīng", "de", "chūn", "tiān", "zuì", "shū", "fu", "", "tiān", "qì", "bù", "lěng", "bú", "rè", "", "xià", "tiān", "bái", "tiān", "hěn", "rè", "", "dàn", "shì", "wǎn", "shang", "bǐ", "jiào", "liáng", "kuai", "", "qiū", "tiān", "shù", "shàng", "de", "yè", "zi", "dōu", "biàn", "chéng", "le", "hóng", "sè", "", "huáng", "sè", "", "fēi", "cháng", "piào", "liang", "", "dōng", "tiān", "bú", "dàn", "lěng", "", "ér", "qiě", "fēng", "hěn", "dà", "", "wǒ", "zuì", "bù", "xǐ", "huan", "dōng", "tiān", "", "měi", "gè", "rén", "dōu", "yǒu", "zì", "jǐ", "zuì", "xǐ", "huan", "de", "jì", "jié", "", "nǐ", "zuì", "xǐ", "huan", "nǎ", "ge", "jì", "jié", "ne", ""]}], "qa": [{"q": "北京的夏天是什么样的？", "qVi": "Mùa hè Bắc Kinh thế nào?", "a": "白天很热，但是晚上比较凉快。"}, {"q": "北京的秋天是什么样的？", "qVi": "Mùa thu Bắc Kinh thế nào?", "a": "树上的叶子都变成了红色、黄色，非常漂亮。"}, {"q": "王一飞为什么最不喜欢冬天？", "qVi": "Vì sao Vương Nhất Phi ghét mùa đông nhất?", "a": "因为北京的冬天不但冷，而且风很大。"}]}

      {"n": 4, "type": "para", "scene": "在家里，白家月在写日记。", "scenePy": ["zài", "jiā", "li", "", "bái", "jiā", "yuè", "zài", "xiě", "rì", "jì", ""], "sceneVi": "Ở nhà, Bạch Gia Nguyệt đang viết nhật ký.", "lines": [{"sp": "", "zh": "昨天是我们学校的新年晚会，每个班级的同学都表演节目了。晚会是八点开始的，差不多十二点才结束。我一个晚上跟大家一起又唱又跳，开心极了，也累坏了。我最喜欢的节目是留学生们跳舞，最后老师和校长也被叫起来一块儿跳，特别有意思。过几天学校的网站上会有晚会的视频，我打算再看一遍。", "py": ["zuó", "tiān", "shì", "wǒ", "men", "xué", "xiào", "de", "xīn", "nián", "wǎn", "huì", "", "měi", "gè", "bān", "jí", "de", "tóng", "xué", "dōu", "biǎo", "yǎn", "jié", "mù", "le", "", "wǎn", "huì", "shì", "bā", "diǎn", "kāi", "shǐ", "de", "", "chà", "bu", "duō", "shí", "èr", "diǎn", "cái", "jié", "shù", "", "wǒ", "yí", "ge", "wǎn", "shang", "gēn", "dà", "jiā", "yì", "qǐ", "yòu", "chàng", "yòu", "tiào", "", "kāi", "xīn", "jí", "le", "", "yě", "lèi", "huài", "le", "", "wǒ", "zuì", "xǐ", "huan", "de", "jié", "mù", "shì", "liú", "xué", "shēng", "men", "tiào", "wǔ", "", "zuì", "hòu", "lǎo", "shī", "hé", "xiào", "zhǎng", "yě", "bèi", "jiào", "qǐ", "lái", "yí", "kuài", "r", "tiào", "", "tè", "bié", "yǒu", "yì", "si", "", "guò", "jǐ", "tiān", "xué", "xiào", "de", "wǎng", "zhàn", "shàng", "huì", "yǒu", "wǎn", "huì", "de", "shì", "pín", "", "wǒ", "dǎ", "suan", "zài", "kàn", "yí", "biàn", ""]}], "qa": [{"q": "晚会是什么时候开始的？什么时候结束的？", "qVi": "Dạ hội bắt đầu và kết thúc lúc nào?", "a": "晚会是八点开始的，差不多十二点才结束。"}, {"q": "白家月最喜欢哪个节目？为什么？", "qVi": "Bạch Gia Nguyệt thích tiết mục nào nhất? Vì sao?", "a": "留学生们跳舞，因为最后老师和校长也被叫起来一块儿跳，特别有意思。"}, {"q": "过几天白家月打算做什么？", "qVi": "Vài hôm nữa Bạch Gia Nguyệt định làm gì?", "a": "她打算在学校网站上再看一遍晚会的视频。"}]}
