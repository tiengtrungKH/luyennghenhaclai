      {"n": 2, "type": "dialog", "scene": "在办公室里，王一雪和杨同乐在聊天儿。", "scenePy": ["zài", "bàn", "gōng", "shì", "lǐ", "", "wáng", "yì", "xuě", "hé", "yáng", "tóng", "lè", "zài", "liáo", "tiān", "r", ""], "sceneVi": "Trong văn phòng, Vương Nhất Tuyết và Dương Đồng Lạc đang trò chuyện.", "lines": [{"sp": "王一雪", "zh": "假期我想去南京旅游，但是我不太了解那里。", "py": ["jià", "qī", "wǒ", "xiǎng", "qù", "nán", "jīng", "lǚ", "yóu", "", "dàn", "shì", "wǒ", "bú", "tài", "liǎo", "jiě", "nà", "li", ""]}, {"sp": "杨同乐", "zh": "我虽然不是南京人，可是我是在南京上的大学，可以说是半个南京人。", "py": ["wǒ", "suī", "rán", "bú", "shì", "nán", "jīng", "rén", "", "kě", "shì", "wǒ", "shì", "zài", "nán", "jīng", "shàng", "de", "dà", "xué", "", "kě", "yǐ", "shuō", "shì", "bàn", "gè", "nán", "jīng", "rén", ""]}, {"sp": "王一雪", "zh": "太好了！你快给我介绍一下南京吧。", "py": ["tài", "hǎo", "le", "", "nǐ", "kuài", "gěi", "wǒ", "jiè", "shào", "yí", "xià", "nán", "jīng", "ba", ""]}, {"sp": "杨同乐", "zh": "南京有两千年以上的历史，有老城、老街，还有很多有名的景点，每年去旅游的游客特别多。", "py": ["nán", "jīng", "yǒu", "liǎng", "qiān", "nián", "yǐ", "shàng", "de", "lì", "shǐ", "", "yǒu", "lǎo", "chéng", "", "lǎo", "jiē", "", "hái", "yǒu", "hěn", "duō", "yǒu", "míng", "de", "jǐng", "diǎn", "", "měi", "nián", "qù", "lǚ", "yóu", "de", "yóu", "kè", "tè", "bié", "duō", ""]}, {"sp": "王一雪", "zh": "除了这些以外，你再告诉我一些外地人不知道的地方。", "py": ["chú", "le", "zhè", "xiē", "yǐ", "wài", "", "nǐ", "zài", "gào", "su", "wǒ", "yì", "xiē", "wài", "dì", "rén", "bù", "zhī", "dào", "de", "dì", "fang", ""]}, {"sp": "杨同乐", "zh": "那太多了，我得一点儿一点儿给您讲。", "py": ["nà", "tài", "duō", "le", "", "wǒ", "dé", "yì", "diǎn", "r", "yì", "diǎn", "r", "gěi", "nín", "jiǎng", ""]}, {"sp": "王一雪", "zh": "行，下班后我请你吃晚饭，咱们边吃边聊。", "py": ["xíng", "", "xià", "bān", "hòu", "wǒ", "qǐng", "nǐ", "chī", "wǎn", "fàn", "", "zán", "men", "biān", "chī", "biān", "liáo", ""]}], "qa": [{"q": "王一雪了解南京吗？", "qVi": "Vương Nhất Tuyết có hiểu về Nam Kinh không?", "a": "她不太了解南京。"}, {"q": "杨同乐为什么了解南京？", "qVi": "Vì sao Dương Đồng Lạc hiểu về Nam Kinh?", "a": "因为他是在南京上的大学，可以说是半个南京人。"}, {"q": "       {"n": 4, "type": "para", "scene": "在家里，王一雪在写日记。", "scenePy": ["zài", "jiā", "li", "", "wáng", "yì", "xuě", "zài", "xiě", "rì", "jì", ""], "sceneVi": "Ở nhà, Vương Nhất Tuyết đang viết nhật ký.", "lines": [{"sp": "", "zh": "我小时候住在北京的西北边，有一条非常有名的河经过那里。我家就住在河边。那里有高高的大树和绿绿的草地。春天，河边的花都开了，看起来特别漂亮。还记得小时候，一到夏天我就去河里游泳。长大以后，遇到什么不开心的事情，我就去河边的树下坐着，听听鸟叫，看看河水，跟遇见的朋友聊聊天儿，难过的事情不一会儿就忘了。那是我最喜欢的地方。", "py": ["wǒ", "xiǎo", "shí", "hou", "zhù", "zài", "běi", "jīng", "de", "xī", "běi", "biān", "", "yǒu", "yì", "tiáo", "fēi", "cháng", "yǒu", "míng", "de", "hé", "jīng", "guò", "nà", "li", "", "wǒ", "jiā", "jiù", "zhù", "zài", "hé", "biān", "", "nà", "li", "yǒu", "gāo", "gāo", "de", "dà", "shù", "hé", "lǜ", "lǜ", "de", "cǎo", "dì", "", "chūn", "tiān", "", "hé", "biān", "de", "huā", "dōu", "kāi", "le", "", "kàn", "qǐ", "lái", "tè", "bié", "piào", "liang", "", "hái", "jì", "de", "xiǎo", "shí", "hou", "", "yí", "dào", "xià", "tiān", "wǒ", "jiù", "qù", "hé", "lǐ", "yóu", "yǒng", "", "zhǎng", "dà", "yǐ", "hòu", "", "yù", "dào", "shén", "me", "bù", "kāi", "xīn", "de", "shì", "qing", "", "wǒ", "jiù", "qù", "hé", "biān", "de", "shù", "xià", "zuò", "zhe", "", "tīng", "tīng", "niǎo", "jiào", "", "kàn", "kan", "hé", "shuǐ", "", "gēn", "yù", "jiàn", "de", "péng", "you", "liáo", "liáo", "tiān", "r", "", "nán", "guò", "de", "shì", "qing", "bù", "yí", "huì", "r", "jiù", "wàng", "le", "", "nà", "shì", "wǒ", "zuì", "xǐ", "huan", "de", "dì", "fang", ""]}], "qa": [{"q": "王一雪小时候住的地方环境怎么样？", "qVi": "Nơi Vương Nhất Tuyết sống hồi nhỏ môi trường thế nào?", "a": "有高高的大树和绿绿的草地，春天河边的花都开了，特别漂亮。"}, {"q": "小时候，王一雪一到夏天就做什么？", "qVi": "Hồi nhỏ, cứ đến hè Vương Nhất Tuyết làm gì?", "a": "一到夏天她就去河里游泳。"}, {"q": "长大以后，王一雪会去河边做什么？", "qVi": "Lớn lên, Vương Nhất Tuyết ra bờ sông làm gì?", "a": "坐在树下，听听鸟叫，看看河水，跟遇见的朋友聊聊天儿。"}]}

const posVi = p => (p||"").split("/").map(s=>{s=s.trim();return POS_VI[s]||POS_VI[s+"."]||s}).join(" / ");

/* ---------------- phát âm (Web Speech API) ---------------- */
let zhVoice=null;
function loadVoices(){ if(!("speechSynthesis" in window))return; const vs=speechSynthesis.getVoices();
  zhVoice = vs.find(v=>/zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null; }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text, rate=0.85){
  if(!("speechSynthesis" in window)){toast("Trình duyệt này chưa hỗ trợ phát âm");return}
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="zh-CN"; u.rate=rate; if(zhVoice)u.voice=zhVoice; speechSynthesis.speak(u);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]"); if(b){e.preventDefault();speak(b.dataset.say, b.dataset.rate?+b.dataset.rate:0.85)}});

/* ---------------- pinyin: so sánh có dấu thanh ---------------- */
const TONE = {"ā":"a1","á":"a2","ǎ":"a3","à":"a4","ē":"e1","é":"e2","ě":"e3","è":"e4","ī":"i1","í":"i2","ǐ":"i3","ì":"i4","ō":"o1","ó":"o2","ǒ":"o3","ò":"o4","ū":"u1","ú":"u2","ǔ":"u3","ù":"u4","ǖ":"v1","ǘ":"v2","ǚ":"v3","ǜ":"v4","ü":"v0"};
function pyKey(s){ // → chuỗi chữ cái + danh sách thanh, bỏ dấu cách / gạch / viết hoa
  s=(s||"").toLowerCase().normalize("NFC").replace(/u:/g,"ü"); let letters="", tones=[];
  for(const ch of s){ if(TONE[ch]){const t=TONE[ch];letters+=t[0]==="v"?"v":t[0]; if(t[1]!=="0")tones.push(t[1]);}
    else if(/[a-z]/.test(ch)) letters+=ch==="v"?"v":ch; else if(/[1-4]/.test(ch)) tones.push(ch); }
  return {letters, tones:tones.join("")};
}
function pyCheck(input, answer){
  const a=pyKey(input), b=pyKey(answer);
  if(a.letters!==b.letters) return "wrong";
  return a.tones===b.tones ? "right" : "tone";
}
/* bàn phím dấu thanh: gõ nguyên âm + bấm nút thanh */
const MARK={a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù",ü:"ǖǘǚǜ",v:"ǖǘǚǜ"};
function addTone(input,t){
  const v=input.value, pos=input.selectionStart??v.length; const before=v.slice(0,pos);
  const m=before.match(/[a-zü]+$/i); if(!m){input.focus();return}
  const syl=m[0]; let idx=-1; const low=syl.toLowerCase();
  if(low.includes("a"))idx=low.indexOf("a"); else if(low.includes("e"))idx=low.indexOf("e"); else if(low.includes("ou"))idx=low.indexOf("o");
  else { for(let i=low.length-1;i>=0;i--){ if("aeiouüv".includes(low[i])){idx=i;break} } }
  if(idx<0){input.focus();return}
  const ch=low[idx]; const rep=MARK[ch][t-1]; const start=pos-syl.length;
  input.value=v.slice(0,start)+syl.slice(0,idx)+rep+syl.slice(idx+1)+v.slice(pos);
  input.focus(); const np=pos; input.setSelectionRange(np,np);
}

function ruby(zh, py){ if(!showPy||!py) return esc(zh); const ch=[...zh]; return ch.map((c,i)=>`<span class="cc"><i>${(/[一-鿿]/.test(c)&&py[i])?esc(py[i]):"&nbsp;"}</i>${esc(c)}</span>`).join(""); }
function markWords(html, zh, py, ws){ // tô màu từ mới trong câu (dựa trên vị trí ký tự)
  const ch=[...zh]; const tag=new Array(ch.length).fill(null);
  const list=[...ws].sort((a,b)=>[...b.hanzi].length-[...a.hanzi].length);
  for(const w of list){ const h=[...w.hanzi]; for(let i=0;i+h.length<=ch.length;i++){ if(h.every((c,k)=>ch[i+k]===c) && tag.slice(i,i+h.length).every(x=>x===null)){ for(let k=0;k<h.length;k++) tag[i+k]=k===0?w:"c"; } } }
  let out="", i=0;
  while(i<ch.length){ if(tag[i] && tag[i]!=="c"){ const w=tag[i]; const len=[...w.hanzi].length; out+=`<mark class="w" data-w="${esc(w.hanzi)}">${ruby(ch.slice(i,i+len).join(""), py?py.slice(i,i+len):null)}</mark>`; i+=len; }
    else { out+=ruby(ch[i], py?[py[i]]:null); i++; } }
  return out;
}

function splitPy(py,n){ // tách pinyin theo âm tiết (gần đúng) để hiển thị cho từng chữ
  const s=py.replace(/[’']/g," ").trim(); let parts=s.split(/\s+/); if(parts.length===n) return parts;
  const re=/(?:[bpmfdtnlgkhjqxrzcsyw]|zh|ch|sh)?(?:[aāáǎàeēéěèoōóǒò]|[iīíǐìuūúǔùüǖǘǚǜv])+(?:ng|n(?![aāáǎàeēéěèiīíǐìoōóǒòuūúǔùüǖǘǚǜ])|r(?![aāáǎàeēéěèiīíǐìoōóǒòuūúǔù]))?/gi;
  const m=s.replace(/\s+/g,"").match(re)||[]; return m.length===n?m:parts; }

   <div class="note" style="margin:0">Bấm vào thẻ (hoặc phím Space) để lật · phím ← → để chuyển thẻ</div></div></div>`;

function drawFc(){
  const w=fcList[fcI]; if(!w) return; const known=(S[cur.lesson]?.known||[]); $("#fc").classList.remove("flip");
  const k=known.includes(w.hanzi)?`<span class="known">✓ Đã thuộc</span>`:"";

function fmtT(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function paneMatch(){
  const pool=shuffle(wordsMin(4)); const rounds=[]; for(let i=0;i<pool.length;i+=6) rounds.push(pool.slice(i,i+6));
  if(rounds.length>1 && rounds[rounds.length-1].length<3){ const last=rounds.pop(); rounds[rounds.length-1].push(...last); }
  let r=0, errors=0, t0=Date.now(), sec=0;
  const box=$("#pane"); box.innerHTML=`<div class="card pane"><h3>🔗 Nối chữ Hán với phiên âm <span class="pos">${scopeName()}</span></h3>${fewNote(4)}
   <div class="ghead"><span class="pill" id="mR"></span><span class="pill">⏱ <span id="mT">0:00</span></span><span class="pill">✗ <span id="mE">0</span> lỗi</span><span class="sp"></span><button class="tbtn" id="mRe">↻ Chơi lại</button></div><div id="mBody"></div></div>`;
  $("#mRe").onclick=paneMatch;
  timers.push(setInterval(()=>{sec=Math.round((Date.now()-t0)/1000); const el=$("#mT"); if(el) el.textContent=fmtT(sec);},500));
  function round(){
    const ws=rounds[r]; const L=shuffle(ws), R=shuffle(ws); let sel=null, done=0;
    $("#mR").textContent=`Lượt ${r+1}/${rounds.length}`;
    $("#mBody").innerHTML=`<div class="match"><div class="col">${L.map((w,i)=>`<button class="mi zh" data-i="${i}">${esc(w.hanzi)}</button>`).join("")}</div><div class="col">${R.map((w,j)=>`<button class="mi" style="font-size:18px;color:var(--warn);text-align:center" data-j="${j}">${esc(w.pinyin)}</button>`).join("")}</div></div>`;
    const lb=[...document.querySelectorAll("[data-i]")], rb=[...document.querySelectorAll("[data-j]")];
    lb.forEach(b=>b.onclick=()=>{ lb.forEach(x=>x.classList.remove("sel")); sel=+b.dataset.i; b.classList.add("sel"); speak(L[sel].hanzi); });
    rb.forEach(b=>b.onclick=()=>{ if(sel==null){toast("Chọn chữ Hán bên trái trước");return} const j=+b.dataset.j;
      if(L[sel]===R[j]){ lb[sel].classList.add("right"); b.classList.add("right"); lb[sel].disabled=b.disabled=true; lb[sel].classList.remove("sel"); sel=null; done++;
        if(done===ws.length){ r++; if(r<rounds.length) setTimeout(round,500); else finishM(); } }
      else { errors++; $("#mE").textContent=errors; b.classList.add("wrong"); lb[sel].classList.add("wrong"); const s0=sel; setTimeout(()=>{b.classList.remove("wrong"); lb[s0]?.classList.remove("wrong");},500); } });
  }
  function finishM(){ stopAll(); const n=pool.length, sc=Math.max(0,Math.round((n/(n+errors))*100)); record(cur.lesson,"match",sc);
    $("#mBody").innerHTML=`<div class="done-box"><div class="big">🎉</div><h4>Hoàn thành ${n} cặp!</h4><div>Thời gian ${fmtT(sec)} · ${errors} lỗi · độ chính xác <b>${sc}%</b></div><div class="row" style="justify-content:center"><button class="btn" onclick="paneMatch()">↻ Chơi lại</button></div></div>`; }
  round();
}

const DICT = (()=>{ const s=new Set(); HSK3.forEach(L=>L.words.forEach(w=>s.add(w.hanzi)));
  "我们 你们 他们 她们 咱们 什么 怎么 怎么样 为什么 这个 那个 哪个 这里 那里 哪儿 这儿 那儿 一下 一点儿 有点儿 一起 已经 还是 可以 可能 知道 觉得 喜欢 时候 朋友 东西 现在 今天 明天 昨天 晚上 早上 下午 上午 中午 星期 一个 两个 几个 没有 不是 就是 但是 因为 所以 如果 虽然 一边 一直 非常 特别 比较 应该 需要 准备 开始 已经 告诉 帮助 学习 工作 老师 学生 同学 妈妈 爸爸 孩子 中国 北京 汉语 中文 电话 手机 电脑 电影 饭馆 吃饭 喝茶 看见 听说 出来 进来 回来 起来 过来 上去 下来 出去 回去 一定 当然 真的 好像 看起来 看上去 不错 好吃 好看 漂亮 高兴 快乐 一会儿 一块儿 不用 别的 还有 只有 所有 每天 每个 自己 大家 别人 时间 地方 问题 事情 意思 起床 睡觉 洗澡 打扫 认识 介绍 欢迎 谢谢 对不起 没关系 不客气 再见".split(" ").forEach(x=>s.add(x)); return s; })();
function segment(str){ const ch=[...str]; const out=[]; let i=0;
  while(i<ch.length){ let len=Math.min(4,ch.length-i), hit=1; for(;len>1;len--){ if(DICT.has(ch.slice(i,i+len).join(""))){hit=len;break;} } out.push(ch.slice(i,i+hit).join("")); i+=hit; }
  // gộp các chữ lẻ liền nhau để số mảnh vừa phải
  let res=[]; for(const t of out){ const p=res[res.length-1]; if(p && [...t].length===1 && [...p].length===1 && res.length>5 && !/[，。？！、]/.test(t+p)) res[res.length-1]=p+t; else res.push(t); }
  while(res.length>8){ let k=res.findIndex((x,i)=>i<res.length-1 && [...x].length===1); if(k<0)k=0; res.splice(k,2,res[k]+res[k+1]); }
  return res; }
function sortPool(){
  const ws=words(); const pool=[];
  ws.forEach(w=>{ if(w.example){ const s=w.example.replace(/[。！？!?]$/,""); const n=[...s].length; if(n>=5&&n<=22&&!/[“”"]/.test(s)) pool.push({zh:w.example, body:s, vi:w.exampleVi, end:w.example.slice(-1)}); } });
  if(pool.length<5){ (part?cur.texts.filter(t=>t.n===part):cur.texts).forEach(t=>t.lines.forEach(l=>l.zh.split(/(?<=[。！？])/).forEach(x=>{ const s=x.replace(/[。！？]$/,""); const n=[...s].length; if(n>=5&&n<=18&&!/[“”"：]/.test(s)) pool.push({zh:x, body:s, vi:"", end:/[。！？]$/.test(x)?x.slice(-1):"。"}); }))); }
  return pool; }
function paneSort(){
  const list=pick(sortPool(),Math.min(6,sortPool().length)); let qi=0, ok=0;
  $("#pane").innerHTML=`<div class="card pane"><h3>🔀 Sắp xếp từ thành câu <span class="pos">${scopeName()} · ${list.length} câu</span></h3>
   <div class="note">Bấm lần lượt các mảnh để ghép thành câu đúng. Bấm vào mảnh đã chọn để bỏ ra.</div><div id="sBody"></div></div>`;
  if(!list.length){ $("#sBody").innerHTML=`<p>Chưa có câu phù hợp cho phạm vi này.</p>`; return; }
  function q(){
    const it=list[qi]; let tiles=segment(it.body); let order=shuffle(tiles.map((t,i)=>i)); if(order.every((x,i)=>x===i)&&order.length>1) order.reverse(); const chosen=[];
    const draw=()=>{ $("#sBody").innerHTML=`<div class="ghead"><span class="pill">Câu ${qi+1}/${list.length}</span><span class="pill">✓ ${ok}</span></div>
      <div class="sort-q">${it.vi?`<div class="vi">“${esc(it.vi)}”</div>`:`<div class="note">Sắp xếp thành câu trong bài khoá</div>`}</div>
      <div class="slot" id="slot">${chosen.map((ti,k)=>`<button class="tile" data-k="${k}">${esc(tiles[ti])}</button>`).join("")}<span class="zh" style="font-size:22px">${chosen.length===tiles.length?esc(it.end):""}</span></div>
      <div class="tiles">${order.map(ti=>`<button class="tile ${chosen.includes(ti)?"used":""}" data-t="${ti}">${esc(tiles[ti])}</button>`).join("")}</div>
      <div class="feedback" id="sFb"></div><div class="qnav"><button class="btn ghost" id="sClr">Xoá hết</button><button class="btn" id="sCk" ${chosen.length<tiles.length?"disabled":""}>Kiểm tra</button><button class="btn" id="sNx" hidden>Câu tiếp →</button></div>`;
      document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{chosen.push(+b.dataset.t); draw();});
      document.querySelectorAll("#slot [data-k]").forEach(b=>b.onclick=()=>{chosen.splice(+b.dataset.k,1); draw();});
      $("#sClr").onclick=()=>{chosen.length=0; draw();};
      $("#sCk").onclick=()=>{ const ans=chosen.map(i=>tiles[i]).join(""); const g=ans===it.body; if(g) ok++;
        $("#slot").classList.add(g?"right":"wrong"); document.querySelectorAll(".tile").forEach(b=>b.disabled=true);
        const fb=$("#sFb"); fb.className="feedback "+(g?"ok":"no"); fb.innerHTML=(g?"✓ Chính xác! ":"✗ Chưa đúng. Câu đúng: ")+`<b style="font-family:var(--zh);font-size:18px">${esc(it.zh)}</b>`;
        speak(it.zh,0.8); $("#sCk").hidden=true; $("#sClr").hidden=true; const nx=$("#sNx"); nx.hidden=false; nx.textContent=qi===list.length-1?"Xem kết quả →":"Câu tiếp →";
        nx.onclick=()=>{qi++; qi<list.length?q():end();}; };
    };
    draw();
  }
  function end(){ const sc=Math.round(ok/list.length*100); record(cur.lesson,"sort",sc);
    $("#sBody").innerHTML=`<div class="done-box"><div class="big">${sc>=80?"🌟":"💪"}</div><h4>Đúng ${ok}/${list.length} câu (${sc}%)</h4><div class="row" style="justify-content:center"><button class="btn" onclick="paneSort()">↻ Làm câu khác</button></div></div>`; }

/* ===== 9. Kiểm tra từ vựng (có bảng kết quả) ===== */
const QTYPE = {mean:"Chọn nghĩa đúng",hanzi:"Chọn chữ Hán đúng",pinyin:"Điền pinyin",listen:"Nghe và chọn từ",match:"Nối từ với nghĩa"};

function buildQuiz(ws){
  const pool=shuffle(ws), qs=[]; let p=0; const take=()=>pool[(p++)%pool.length];
  const others=(w,n,key)=>pick(ws.filter(x=>x!==w && x[key]!==w[key]),n);
  for(let i=0;i<7;i++){const w=take(); qs.push({t:"mean",w,opts:shuffle([w,...others(w,3,"meaning")])});}
  for(let i=0;i<6;i++){const w=take(); qs.push({t:"hanzi",w,opts:shuffle([w,...others(w,3,"hanzi")])});}
  if("speechSynthesis" in window) for(let i=0;i<2;i++){const w=take(); qs.push({t:"listen",w,opts:shuffle([w,...others(w,3,"hanzi")])});}
  const rest=ws.filter(w=>!qs.some(q=>q.w===w)); const m=pick(rest.length>=5?rest:ws,5);
  qs.push({t:"match",items:m,right:shuffle(m)});
  return qs;
}
let Q=null;
function startQuiz(){ if(!student){showLogin();return} Q={L:cur,qs:buildQuiz(cur.words),i:0,log:[],start:Date.now()}; drawQ(); $("#pane").scrollIntoView({behavior:"smooth"}); }
const total=()=>Q.qs.reduce((s,q)=>s+(q.t==="match"?q.items.length:1),0);
const doneCount=()=>Q.log.length;
function head(q){ return `<div class="qhead"><span class="qtype">${QTYPE[q.t]}</span><span class="qcount">Câu ${Math.min(doneCount()+1,total())} / ${total()}</span></div><div class="bar"><i style="width:${doneCount()/total()*100}%"></i></div>`; }
function drawQ(){
  const q=Q.qs[Q.i]; if(!q){finish();return}
  const box=$("#quizBox"); const K="ABCD";
  if(q.t==="mean"){
    box.innerHTML=`${head(q)}<div class="prompt"><div class="big">${esc(q.w.hanzi)}</div><div class="hint">${esc(q.w.pinyin)} · Từ này nghĩa là gì?</div></div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${K[k]}</span><span>${esc(o.meaning)}</span></button>`).join("")}</div><div class="feedback" id="fb"></div><div class="qnav"><button class="btn" id="nx" hidden>Câu tiếp theo →</button></div>`;
    bindChoice(q, o=>o.meaning, w=>w.hanzi+" — "+w.meaning);
  } else if(q.t==="hanzi"||q.t==="listen"){
    const pr = q.t==="hanzi" ? `<div class="mid">${esc(q.w.meaning)}</div><div class="hint">${esc(posVi(q.w.pos))} · Chọn chữ Hán đúng</div>`
      : `<div class="listen"><button class="spk" data-say="${esc(q.w.hanzi)}" data-rate="0.75">🔊</button></div><div class="hint">Bấm loa để nghe (nghe được nhiều lần), rồi chọn từ đúng</div>`;
    box.innerHTML=`${head(q)}<div class="prompt">${pr}</div>

    if(q.t==="listen") setTimeout(()=>speak(q.w.hanzi,0.75),250);

    const check=()=>{ if(!inp.value.trim()){inp.focus();return} const r=pyCheck(inp.value,q.w.pinyin); const ok=r==="right";

function bindChoice(q, label, full){
  const box=$("#quizBox");
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=q.opts[+b.dataset.k], ok=o===q.w;
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(q.opts[+x.dataset.k]===q.w)x.classList.add("right")});
    if(!ok)b.classList.add("wrong");
    const qtext = q.t==="mean"?`${q.w.hanzi} (${q.w.pinyin}) nghĩa là gì?`: q.t==="hanzi"?`“${q.w.meaning}” là chữ nào?`:`Nghe và chọn từ đúng (${q.w.hanzi})`;
    Q.log.push({t:q.t,q:qtext,you:label(o),ans:label(q.w),ok});
    const fb=$("#fb"); fb.className="feedback "+(ok?"ok":"no"); fb.innerHTML=(ok?"✓ Chính xác! ":"✗ Chưa đúng. Đáp án: ")+`<b>${esc(full(q.w))}</b>`;
    if(q.t!=="listen") speak(q.w.hanzi);
    nextBtn();
  });
}
function nextBtn(){ const nx=$("#nx"); nx.hidden=false; nx.textContent = Q.i===Q.qs.length-1?"Xem kết quả →":"Câu tiếp theo →"; nx.focus(); nx.onclick=()=>{Q.i++;drawQ()}; }
function drawMatchQ(q){
  const box=$("#quizBox"); const pairs={}; let sel=null;
  const render=()=>{
    box.innerHTML=`${head(q)}<div class="prompt"><div class="mid">Nối chữ Hán với nghĩa đúng</div><div class="hint">Bấm 1 từ bên trái, rồi bấm nghĩa bên phải. Bấm lại để đổi.</div></div>
    <div class="match"><div class="col">${q.items.map((w,i)=>`<button class="mi zh ${sel===i?"sel":""} ${pairs[i]!=null?"paired":""}" data-l="${i}">${pairs[i]!=null?`<span class="tag">${i+1}</span>`:""}${esc(w.hanzi)}</button>`).join("")}</div>
    <div class="col">${q.right.map((w,j)=>{const li=Object.keys(pairs).find(k=>pairs[k]===j); return `<button class="mi ${li!=null?"paired":""}" data-r="${j}">${li!=null?`<span class="tag">${+li+1}</span>`:""}${esc(w.meaning)}</button>`}).join("")}</div></div>
    <div class="feedback" id="fb"></div><div class="qnav"><button class="btn" id="ck" ${Object.keys(pairs).length<q.items.length?"disabled":""}>Kiểm tra</button><button class="btn" id="nx" hidden>Xem kết quả →</button></div>`;
    box.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const i=+b.dataset.l; if(pairs[i]!=null){delete pairs[i]} sel=(sel===i?null:i); speak(q.items[i].hanzi); render();});
    box.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const j=+b.dataset.r; if(sel==null){toast("Hãy chọn 1 chữ Hán bên trái trước");return}
      for(const k in pairs) if(pairs[k]===j) delete pairs[k]; pairs[sel]=j; sel=null; render();});
    $("#ck").onclick=()=>{
      let c=0; q.items.forEach((w,i)=>{const r=q.right[pairs[i]]; const ok=r===w; if(ok)c++;
        Q.log.push({t:"match",q:`Nối: ${w.hanzi} (${w.pinyin})`,you:r?r.meaning:"(bỏ trống)",ans:w.meaning,ok});
        box.querySelector(`[data-l="${i}"]`).classList.add(ok?"right":"wrong"); box.querySelector(`[data-r="${pairs[i]}"]`)?.classList.add(ok?"right":"wrong");});
      box.querySelectorAll(".mi").forEach(b=>b.disabled=true);
      const fb=$("#fb"); fb.className="feedback "+(c===q.items.length?"ok":"no"); fb.innerHTML=`Bạn nối đúng <b>${c}/${q.items.length}</b> cặp.`;
      $("#ck").hidden=true; const nx=$("#nx"); nx.hidden=false; nx.onclick=()=>{Q.i++;drawQ()};
    };
  };
  render();
}

     <div class="ractions"><button class="btn" id="again">↻ Làm lại bài test</button>${next?`<a class="btn ghost" href="#bai-${next.lesson}">Bài tiếp theo: Bài ${next.lesson} →</a>`:`<a class="btn ghost" href="#home">Về trang tổng quan</a>`}<button class="btn ghost" id="review">📖 Ôn lại từ vựng</button><button class="btn ghost" onclick="window.print()">🖨 In / lưu PDF kết quả</button></div>

/* ===== Đục lỗ điền từ (dạng HSK 3.0 · 选词填空) ===== */
function scopeTexts(){ return part?cur.texts.filter(t=>t.n===part):cur.texts; }
function sentencesOf(t){ const out=[]; t.lines.forEach(l=>l.zh.split(/(?<=[。！？])/).forEach(x=>{x=x.trim(); if(x) out.push({zh:x,sp:l.sp});})); return out; }
function clozeSet(){
  const ws=shuffle(wordsMin(6)); const all=cur.words; const sents=[]; scopeTexts().forEach(t=>sents.push(...sentencesOf(t)));
  const items=[], used=new Set();
  for(const w of ws){ if(items.length>=5) break;
    const cand=[]; if(w.example && w.example.includes(w.hanzi)) cand.push({zh:w.example,vi:w.exampleVi});
    sents.filter(s=>s.zh.includes(w.hanzi) && [...s.zh].length<=40).forEach(s=>cand.push({zh:s.zh,vi:""}));
    const c=cand.find(x=>!used.has(x.zh)); if(!c) continue;
    // tránh câu có chứa từ khác trong ngân hàng (gây nhầm)
    if(items.some(it=>c.zh.includes(it.w.hanzi)||it.zh.includes(w.hanzi))) continue;
    used.add(c.zh); items.push({w,zh:c.zh,vi:c.vi});
  }
  const extra=shuffle(all.filter(x=>!items.some(it=>it.w===x) && !items.some(it=>it.zh.includes(x.hanzi))))[0];
  const bank=shuffle([...items.map(i=>i.w),...(extra?[extra]:[])]);
  return {items:shuffle(items),bank};
}
function paneCloze(){
  let {items,bank}=clozeSet(); let wide=false; if(items.length<4 && part){ const p0=part; part=0; ({items,bank}=clozeSet()); part=p0; wide=true; } const L="ABCDEF"; const ans=new Array(items.length).fill(null); let act=0, checked=false;
  $("#pane").innerHTML=`<div class="card pane"><h3>🕳️ Đục lỗ điền từ <span class="pos">${scopeName()} · dạng HSK 3.0 选词填空</span></h3>${fewNote(6)}
   ${wide?`<div class="note">Bài khoá ${part} có ít câu phù hợp nên đề lấy từ cả bài.</div>`:""}<div class="note">Chọn từ thích hợp điền vào chỗ trống (có 1 từ thừa). Bấm vào chỗ trống → bấm từ ở trên. Bấm lại chỗ đã điền để xoá.</div><div id="czBody"></div></div>`;
  const draw=()=>{
    $("#czBody").innerHTML=`<div class="bank">${bank.map((w,k)=>`<button class="bk ${ans.includes(k)?"used":""}" data-k="${k}"><span class="k">${L[k]}</span><span class="zh">${esc(w.hanzi)}</span></button>`).join("")}</div>
     <div class="czl">${items.map((it,i)=>{ const idx=it.zh.indexOf(it.w.hanzi); const pre=it.zh.slice(0,idx), post=it.zh.slice(idx+it.w.hanzi.length); const a=ans[i];
       const st=checked?(a!=null&&bank[a]===it.w?"right":"wrong"):(act===i?"act":"");
       return `<div class="czi"><span class="num">${i+1}</span><div><div class="zh czs">${esc(pre)}<button class="blank ${st}" data-i="${i}">${a!=null?`${L[a]} ${esc(bank[a].hanzi)}`:"（　　）"}</button>${esc(post)}</div>
       ${checked?`<div class="czv">${a!=null&&bank[a]===it.w?"✓":"✗ Đáp án: <b>"+L[bank.indexOf(it.w)]+" "+esc(it.w.hanzi)+"</b> ·"} ${esc(it.w.pinyin)} – ${esc(it.w.meaning)}${it.vi?` · <i>${esc(it.vi)}</i>`:""}</div>`:""}</div></div>`}).join("")}</div>
     <div class="qnav">${checked?`<span class="pill" style="margin-right:auto">Đúng ${items.filter((it,i)=>ans[i]!=null&&bank[ans[i]]===it.w).length}/${items.length}</span><button class="btn" id="czNew">↻ Làm bộ khác</button>`:`<button class="btn" id="czCk" ${ans.includes(null)?"disabled":""}>Kiểm tra</button>`}</div>`;
    if(checked){ $("#czNew").onclick=paneCloze; return; }
    document.querySelectorAll(".blank").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(ans[i]!=null){ans[i]=null;} act=i; draw(); });
    document.querySelectorAll(".bk").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if(ans.includes(k)) return; speak(bank[k].hanzi);
      if(act==null||ans[act]!=null) act=ans.indexOf(null); if(act<0) return; ans[act]=k; const nx=ans.indexOf(null); act=nx<0?null:nx; draw(); });
    $("#czCk").onclick=()=>{ checked=true; const c=items.filter((it,i)=>bank[ans[i]]===it.w).length; record(cur.lesson,"cloze",Math.round(c/items.length*100)); draw(); };
  };
  if(items.length<3){ $("#czBody").innerHTML=`<p>Phạm vi này chưa đủ câu để làm bài, hãy chọn “Cả bài”.</p>`; return; }
  draw();
}

/* ===== Sắp xếp 3 câu A B C thành đoạn văn (dạng 排列顺序) ===== */
function orderPool(){
  const pool=[]; const add=(arr,src)=>{ if(arr.length===3 && arr.join("").length<=60 && arr.every(x=>[...x].length>=3)) pool.push({parts:arr,src}); };
  const split3=s=>{ const c=s.split(/(?<=[，；])/).map(x=>x.trim()).filter(Boolean); if(c.length<3) return null;
    if(c.length===3) return c; const n=c.length, a=Math.round(n/3), b=Math.round(2*n/3); return [c.slice(0,a).join(""),c.slice(a,b).join(""),c.slice(b).join("")]; };
  scopeTexts().forEach(t=>{
    const ss=sentencesOf(t);
    ss.forEach(s=>{ const p=split3(s.zh); if(p) add(p,"clause"); });
    if(t.type==="para"){ for(let i=0;i+3<=ss.length;i++) add(ss.slice(i,i+3).map(x=>x.zh),"sent"); }
    else { for(let i=0;i+3<=t.lines.length;i++){ const g=t.lines.slice(i,i+3); if(g.every(l=>[...l.zh].length<=36)) add(g.map(l=>`${l.sp}：${l.zh}`),"dialog"); } }
  });
  wordsMin(1).forEach(w=>{ if(w.example){ const p=split3(w.example); if(p) add(p,"clause"); } });
  return pool;
}
function paneOrder(){
  let pool=orderPool(), wide=false; if(pool.length<4 && part){ const p0=part; part=0; pool=orderPool(); part=p0; wide=true; } const list=pick(pool,Math.min(5,pool.length)); let qi=0, ok=0;
  $("#pane").innerHTML=`<div class="card pane"><h3>🔢 Sắp xếp câu A, B, C thành đoạn văn <span class="pos">${scopeName()} · ${list.length} câu</span></h3>
   ${wide?`<div class="note">Bài khoá ${part} có ít câu phù hợp nên đề lấy từ cả bài.</div>`:""}<div class="note">Đọc 3 phần A, B, C rồi bấm theo thứ tự đúng để tạo thành câu / đoạn hội thoại hoàn chỉnh.</div><div id="oBody"></div></div>`;
  if(!list.length){ $("#oBody").innerHTML=`<p>Phạm vi này chưa đủ câu, hãy chọn “Cả bài”.</p>`; return; }
  function q(){
    const it=list[qi]; let perm=shuffle([0,1,2]); while(perm.every((x,i)=>x===i)) perm=shuffle([0,1,2]);
    const lab="ABC"; const shown=perm.map(i=>it.parts[i]); const chosen=[];
    const draw=(done)=>{ const correct=[0,1,2].map(i=>lab[perm.indexOf(i)]).join("");
      $("#oBody").innerHTML=`<div class="ghead"><span class="pill">Câu ${qi+1}/${list.length}</span><span class="pill">✓ ${ok}</span></div>
      <div class="abc">${shown.map((t,k)=>`<button class="abci ${chosen.includes(k)?"used":""}" data-k="${k}" ${done?"disabled":""}><span class="k">${lab[k]}</span><span class="zh">${esc(t)}</span>${chosen.includes(k)?`<span class="ord">${chosen.indexOf(k)+1}</span>`:""}</button>`).join("")}</div>
      <div class="ans-row">Thứ tự của bạn: ${[0,1,2].map(i=>`<span class="sq">${chosen[i]!=null?lab[chosen[i]]:""}</span>`).join("")}</div>
      <div class="feedback" id="oFb"></div><div class="qnav">${done?`<button class="btn" id="oNx">${qi===list.length-1?"Xem kết quả →":"Câu tiếp →"}</button>`:`<button class="btn ghost" id="oClr">Làm lại</button><button class="btn" id="oCk" ${chosen.length<3?"disabled":""}>Kiểm tra</button>`}</div>`;
      if(done){ const mine=chosen.map(k=>lab[k]).join(""), g=mine===correct; const fb=$("#oFb"); fb.className="feedback "+(g?"ok":"no");
        fb.innerHTML=(g?`✓ Chính xác! Đáp án: <b>${correct}</b>`:`✗ Bạn chọn ${mine}. Đáp án đúng: <b>${correct}</b>`)+`<div class="zh" style="font-size:18px;margin-top:6px;color:var(--ink)">${esc(it.parts.join(it.src==="dialog"?" / ":""))}</div>`;
        $("#oNx").onclick=()=>{qi++; qi<list.length?q():end();}; return; }
      document.querySelectorAll(".abci").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; const p=chosen.indexOf(k); if(p>=0) chosen.splice(p,1); else if(chosen.length<3) chosen.push(k); draw(false); });
      $("#oClr").onclick=()=>{chosen.length=0; draw(false);};
      $("#oCk").onclick=()=>{ if(chosen.map(k=>lab[k]).join("")===correct) ok++; draw(true); speak(it.parts.map(x=>x.replace(/^[^：]{1,4}：/,"")).join(""),0.85); };
    };
    draw(false);
  }
  function end(){ const sc=Math.round(ok/list.length*100); record(cur.lesson,"order",sc);
    $("#oBody").innerHTML=`<div class="done-box"><div class="big">${sc>=80?"🌟":"💪"}</div><h4>Đúng ${ok}/${list.length} câu (${sc}%)</h4><div class="row" style="justify-content:center"><button class="btn" onclick="paneOrder()">↻ Làm bộ khác</button></div></div>`; }
  q();
}

  const m=location.hash.match(/^#bai-(\d+)/); if(m) renderLesson(+m[1]); else { cur=null; renderHome(); }
