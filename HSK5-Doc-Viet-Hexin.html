button{font:inherit;cursor:pointer}
/* header */
header{background:linear-gradient(100deg,var(--pink),var(--peach));color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
header .logo{width:46px;height:46px;border-radius:12px;background:#fbf7f0;padding:3px;object-fit:contain;flex:none}
header .brand{font-weight:800;letter-spacing:.06em;font-size:18px;line-height:1.1;text-shadow:0 1px 2px rgba(120,40,30,.25)}
header .brand small{display:block;font-weight:500;letter-spacing:0;font-size:12px;opacity:.95}
header .sp{flex:1}
.hbtn{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.35)}
#who{font-size:13px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr) 270px;gap:16px;padding:16px;max-width:1400px;margin:0 auto;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
aside.left{padding:12px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
aside.right{padding:14px;position:sticky;top:84px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--accent-d)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.block{width:100%}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 4px 6px;font-weight:700}
.tlist{display:flex;flex-direction:column;gap:6px}
.titem{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 10px;width:100%}
.titem:hover{border-color:var(--accent)}
.titem.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.titem .nm{flex:1;font-size:14px}
.titem .best{font-size:12px;background:var(--accent);color:#fff;border-radius:999px;padding:1px 8px;white-space:nowrap}
/* main */
main{min-width:0}
.thead{padding:16px 18px;margin-bottom:14px}
.thead h1{margin:0 0 2px;font-size:20px}
.thead .src{color:var(--muted);font-size:13px}
.instr{margin-top:8px;font-size:14px;background:var(--panel2);border-radius:10px;padding:8px 12px}
.hist{padding:14px 16px;margin-bottom:14px}
.hist h3{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:13px}
.tbl-wrap{overflow-x:auto}
.q{padding:14px 16px;margin-bottom:14px;scroll-margin-top:90px}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qno{background:var(--accent);color:#fff;font-weight:800;border-radius:10px;padding:2px 10px}
.st{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.st.doing{background:var(--accent-soft);color:var(--accent-d);border-color:var(--accent)}
.st.done{background:var(--accent);color:#fff;border-color:var(--accent)}
.qtop .sp{flex:1}
.lbl{font-size:12px;color:var(--muted);margin:2px 0 4px}
.zone{min-height:54px;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bank{background:var(--panel2);border:1px dashed var(--line)}
.ans{background:var(--panel);border:2px dashed var(--chip-line);min-height:60px}
.ans.hot{border-color:var(--accent);background:var(--accent-soft)}
.bank.hot{border-color:var(--accent)}
.ans:empty::before{content:"Kéo hoặc chạm vào từ để đưa vào đây";color:var(--muted);font-size:13px;padding-left:4px}
.chip{font-family:var(--zh);font-size:19px;padding:6px 12px;background:var(--chip);border:1.5px solid var(--chip-line);border-radius:10px;
  user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;line-height:1.3;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.ans .chip{background:var(--accent-soft);border-color:var(--accent)}
.chip.lift{opacity:.25}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 8px 22px rgba(0,0,0,.25);background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
.ph{width:6px;height:36px;border-radius:3px;background:var(--accent);opacity:.8}
.locked .chip{cursor:default}
/* right */
.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:40px;font-weight:800;letter-spacing:.03em;color:var(--accent-d)}
.timer.red{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.tlab{text-align:center;color:var(--muted);font-size:12px}
.topts{display:flex;gap:6px;justify-content:center;margin:8px 0 12px}
.topt{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px}
.topt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.box{border-radius:12px;padding:8px;text-align:center;border:1px solid var(--line)}
.box b{display:block;font-size:24px}
.box.d{background:var(--accent);color:#fff;border-color:var(--accent)}
.box.u{background:#fff;color:#3d2a2e}
[data-theme="dark"] .box.u{background:#f6ede9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.gn{aspect-ratio:1/1;border-radius:10px;border:1.5px solid var(--chip-line);background:#fff;color:#3d2a2e;font-weight:700}
[data-theme="dark"] .gn{background:#f6ede9}
.gn.d{background:var(--accent);border-color:var(--accent);color:#fff}
.gn.p{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-d)}
.gn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.gn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
/* results */
.sum{padding:16px 18px;margin-bottom:14px}
.sum h2{margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--accent-d)}
.stat span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rv{font-size:14px}
.rv .row{margin:6px 0}
.rv .k{color:var(--muted);font-size:12px;display:block}
.rv .zhs{font-family:var(--zh);font-size:19px}
.wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.right{color:var(--ok);font-weight:700}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;font-weight:700}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.ex{background:var(--panel2);border-left:4px solid var(--peach);border-radius:8px;padding:8px 10px;margin-top:6px}
.q.okq{border-color:var(--ok)}
.q.badq{border-color:var(--bad)}
.wbank{display:flex;flex-wrap:wrap;gap:6px}
.wbank span{font-family:var(--zh);font-size:15px;border:1px solid var(--line);border-radius:8px;padding:1px 8px;background:var(--panel2)}
/* modal */
.mask{position:fixed;inset:0;background:rgba(40,20,20,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}
.modal{background:var(--panel);color:var(--ink);border-radius:18px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.modal input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font-size:16px;margin:8px 0}
.modal input:focus{outline:none;border-color:var(--accent)}
.modal .err{color:var(--bad);font-size:13px;min-height:18px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.namelogo{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.namelogo img{width:64px;height:64px;border-radius:14px;background:#fbf7f0;padding:4px}
.namelogo b{font-size:20px;letter-spacing:.06em;color:var(--accent-d)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.empty{color:var(--muted);text-align:center;padding:20px}
.link{color:var(--accent-d);background:none;border:none;text-decoration:underline;padding:0}
.part{font-size:13px;color:var(--muted);margin-top:8px}
/* responsive */
@media (max-width:1080px){.wrap{grid-template-columns:220px minmax(0,1fr) 240px}}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:10px;gap:10px}
  aside.left,aside.right{position:static;max-height:none}
  aside.left{order:1;padding:10px;overflow:visible}
  aside.right{order:2}
  main{order:3}
  .tscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .tscroll .grp{display:none}
  .tscroll .tlist{flex-direction:row;gap:8px}
  .titem{width:auto;white-space:nowrap;scroll-snap-align:start}
  .grid{grid-template-columns:repeat(8,1fr);gap:5px}
  .gn{aspect-ratio:auto;padding:6px 0}
  .timer{font-size:32px}
  .rightflex{display:grid;grid-template-columns:1fr;gap:4px}
  .stats{grid-template-columns:1fr 1fr}
  header{padding:8px 10px}
  header .brand{font-size:15px}
  #who{display:none}
}
@media (max-width:420px){.chip{font-size:17px;padding:5px 9px}.hbtn{padding:5px 9px;font-size:12px}}
</style>
<style>
/* ---- v2 additions ---- */
header .brand{display:flex;flex-direction:column}
header .brand .kh{font-size:22px;font-weight:900;letter-spacing:.08em;line-height:1.05;color:#d6336c;
  background:linear-gradient(90deg,#d6336c,#e8590c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.85));text-shadow:none}
header .brand .big{font-family:var(--zh);font-size:17px;font-weight:800;letter-spacing:.18em;line-height:1.2;margin-top:3px;color:#fff;text-shadow:0 1px 2px rgba(120,40,30,.35)}
header .brand .big small{display:inline;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.04em;font-weight:600;opacity:.95}
[data-theme="dark"] header .brand .kh{background:linear-gradient(90deg,#ff8fb1,#ffb27a);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
header .brand .kh{white-space:nowrap}
@media (max-width:860px){header .brand .kh{font-size:16px}header .brand .big{font-size:15px}header .brand .big small{display:none}}
/* end brand */
.kind{font-size:11px;border-radius:6px;padding:0 6px;font-weight:700;flex:none}
.kind.read{background:#ffe0e8;color:#b8405f}
.kind.write{background:#ffe6d2;color:#b95a20}
[data-theme="dark"] .kind.read{background:#5a2a36;color:#ffb3c6}
[data-theme="dark"] .kind.write{background:#5a3a24;color:#ffc79e}
.pg{padding:14px 16px;margin-bottom:14px}
.pg-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pg-h .rg{font-weight:800;color:var(--accent-d)}
.pg-h .pl{font-size:12px;color:var(--muted)}
.passage{font-family:var(--zh);font-size:17px;line-height:1.95;background:var(--panel2);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.passage p{margin:0 0 6px;text-indent:2em}
.passage p:last-child{margin-bottom:0}
.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--accent);color:var(--accent-d);font-weight:800;font-family:system-ui,sans-serif;font-size:14px;text-indent:0;padding:0 4px;line-height:1.4;cursor:pointer}
.blank.filled{background:var(--accent-soft);border-radius:6px 6px 0 0;font-family:var(--zh);font-size:16px}
.blank.okb{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.blank.badb{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.rq{padding:10px 0;border-top:1px dashed var(--line);scroll-margin-top:90px}
.rq:first-of-type{border-top:none}
.rq-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.rq-h .stem{font-family:var(--zh);font-size:17px;flex:1;min-width:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.long{grid-template-columns:1fr}
.opt{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 10px;font-family:var(--zh);font-size:16px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt b{font-family:system-ui,sans-serif;flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:var(--panel2);color:var(--accent-d);margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt.sel b{background:var(--accent);color:#fff}
.opt.okc{border-color:var(--ok);background:var(--ok-soft)}
.opt.okc b{background:var(--ok);color:#fff}
.opt.badc{border-color:var(--bad);background:var(--bad-soft)}
.opt.badc b{background:var(--bad);color:#fff}
.opt.badc span{text-decoration:line-through}
.opt[disabled]{cursor:default}
.grid.g45{grid-template-columns:repeat(5,1fr);gap:6px}
.grid.g45 .gn{aspect-ratio:auto;padding:5px 0;font-size:13px}
.gsec{grid-column:1/-1;font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.partrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.partrow span{background:var(--panel2);border-radius:999px;padding:3px 12px;font-size:13px}
@media (max-width:860px){
  .grid.g45{grid-template-columns:repeat(9,1fr);gap:4px}
  .grid.g45 .gn{font-size:12px;padding:5px 0}
  .opts.long{grid-template-columns:1fr}
  .khx{display:none}
  .passage{font-size:16px;padding:8px 10px}
}
</style>
</head>

vi": "Trình độ tiếng Trung của cô ấy thật sự chẳng ra sao.", "ex": "不怎么样 = không tốt lắm, chẳng ra gì. Phó từ 实在 đứng trước 不."}, {"w": ["被", "乒乓球教练", "认为是", "之一", "中国最优秀的", "李教练"], "a": ["李教练被认为是中国最优秀的乒乓球教练之一"], "vi": "Huấn luyện viên Lý được coi là một trong những HLV bóng bàn xuất sắc nhất Trung Quốc.", "ex": "S + 被认为是 + … + 之一: được cho là một trong những …."}, {"w": ["介绍了", "主人", "一下", "本地的风俗习惯", "向客人"], "a": ["主人向客人介绍了一下本地的风俗习惯"], "vi": "Chủ nhà giới thiệu qua cho khách về phong tục tập quán địa phương.", "ex": "S + 向 + người + V + 了 + 一下 + O. Cụm giới từ 向客人 đứng trước động từ."}, {"w": ["离家太远", "走得", "老年人", "不能", "散步"], "a": ["老年人散步不能走得离家太远"], "vi": "Người già đi dạo không nên đi quá xa nhà.", "ex": "Chủ ngữ 老年人散步 + 不能 + V + 得 + bổ ngữ trình độ (离家太远)."}, {"w": ["是", "最可怕", "承认错误", "的", "他从来不"], "a": ["最可怕的是他从来不承认错误", "他从来不承认错误是最可怕的"], "vi": "Điều đáng sợ nhất là anh ta chưa bao giờ thừa nhận sai lầm.", "ex": "Cấu trúc ……的是……: 最可怕的 (cụm chữ 的 làm chủ ngữ) + 是 + mệnh đề. 从来不 + V: chưa bao giờ."}]}, {"id": "de4", "group": "Đề thi thử", "title": "Đề thi thử 4 · 模拟试题（四）", "source": "新汉语水平考试模拟试题集 HSK5 · 第91–98题", "q": [{"w": ["表演的", "很", "同学们", "汉语节目", "精彩"], "a": ["同学们表演的汉语节目很精彩"], "vi": "Tiết mục tiếng Trung các bạn học biểu diễn rất đặc sắc.", "ex": "Định ngữ là cụm chủ-vị (同学们表演的) + N + 很 + Adj."}, {"w": ["一个游泳池", "食堂之间", "有", "图书馆", "和"], "a": ["图书馆和食堂之间有一个游泳池"], "vi": "Giữa thư viện và nhà ăn có một bể bơi.", "ex": "Câu tồn hiện: A + 和 + B + 之间 + 有 + số lượng + N."}, {"w": ["把握", "什么", "我对", "没有", "这次考试"], "a": ["我对这次考试没有什么把握"], "vi": "Tôi không mấy chắc chắn về kỳ thi lần này.", "ex": "Cấu trúc 对……(没)有把握. 什么 trong câu phủ định mang nghĩa \"chẳng … gì\"."}, {"w": ["学习情况", "接下来", "汇报一下孩子们", "向各位家长", "的"], "a": ["接下来向各位家长汇报一下孩子们的学习情况"], "vi": "Tiếp theo, xin báo cáo với các vị phụ huynh về tình hình học tập của các em.", "ex": "接下来 (tiếp theo) mở đầu câu; 向 + người + 汇报一下 + định ngữ 的 + O."}, {"w": ["必须", "丰富", "老百姓的文化生活", "想办法", "政府"], "a": ["政府必须想办法丰富老百姓的文化 const READ={"1": [{"part": 1, "range": "46-48", "passage": ["一位教授平时总是丢三落四，不是丢了眼镜盒，就是丢了手杖。[46]是雨伞，几乎每个月他夫人都得替他买一把。教授为此暗暗地下定决心，[47]要更加小心。一天，教授上午出去，下午回来，得意扬扬地对夫人说：“嗨，陶乐赛，今天我可没丢东西，我把伞给带回来啦！”说着，他亮出一把伞。“哎呀，瞧你这[48]人，你今天没有带伞出去呀！”他的夫人说。"], "qs": [{"n": 46, "stem": "", "o": ["经常", "特殊", "非常", "特别"], "ans": 3, "ex": "特别是… = \"đặc biệt là…\", dùng để nêu ra trường hợp nổi bật nhất (cái ông hay làm mất nhất là ô)."}, {"n": 47, "stem": "", "o": ["然后", "后来", "以后", "先后"], "ans": 2, "ex": "以后 = \"sau này, từ nay về sau\" (chỉ tương lai); 后来 chỉ dùng cho quá khứ."}, {"n": 48, "stem": "", "o": ["细心", "粗心", "小心", "用心"], "ans": 1, "ex": "粗心 = \"đãng trí, cẩu thả\" – hôm nay ông không mang ô đi mà lại mang ô người khác về."}]}, {"part": 1, "range": "49-52", "passage": ["一天，曾子外出工作，他的妻子带着儿子待在家里。", "妻子要出去买菜，可儿子不让，说：“妈妈，你去买菜可以，但是，我要吃肉！”妻子[49]早点儿上街买菜，便对儿子说：“乖孩子，让妈妈去买菜，妈妈买肉给你吃，好吗？”儿子高兴地跳了起来。可是，妻子回来时并没有给儿子买肉。", "曾子回到家以后，[50]了这件事，他对妻子说：“你怎么能不守信用呢？孩子现在还小，还没有辨别是非的能力，[51]，你现在不守信用，长大后他也会和你一样去欺骗别人！”曾子说完，便把自己家[52]养了三个多月的小猪给杀了，割下肉煮给儿子吃，儿子边吃肉边说：“大人真守信用，说到做到！”曾子听了欣慰地笑了。"], "qs": [{"n": 49, "stem": "", "o": ["因为", "为了", "由于", "于是"], "ans": 1, "ex": "为了 + mục đích: \"để (được) đi chợ sớm\", vợ mới dỗ con."}, {"n": 50, "stem": "", "o": ["认识", "懂得", "认为", "知道"], "ans": 3, "ex": "知道了这件事 = \"biết chuyện này\"; 认识 dùng cho người/chữ, 懂得 là hiểu đạo lý."}, {"n": 51, "stem": "", "o": ["觉得什么事情都是对的", "和你一样不想吃肉", "什么事情都以我们做榜样", "知道了信用的重要性"], "ans": 2, "ex": "Trẻ chưa phân biệt đúng sai nên \"việc gì cũng lấy cha mẹ làm gương\" → ăn khớp với câu sau."}, {"n": 52, "stem": "", "o": ["刚才", "刚刚", "曾经", "经常"], "ans": 1, "ex": "刚刚 + V + 了 + thời lượng: \"vừa mới nuôi được hơn ba tháng\"; 刚才 là danh từ thời gian, không đi với thời lượng."}]}, {"part": 1, "range": "53-56", "passage": ["在一个月光皎洁的夜晚，一只小猴到井里喝水，他[53]发现，井里有一个月亮，他叫道：“不好了，月亮掉进井里啦！”", "猴子们听了，都慌忙赶过来，说：“我们得把月亮捞上来，要不然，以后晚上就看不见了。”一只老猴望着旁边的大树，[54]。它说：“你们其中的一只把尾巴[55]在树上，然后一个拉着一个的尾巴，最后一只小猴拿着碗把月亮捞上来。”于是猴子们就[56]它说的办法去做。“月亮”终于捞上来了，他们特别高兴。可是一只小猴一不小心把碗打破了，月亮不见了，猴子们都哭了。"], "qs": [{"n": 53, "stem": "", "o": ["既然", "当然", "果然", "突然"], "ans": 3, "ex": "突然发现 = \"bỗng nhiên phát hiện\"; 果然 chỉ dùng khi đúng như dự đoán."}, {"n": 54, "stem": "", "o": ["很想爬到树上去", "想到了一个好主意", "以为月亮还躲在树上", "伤心得不知道该怎么办"], "ans": 1, "ex": "Câu sau con khỉ già nói ra cách làm → \"nghĩ ra một ý hay\"."}, {"n": 55, "stem": "", "o": ["摆", "摸", "挂", "拦"], "ans": 2, "ex": "把尾巴挂在树上 = \"móc đuôi lên cây\"."}, {"n": 56, "stem": "", "o": ["按着", "随着", "接着", "拿着"], "ans": 0, "ex": "按着…去做 = \"làm theo (cách)…\"."}]}, {"part": 1, "range": "57-60", "passage": ["足球已经成为当代世界第一大运动。不过，[57]足球比赛11人制的演变过程还是颇有历史的。公认的现代足球运动始于英格兰。最初的时候，比赛就在长方形场地内进行，时间和参赛人数都由双方临时商定。在19世纪早期的英国伦敦，牛津和剑桥之间经常进行比赛，他们[58]起来，[59]。当时每队有11个人进行比赛。因为当时在学校里每[60]宿舍住有10个学生和1位教师，因此他们就双方各11人进行宿舍与宿舍之间的比赛，现在的11人足球比赛就是从那时开始的。"], "qs": [{"n": 57, "stem": "", "o": ["在于", "关于", "至于", "对于"], "ans": 1, "ex": "关于 + chủ đề: \"về (quá trình hình thành chế độ 11 người)\"."}, {"n": 58, "stem": "", "o": ["商量", "发生", "判断", "组织"], "ans": 3, "ex": "组织起来 = \"tổ chức lại (thành đội)\"."}, {"n": 59, "stem": "", "o": ["还多次获得了冠军", "并制定了一项规则", "对球迷进行了访问", "决定恢复5人制比赛"], "ans": 1, "ex": "Sau đó nói \"mỗi đội có 11 người\" → họ \"đặt ra một quy tắc\"."}, {"n": 60, "stem": "", "o": ["套", "双", "群", "批"], "ans": 0, "ex": "套 là lượng từ cho căn hộ/phòng ở trọn bộ: 一套宿舍."}]}, {"part": 2, "range": "61", "passage": ["我对这次逃课出去玩儿感到十分后悔，一是没有学到应该学的知识，二是让父母老师着急，停下手头的工作，四处找我。我以后再也不会这样了，而且从现在开始我要努力学习，争取早日把成绩赶上去，请爸爸妈妈和老师们放心。"], "qs": [{"n": 61, "stem": "", "o": ["爸妈报了警来找我", "三个人在听我讲话", "我现在成绩不是很好", "爸妈找我找了四天"], "ans": 2, "ex": "\"争取早日把成绩赶上去\" (cố gắng sớm đuổi kịp thành tích) → hiện thành tích chưa tốt."}]}, {"part": 2, "range": "62", "passage": ["网络文学困扰着传统作家。但传统作家的危机感，恰恰是网络写手的曙光。网络作家在自己土生土长的这个网络“小草窝”待得很舒服，并不看重登上所谓的大雅之堂。不管承认不承认，这种关于未来的碰撞已经悄然展开。"], "qs": [{"n": 62, "stem": "", "o": ["网络作家并不安于现状", "传统作家很喜欢网络作家", "网络文学对传统文学没影响", "网络文学与传统文学有冲突"], "ans": 3, "ex": "\"困扰\"\"危机感\"\"碰撞\" → văn học mạng và văn học truyền thống có xung đột."}]}, {"part": 2, "range": "63", "passage": ["南方的传统房屋是瓦房。夏天，因为瓦与瓦之间有空隙，房子里多余的热量通过这些空隙散出去。冬天，又因为瓦由陶土烧成，陶土的导热性差，能起到保温作用。所以瓦房以前很受南方人的欢迎。"], "qs": [{"n": 63, "stem": "", "o": ["瓦房现在还很流行", "瓦房在天冷时可保温", "陶土烧的东西散热性好", "瓦房住起来冬热夏冷"], "ans": 1, "ex": "Mùa đông ngói gốm dẫn nhiệt kém → \"起到保温作用\" (giữ ấm)."}]}, {"part": 2, "range": "64", "passage": ["为了防止脱发，每个健康成年人每日粮食的摄入量应在400克左右，最少不能低于300克，即使在减肥期间也不能不吃主食。适当摄入一些能够益肾、养血、生发的食物，如芝麻、核桃仁、桂圆肉、大枣等，对防治脱发也会大有好处。"], "qs": [{"n": 64, "stem": "", "o": ["多吃主食有益于身体", "芝麻对防治脱发没有好处", "吃主食不利于减肥", "适量的主食可以防止脱发"], "ans": 3, "ex": "Đoạn văn nói ăn lượng lương thực vừa đủ (khoảng 400g) để phòng rụng tóc; không nói \"ăn nhiều\"."}]}, {"part": 2, "range": "65", "passage": ["水污染不仅影响人类健康，也影响与水相关的娱乐、工业及美感。人们越来越关注通过水污染传播的病毒性疾病，也越来越关注水中的化学制品。"], "qs": [{"n": 65, "stem": "", "o": ["人们对水污染越来越关注", "水污染只对人类健康有影响", "病毒性疾病都是通过水传播", "水中的化学制品对水没影响"], "ans": 0, "ex": "\"越来越关注\" lặp lại hai lần → mọi người ngày càng quan tâm đến ô nhiễm nước."}]}, {"part": 2, "range": "66", "passage": ["如果你整天盯着电脑看而不休息，那么眼部就会肿痛、干涩，聚焦困难，还会导致头痛或是脖颈疼痛等现象。75%的电脑使用者都有类似的症状。使用电脑时，屏幕应距自己至少60厘米远。另外，一定要每20～30分钟向远处望一望，让自己的眼睛放松一下。"], "qs": [{"n": 66, "stem": "", "o": ["使用电脑应该每60分钟放松一下", "少数人长时间使用电脑会有不良反应", "使用电脑时应距离屏幕0.6米远", "长期使用电脑不休息会导致失眠"], "ans": 2, "ex": "60 厘米 = 0,6 mét. A sai (20–30 phút), B sai (75% là đa số)."}]}, {"part": 2, "range": "67", "passage": ["“月光族”指将每月赚的钱都用光、花光的人，一般都是年轻一代，他们喜欢追逐新潮，想买就买，根本不在乎钱财。同时也用来形容每月收入仅可以维持每月基本开销的职场新人。“月光族”的口号是：挣多少花多少。这个词是一个中性词，没有绝对的褒贬义。"], "qs": [{"n": 67, "stem": "", "o": ["“月光族”都是收入不多的人", "“月光族”都是花钱大方的人", "“月光族”喜欢把钱存在银行", "“月光族”基本上都是年轻人"], "ans": 3, "ex": "\"一般都是年轻一代\" → về cơ bản là người trẻ. A, B dùng \"都\" quá tuyệt đối."}]}, {"part": 2, "range": "68", "passage": ["蓝鲸是海洋中的大型动物之一。别看它个头大，性格可温顺呢。它属于须鲸，靠滤食法捕食，它捕食的时候，先猛吸一口，吸进很多海水，再把海水吐出来，通过滤板把小鱼小虾挡在嘴里。那些小东西们只得乖乖当了蓝鲸的食物。"], "qs": [{"n": 68, "stem": "", "o": ["蓝鲸的体积很庞大", "蓝鲸的速度非常快", "蓝鲸捕食方式粗暴", "蓝鲸捕食喝很多水"], "ans": 0, "ex": "\"大型动物之一\"\"个头大\" → thân hình to lớn. D sai: nó hút nước vào rồi nhả ra, không uống."}]}, {"part": 2, "range": "69", "passage": ["从前有一个人有健忘症。有一天他买了一本《记忆的诀窍》，看后觉得十分有用，于是就去跟朋友炫耀：“我昨天买了一本《记忆的诀窍》，真是太好了，我昨晚一口气就把它读完了。”朋友很惊喜：“能否借给我读一读？”他说：“当然可以。咦？我把它搁在哪儿了？”"], "qs": [{"n": 69, "stem": "", "o": ["健忘症患者的病在看书后好转了", "《记忆的诀窍》有助于提高记忆力", "健忘症患者的朋友也很健忘", "健忘症患者在看过书后仍然健忘"], "ans": 3, "ex": "Đọc xong sách mẹo ghi nhớ mà vẫn quên để sách ở đâu → vẫn hay quên."}]}, {"part": 2, "range": "70", "passage": ["中国是最早利用蚕丝的国家。蚕丝和大麻、苎麻，以及后来的棉花，是古代中国人主要的衣着原料。几千年来，中国养蚕技术长期处于世界领先地位，并对世界蚕业有巨大贡献。公元前11世纪，养蚕技术传入朝鲜，随后又传到了日本。秦汉以后，中国的养蚕技术通过丝绸之路传到欧亚其他地区。"], "qs": [{"n": 70, "stem": "", "o": ["古代中国人最早利用棉花做衣服", "古代中国的养蚕技术非常先进", "养蚕技术通过丝绸之路传到日本", "中国人只穿蚕丝和棉花做的衣服"], "ans": 1, "ex": "\"长期处于世界领先地位\" → kỹ thuật nuôi tằm rất tiên tiến. C sai: qua Con đường tơ lụa là đến Âu–Á."}]}, {"part": 3, "range": "71-73", "passage": ["在妈妈肚子里的时候，我就经常跟她一起去打篮球。当时只是个小胎儿的我跟着妈妈一块儿跑，一块儿跳，一起享受运动的快乐。所以我天性好动，爱玩儿，喜欢无拘无束。", "在上海上小学时，爸爸经常带着我看足球赛，这慢慢培养了我对足球的兴趣。凑巧的是我们那一群女孩子也个个儿都喜欢踢球。那时候，足球是用纸团起来的，球场就是教室与教室中间的过道。我们总是焦急地盼望下课铃声快点儿响，下课铃一响我们就立即冲出教室练起来，一直到上课。现在想想，那时老师真好，能容得下我们这些女孩子在那里疯玩儿。我们甚至自己组队参加小学生运动会，结果拿了个倒数第二名。这次失败对我们的打击特别大，队伍也因此就解散了。", "后来我考上了一所很好的中学，可我是铁了心地想去踢足球，因为我觉得那是人生中最快乐的事，谁又能阻挡呢？从此我就走上了足球之路。"], "qs": [{"n": 71, "stem": "是谁培养了作者对足球的兴趣？", "o": ["爸爸", "妈妈", "老师", "同学"], "ans": 0, "ex": "\"爸爸经常带着我看足球赛，这慢慢培养了我对足球的兴趣\"."}, {"n": 72, "stem": "以下哪个不是作者对小学老师的感情？", "o": ["感激", "讨厌", "喜欢", "夸奖"], "ans": 1, "ex": "Tác giả nói \"那时老师真好\" → biết ơn, quý mến; không hề \"ghét\"."}, {"n": 73, "stem": "关于作者，以下哪个说法是正确的？", "o": ["她的学习成绩很差", "她踢球一直很顺利", "她父母也热爱运动", "她从小就爱打篮球"], "ans": 2, "ex": "Mẹ chơi bóng rổ khi mang thai, bố hay dẫn đi xem bóng đá → bố mẹ đều thích thể thao."}]}, {"part": 3, "range": "74-77", "passage": ["好雨知时节，当春乃发生。今晨5时许，京城开始落下细雨。气象台预测，这场春雨将持续至少24小时以上，仅在今天傍晚到前半夜，就会有5至10毫米的降水量，超过去年整个冬天的降水量。", "此次降雨覆盖全市平原山区，降水是去年入冬以来北京最大的一次。", "上午10时，北京气象台分布在全市的降水自动观测站数据表明，昌平、延庆等西北部地区降水量最大，已达2毫米，北部山区将重现白茫茫的冬季景象，开车外出的朋友要关注路况信息，谨慎出行。", "明天，经过降水洗礼的京城将迎来一个清新凉爽的元宵节，过境的冷空气带来五六级偏北风，预计阵风将达到6级，气温也有明显下降，明天夜间最低气温仅有零下4℃，比今天最低气温降低5℃，创近来新低。"], "qs": [{"n": 74, "stem": "根据第一段，我们可以知道：", "o": ["今天早晨四点半北京在下雨", "这次的降雨量比去年同一时期大", "这场雨的持续时间并不长", "这场雨在今天傍晚将会停止"], "ans": 1, "ex": "Lượng mưa vượt cả mùa đông năm ngoái. Mưa bắt đầu khoảng 5 giờ, kéo dài ít nhất 24 giờ."}, {"n": 75, "stem": "此次降雨量最大的地区是：", "o": ["北京西北部", "北京东南部", "北京的平原地区", "北京的山区"], "ans": 0, "ex": "\"昌平、延庆等西北部地区降水量最大\"."}, {"n": 76, "stem": "北部山区将会出现什么天气？", "o": ["降雨", "降雪", "大风", "晴天"], "ans": 1, "ex": "\"重现白茫茫的冬季景象\" = cảnh trắng xóa mùa đông → có tuyết."}, {"n": 77, "stem": "今天夜间最低气温是：", "o": ["5℃", "1℃", "-1℃", "-4℃"], "ans": 1, "ex": "Đêm mai −4℃, thấp hơn hôm nay 5℃ → hôm nay −4 + 5 = 1℃."}]}, {"part": 3, "range": "78-82", "passage": ["李连杰初到好莱坞时，几乎没有人看好他，好不容易有一家电影公司愿意请他出演，但片酬很低，只有100万美元，而且是演一个<u>反派</u>角色。李连杰犹豫不决，说自己要经过慎重考虑之后，才能答复。但是，等他答应出演时，对方却改口了，片酬降为75万美元。", "钱不是最要紧的，只是在20世纪90年代的东南亚电影市场，“李连杰”三个字早已是金字招牌，从“功夫皇帝”沦落到现在的境地，李连杰感到难以接受。但他考虑再三，还是决定出演，可是，没想到对方却又落井下石：“50万美元，不演拉倒。”50万美元，还包括律师、经纪人、宣传公司等各项费用，再扣完税，所剩无几。但李连杰答应得很痛快：“我演。”", "就这样，李连杰拍了他的第一部好莱坞影片《致命武器4》，虽然片中巨星云集，但在影片首映当晚，李连杰就获得7.5分，成为演员排行榜中的亚军。", "第二天，电影公司的老板就亲自上门，毕恭毕敬地说：“下一部片子请您演主角，如何？”当实力证明一切的时候，才能轮到李连杰说话，他的第四部好莱坞影片片酬就开到了1700万美元。", "李连杰以退为进，成功地敲开了好莱坞的大门。他谈起往事，感触颇多，念了一首哲理诗：“手把青秧插满田，低头便见水中天；六根清净方为道，退步原来是向前。”大丈夫与其怨天尤人，不如尊重现实，迂回前进。"], "qs": [{"n": 78, "stem": "李连杰在好莱坞的第一部影片片酬是：", "o": ["100万美元", "75万美元", "50万美元", "1700万美元"], "ans": 2, "ex": "Cát-xê bị ép từ 100 → 75 → cuối cùng 50 vạn USD và anh ấy nhận lời."}, {"n": 79, "stem": "后来，电影公司的老板态度十分恭敬的原因是：", "o": ["李连杰片酬要求不高", "李连杰曾是“功夫皇帝”", "李连杰的演出很成功", "李连杰特别尊重现实"], "ans": 2, "ex": "Phim công chiếu, anh được 7.5 điểm, á quân bảng xếp hạng → diễn rất thành công."}, {"n": 80, "stem": "文中画线的“反派”一词应如何理解？", "o": ["反义的", "反面的", "相反的", "反对的"], "ans": 1, "ex": "反派角色 = vai phản diện → 反面的 (mặt trái, phía xấu)."}, {"n": 81, "stem": "李连杰在第一部影片中获得了多少分？", "o": ["6.5分", "7.5分", "8.5分", "9.5分"], "ans": 1, "ex": "\"李连杰就获得7.5分\"."}, {"n": 82, "stem": "最适合这篇文章的标题是：", "o": ["李连杰不在乎片酬", "影坛诗人李连杰", "李连杰好莱坞奋斗史", "李连杰第一次演电影"], "ans": 2, "ex": "Cả bài kể quá trình anh phấn đấu ở Hollywood \"以退为进\"."}]}, {"part": 3, "range": "83-86", "passage": ["一位集团公司的人力资源部经理告诉我，他招聘员工的时间是5分钟，加上让应聘者走入他的办公室、入座、非正式对话的时间5分钟，总共不会超过10分钟。", "也就是说，公司是否录用一个人，只有区区10分钟。所有的成功、失败都浓缩在这短暂的10分钟里。", "我说，这不公平，也不负责任。他说，10分钟最公平，最负责任。", "他说70%以上的应聘者走入他的办公室不会首先打招呼说你好；50%以上的应聘者衣冠不整洁；30%的应聘者神态紧张；20%的应聘者目光游移。还有什么好说的？让他们走吧！每人只有10分钟，但很多人在前5分钟就已经输了。", "我心悦诚服，应聘者的确已经输了。", "想起一位公共关系学教授，他曾经在课上问我们：你们看过孔雀开屏吗？同学们说看过，很美。教授说，每个人都要学那孔雀，10分钟让整个世界记住自己的美丽。", "那是《公共关系学》第一课时，教授的开场白。", "每个人像孔雀那样用10分钟展示自己的美，好像不符合中国人的传统，我们喜欢相信日久见人心和细水长流。但在现代工业以分秒计算的工作时间里，你没有更多的时间表现自己。", "你很优秀，可是你要知道，你只有很少的时间，10分钟，甚至更少。"], "qs": [{"n": 83, "stem": "应聘者应聘失败的原因很多，本文没有提到的是：", "o": ["进办公室不打招呼", "经理给的时间不够", "应聘者神态太紧张", "应聘者精神不集中"], "ans": 1, "ex": "Bài nêu: không chào, ăn mặc không gọn, căng thẳng, ánh mắt láo liên; \"thời gian không đủ\" không phải nguyên nhân."}, {"n": 84, "stem": "文章第五段表明作者：", "o": ["态度转变", "很不服气", "非常高兴", "相信自己"], "ans": 0, "ex": "Lúc đầu cho là \"不公平\", đến đoạn 5 \"心悦诚服\" → thái độ đã thay đổi."}, {"n": 85, "stem": "本文中的两个故事都说明：", "o": ["应聘时要给人留下好印象", "抓紧时间表现自己", "孔雀用10分钟展现美丽", "始终相信日久见人心"], "ans": 1, "ex": "Cả hai câu chuyện đều nhấn mạnh thời gian ngắn, phải tranh thủ thể hiện bản thân."}, {"n": 86, "stem": "本文的最佳标题是：", "o": ["面试决定成功", "一节难忘的课", "你只有10分钟", "孔雀也很美丽"], "ans": 2, "ex": "Câu kết \"你只有很少的时间，10分钟\" là ý chính của bài."}]}, {"part": 3, "range": "87-90", "passage": ["一个人学会说话时必须同时学会听话，这两个结合起来才叫会说话。", "说话主要是为了交流，不是一个人的事情，别人表达思想时我们要有耐心，不要觉得对方幼稚或无知。别人用简单方式问，我用简单方式答；别人用复杂方式问，我用复杂方式答。", "说话是为了表达我们内心的思想，而不是要找出别人的缺点，所以说话不要带出别人的缺点，这就好像去捅别人的眼睛，不会有什么好的效果。", "有时候你并不需要讲很多道理，只要耐心地去听，就是一个理解、接受、赞同别人的态度。", "说话太多会导致我们的话没有分量。在不必要的场合和不关键的地方随便说出，常常使说话变成了一种炫耀，这就使你的话没有力量。", "说谎会使我们的话大打折扣，刚开始只是因为不说谎不行，慢慢地养成了习惯，时不时说谎。人家看到你的这种方式，就会认为你的话甚至你这个人不可信。", "有些时候我们给别人提一些好的建议，但要看说话的时机，要注意用对方接受得了的方式。"], "qs": [{"n": 87, "stem": "什么是“会说话”？", "o": ["知道何时说话", "会说话和听话", "知道如何表达思想", "会用不同方式说话"], "ans": 1, "ex": "Câu đầu: học nói phải đồng thời học nghe, \"这两个结合起来才叫会说话\"."}, {"n": 88, "stem": "下列哪项是本文的观点？", "o": ["要懂得讲道理", "要耐心地去倾听", "要给别人提建议", "要指出对方的缺点"], "a , "京剧的服装有季节的分别", "川剧的服装受明代的影响最大", "京剧的角色就是生、旦、净、末"], "ans": 2, "ex": "\"以明代服装为基础\" → trang phục Xuyên kịch chịu ảnh hưởng nhà Minh lớn nhất."}]}, {"part": 2, "range": "69", "passage": ["据报道，蝙蝠也是冬眠的。它在山洞里用后足的尖爪攀住石缝，头朝下悬在空中，一“吊”就是半年。而刺猬冬眠时，蜷缩成一团，远看好像一个大绒球。它在巢穴中冬眠时，体温下降到9度。冬眠中的刺猬会偶尔醒来，但不吃东西，很快又入睡了。冬眠的刺猬如果过早醒来会被饿死的。"], "qs": [{"n": 69, "stem": "", "o": ["蝙蝠冬眠的时间长达6个月", "刺猬冬眠时也要吃东西", "刺猬冬眠时体温不会下降", "蝙蝠是挂在树上冬眠的"], "ans": 0, "ex": "\"一‘吊’就是半年\" = nửa năm = 6 tháng. D sai (trong hang đá)."}]}, {"part": 2, "range": "70", "passage": ["“蚁族”，并不是一种昆虫族群，它代表的是大学毕业生低收入聚居群体，指的是毕业后无法找到工作或工作收入很低而聚居在城乡结合部的大学生。“蚁族”，是对“大学毕业生低收入聚居群体”的典型概括。他们是有如蚂蚁般的“弱小的强者”，他们是鲜为人知的庞大群体。"], "qs": [{"n": 70, "stem": "", "o": ["“蚁族”现象已经受到大家的关注", "“蚁族”是收入非常低的庞大的群体", "“蚁族”是聚居在城市中心的大学毕业生", "“蚁族”不仅指昆虫族群还指大学毕业生"], "ans": 1, "ex": "\"低收入\"\"庞大群体\". A sai (鲜为人知 = ít người biết), C sai (城乡结合部 – vùng ven)."}]}, {"part": 3, "range": "71-73", "passage": ["从前有个老木匠准备退休，于是他去告诉老板，说要离开建筑行业，回家与妻子儿女享受天伦之乐。", "老板舍不得他的好工人走，问他能不能帮忙再建造一座房子，老木匠回答说可以。", "但是大家渐渐地都看出来，老木匠的心已不在工作上了，他用的是不好的材料，做的活儿很粗糙。房子建好的时候，老板把一把大门的钥匙递给他。“这是你的房子，”老板说，“你为我工作了这么久，这幢房子就作为我送给你的礼物吧。”", "老木匠震惊得目瞪口呆，羞愧得无地自容。他是多么后悔啊！如果他早知道是在给自己建房子，他怎么会这样呢？现在他只得住在一幢粗制滥造的房子里！"], "qs": [{"n": 71, "stem": "关于老板，下列说法正确的是：", "o": ["舍不得木匠离开", "很喜欢建造房子", "知道木匠干活儿粗", "对员工非常小气"], "ans": 0, "ex": "\"老板舍不得他的好工人走\"."}, {"n": 72, "stem": "根据本文，下面哪种说法错误？", "o": ["老板是个大方的人", "老木匠不想再工作", "老木匠干活儿很细心", "老木匠工作很久了"], "ans": 2, "ex": "Bài nói \"做的活儿很粗糙\" (làm ẩu) → \"rất cẩn thận\" là sai."}, {"n": 73, "stem": "最终老木匠的心情是怎么样的？", "o": ["开心", "生气", "惊讶", "后悔"], "ans": 3, "ex": "\"他是多么后悔啊！\" – cảm xúc sau cùng là hối hận."}]}, {"part": 3, "range": "74-77", "passage": ["一对兄弟住在一起，每天一起出门上班。因为哥哥下班时间早，总是先到家，所以弟弟从来不担心开门的事，也从不带钥匙。", "有一天，因为突发状况，弟弟提早回了家。", "他坐在门槛上，焦急地等待着哥哥早点儿出现，等呀等，好不容易几个小时过去了，哥哥终于出现在眼前。", "哥哥见到弟弟在门口苦等，问：“你为什么坐在这里？”", "弟弟说：“我没有钥匙啊！”", "哥哥笑而不语，然后用手轻轻一推，门就开了！", "原来，门从来没有上锁。", "弟弟苦等在门口，只因为他连试着用自己的手去推推门的想法都没有。", "这个故事说明了人生之所以有些问题“不能”解决，有时候只是因为我们自己“不想”解决，不愿意尝试，不肯开口，也不肯动手。"], "qs": [{"n": 74, "stem": "关于哥哥和弟弟上班的时间，哪个是正确的？", "o": ["两个人同一时间出门", "弟弟比哥哥走得早", "哥哥比弟弟走得早", "谁出门早是不固定的"], "ans": 0, "ex": "\"每天一起出门上班\" → cùng giờ ra khỏi nhà."}, {"n": 75, "stem": "弟弟为什么从来不带钥匙？", "o": ["因为弟弟记性不太好", "因为弟弟不喜欢操心", "因为弟弟下班的时间早", "因为哥哥在弟弟之前回家"], "ans": 3, "ex": "\"哥哥下班时间早，总是先到家\"."}, {"n": 76, "stem": "弟弟某一天提早回家的原因是：", "o": ["他突然想休息", "他突然有特别的事", "他想要拿钥匙", "他要等哥哥回家"], "ans": 1, "ex": "\"因为突发状况\" = có việc đột xuất."}, {"n": 77, "stem": "这个故事告诉我们：", "o": ["要提高自己的记忆力", "回家一定要带钥匙", "遇到困难要多开口多动手", "门关着的时候可以用手推"], "ans": 2, "ex": "Câu kết: vấn đề không giải quyết được vì \"不肯开口，也不肯动手\"."}]}, {"part": 3, "range": "78-82", "passage": ["英国最新研究结果显示，婴儿开始学习欺骗的时间比原先以为的要早，最早六个月大时就会开始骗人。", "行为专家发现，简单的骗术有助于婴儿在稍大时学习如何编造更复杂的谎言。六个月大至三岁间婴幼儿采用的欺骗方法可分七种。婴儿很快就会发现，假哭与装笑能够引起注意。八个月大的婴儿会运用难度更高的欺骗技巧，例如掩饰父母禁止的活动，或设法分散父母的注意力。两岁的幼儿可能使用更高明的技巧，例如父母准备惩罚时，便大哭。", "心理学家此前认为，四岁前的发育中大脑不可能编造谎言。假哭是最早出现的欺骗方法之一。即使一切正常，婴儿也会以这种方法引起注意。他们会暂停，看看母亲有无反应，再决定是否继续假哭。这种现象显示，他们能够分辨什么行为可以奏效。"], "qs": [{"n": 78, "stem": "最新研究结果显示，婴儿多大学会骗人？", "o": ["六个月", "八个月", "三岁", "四岁"], "ans": 0, "ex": "\"最早六个月大时就会开始骗人\"."}, {"n": 79, "stem": "以前专家认为婴儿最早什么时候学会骗人？", "o": ["六个月", "八个月", "三岁", "四岁"], "ans": 3, "ex": "\"心理学家此前认为，四岁前…不可能编造谎言\"."}, {"n": 80, "stem": "七个月大的婴儿会怎么欺骗别人？", "o": ["大脑还不会编造谎言", "掩饰父母禁止的活动", "分散父母的注意力", "用假哭吸引父母注意"], "ans": 3, "ex": "7 tháng chưa tới mức 8 tháng (che giấu, đánh lạc hướng) → chỉ dùng khóc giả, cười giả."}, {"n": 81, "stem": "根据本文，以下哪一种说法是正确的？", "o": ["两岁的婴儿比三岁的婴儿会骗人", "如果一切正常婴儿就不会假哭了", "婴儿一直哭就是想引起别人注意", "婴儿能够分辨什么行为可以奏效"], "ans": 3, "ex": "Câu cuối: \"他们能够分辨什么行为可以奏效\"."}, {"n": 82, "stem": "最适合本文的标题是：", "o": ["婴儿的欺骗", "婴儿的假哭", "婴儿的装笑", "婴儿的聪明"], "ans": 0, "ex": "Toàn bài nói về việc trẻ sơ sinh \"lừa dối\"; khóc giả chỉ là một phần."}]}, {"part": 3, "range": "83-86", "passage": ["“减肥”是时下使用率最高的词之一，减肥的人往往关注饮食，但空调的使用也是肥胖不可忽视的诱因之一。空调让我们总是待在恒温的环境里，所以我们不用调节自己体内的热量。科学家们建议，人们离开空调区就可以减轻体重。因为如果气温很低，我们的身体就会自动消耗脂肪，以保持温暖。如果天气很热，我们的食欲就会降低，摄入的热量自然也少，而大量出汗又进一步消耗热量。研究表明，和以前相比，现在人用空调把家里的温度调节得冬天更加暖和，夏天更加凉爽，抵消了调节我们体重的天然因素。"], "qs": [{"n": 83, "stem": "“减肥”这个词的使用率高说明什么？", "o": ["“减肥”这个词含义丰富", "“减肥”这个词含义深刻", "人们关注肥胖问题", "人们关注饮食问题"], "ans": 2, "ex": "Từ \"giảm cân\" được dùng nhiều → mọi người quan tâm vấn đề béo phì."}, {"n": 84, "stem": "空调的作用是什么？", "o": ["调节湿度", "调节室温", "净化空气", "制造氧气"], "ans": 1, "ex": "\"用空调把家里的温度调节得冬天更加暖和，夏天更加凉爽\"."}, {"n": 85, "stem": "人体内的脂肪的作用是什么？", "o": ["生成血液", "制造氧气", "帮助获取热量", "保证人体温度"], "ans": 3, "ex": "\"身体就会自动消耗脂肪，以保持温暖\"."}, {"n": 86, "stem": "为什么天热人的体重会下降？", "o": ["消耗大但补充得少", "人体大量出汗", "天热时食物的营养少", "使用空调时间太长"], "ans": 0, "ex": "Trời nóng: ăn ít (nạp ít nhiệt) + ra nhiều mồ hôi (tiêu hao nhiều) → A bao quát cả hai."}]}, {"part": 3, "range": "87-90", "passage": ["奇奇怀孕九个月了，出门越来越不方便，丈夫就不让她出门，需要买的东西，丈夫都替她想好也买好了。今天是奇奇妈妈的生日，丈夫上班去了，奇奇只好一个人去妈妈家。", "走到车站，公共汽车还没有来，奇奇就站在旁边等。突然后面有人轻轻拍她的肩膀。奇奇转过身，一个姑娘指着候车的长椅说：“大姐，你坐吧。”“你丈夫真好。”姑娘笑着说。", "“哎。”奇奇应了声，可心里感到很奇怪，这姑娘怎么突然说这话？", "车来了，围住车门的人却都不上车，自动给奇奇让出一条路。奇奇脸红了，连声说“谢谢”。奇奇一上车一个小伙子就站了起来，让出了座位。奇奇坐了下来，心里涌起了热流：今天真温暖！", "“你丈夫真好！”小伙子下车时说。", "“谢谢。”奇奇赶忙道谢，但心里却更不明白了：怎么人们都知道自己的丈夫好呢？", "到了站，奇奇站了起来，拥挤的车厢里又让出了一条路。周围的人们都面带微笑，用一种羡慕的眼神目送她下车。", "“你丈夫真好！”一位大姐说。", "“谢谢！”奇奇心里<u>乐开了花</u>，车上的人都向她招手致意。", "奇奇到了家。这时小妹忽然在奇奇的后面哇地大叫一声，大家都被惊动了。小妹小心地从奇奇背后揭下一张用透明胶带粘着的纸片，纸片上写着：请给我的妻子让个座，谢谢！", "奇奇捧着纸片，落下了感动的泪水。"], "qs": [{"n": 87, "stem": "奇奇为什么觉得“今天真温暖”？", "o": ["今天艳阳高照", "她的衣服很保暖", "大家都很照顾她", "她坐的位置很暖和"], "ans": 2, "ex": "Mọi người nhường đường, nhường ghế → được quan tâm, thấy ấm lòng."}, {"n": 88, "stem": "文中画线的“乐开了花”是什么意思？", "o": ["非常激动", "非常高兴", "非常热情", "非常感动"], "ans": 1, "ex": "乐开了花 = vui như hoa nở, rất vui."}, {"n": 89, "stem": "以下哪一项不是丈夫人好的表现？", "o": ["陪奇奇坐公共汽车", "准备奇奇需要的东西", "不让怀孕的奇奇出门", "贴纸片请路人照顾奇奇"], "ans": 0, "ex": "Chồng đi làm, Kỳ Kỳ đi xe buýt một mình → không có chuyện chồng đi cùng."}, {"n": 90, "stem": "本文的最佳标题应该是：", "o": ["幸福的奇奇", "怀孕的奇奇", "神奇的小纸片", "孕妇坐公共汽车"], "ans": 0, "ex": "Cả bài thể hiện Kỳ Kỳ được chồng và mọi người yêu thương → hạnh phúc."}]}], "3": [{"part": 1, "range": "46-48", "passage": ["有两个人在同一条街上走，其中一个捡到了一把斧子，于是叫了起来：“瞧！我发现了一样东西！”“不要 另外", "此外"], "ans": 0, "ex": "否则 = \"nếu không thì\" (không bỏ thuyền xuống thì nó thành gánh nặng)."}, {"n": 56, "stem": "", "o": ["再次回到了船上", "不过现在他轻松多了", "但是没听见大师的喊声", "再次感到十分无奈"], "ans": 1, "ex": "Bỏ gánh nặng xuống → \"nhẹ nhõm hơn nhiều\"."}]}, {"part": 1, "range": "57-60", "passage": ["19世纪末的英国伦敦，一天有两个网球迷在一家饭店吃饭。饭后两人[57]无聊，其中一个随手拣起一个酒瓶塞子，用桌上的雪茄烟盒当球拍，模仿打网球的样子打起来。[58]，也拿起雪茄烟盒加入，两人就在桌子上对打起来。他们玩儿得挺高兴，都感到这比打网球方便得多，就热心地把它介绍给别人。很快，英国[59]起这种“桌子上的网球”。那时候，人们用动物皮蒙在缩小了的网球拍子上当球拍，原始的乒乓球的打法[60]就和网球差不多。"], "qs": [{"n": 57, "stem": "", "o": ["发现", "知道", "明白", "觉得"], "ans": 3, "ex": "觉得无聊 = \"cảm thấy buồn chán\" (cảm giác chủ quan)."}, {"n": 58, "stem": "", "o": ["他们都认为很好玩儿", "双方打得很激烈", "另一人觉得挺有趣", "旁边的人发现这样打不对"], "ans": 2, "ex": "Sau đó \"也拿起…加入\" → chủ ngữ là người còn lại thấy thú vị."}, {"n": 59, "stem": "", "o": ["流传", "流行", "流动", "流利"], "ans": 1, "ex": "流行起 + O = \"bắt đầu thịnh hành\"; 流传 thường đi với truyền thuyết, câu chuyện."}, {"n": 60, "stem": "", "o": ["功能", "积极", "简直", "分别"], "ans": 2, "ex": "简直 (phó từ) = \"quả thực, gần như\": cách chơi gần như giống quần vợt."}]}, {"part": 2, "range": "61", "passage": ["今天，台下坐的是1451名高一新同学，你们带着对新生活的渴望、带着对理想和知识的渴求、带着父母亲人的厚望，来到蓬勃发展的华侨中学。高一的105位老师今天也来参加了开学典礼，让我们对他们表示由衷的敬意！"], "qs": [{"n": 61, "stem": "", "o": ["一共有1451个人参加了开学典礼", "开学典礼上有老师、同学和父母", "这是给高一新生开的毕业典礼", "发言者最有可能是学校领导"], "ans": 3, "ex": "Người phát biểu chào HS mới và mời mọi người tôn vinh thầy cô → khả năng là lãnh đạo nhà trường. A sai (còn 105 giáo viên)."}]}, {"part": 2, "range": "62", "passage": ["水是世界上最丰富、分布最广、使用最多的物质。水对于人类及其他生物是繁衍生存的基本条件，是人们生活不可替代的重要资源，没有水，就没有生命。水是生态环境中最活跃、影响最广泛的因素，具有许多其他资源所没有的、独特的性能和多重的使用功能，是工农业生产的重要资源。"], "qs": [{"n": 62, "stem": "", "o": ["水资源对我们无关紧要", "水不是世界上使用最多的资源", "水对人类及动物具有重要意义", "现在已经找到水资源的代替品"], "ans": 2, "ex": "\"水对于人类及其他生物是繁衍生存的基本条件\". D sai (不可替代)."}]}, {"part": 2, "range": "63", "passage": ["喝牛奶前后1小时左右，不宜吃橘子。牛奶中所含的蛋白质与橘子中的果酸相遇后，会产生化学反应，发生凝固，影响人体对牛奶的消化与吸收。同样，在服用牛奶前后1小时的这个时间段里也不适合食用其他酸性水果。"], "qs": [{"n": 63, "stem": "", "o": ["橘子是酸性水果", "牛奶中含有果酸", "柠檬宜和牛奶一起吃", "蛋白质与果酸相遇后没有变化"], "ans": 0, "ex": "\"也不适合食用其他酸性水果\" → quýt cũng là trái cây có tính axit."}]}, {"part": 2, "range": "64", "passage": ["树懒生活在南美热带雨林里。它长年生活在树上，靠吃树叶为生。树懒平时不下地，只是一周下地排泄一次。雌性树懒在分娩时也要下地，它离开长年生活的那棵树，再爬到另一棵树上生宝宝。"], "qs": [{"n": 64, "stem": "", "o": ["雄树懒分娩时下地", "树懒生活在北美洲", "树懒在地上生宝宝", "树懒七天排泄一次"], "ans": 3, "ex": "\"一周下地排泄一次\" – một tuần = 7 ngày."}]}, {"part": 2, "range": "65", "passage": ["一名美国男子用350多万根牙签搭建成了世界上最大的牙签城——“牙签城2号——庙宇和高楼大厦”。此城“复制”了40多座世界著名宗教建筑和高楼大厦，包括世界最高楼哈利法塔和上海东方明珠等。"], "qs": [{"n": 65, "stem": "", "o": ["牙签是一种传统建筑材料", "哈利法塔是著名宗教建筑", "牙签城包括40多座建筑物", "这座牙签城比东方明珠大"], "ans": 2, "ex": "\"复制了40多座…建筑和高楼大厦\". B sai: Burj Khalifa là tòa nhà cao nhất."}]}, {"part": 2, "range": "66", "passage": ["皮影戏，是一种用灯光照射兽皮或纸板做成的人物剪影以表演故事的中国民间戏剧。表演时，艺人们在白色幕布后面，一边操纵戏曲人物，一边用当地流行的曲调唱述故事，同时配以打击乐器和弦乐，有浓厚的乡土气息。"], "qs": [{"n": 66, "stem": "", "o": ["皮影戏有浓厚的民间韵味", "皮影戏属于中国官方戏剧", "中国艺人都会表演皮影戏", "表演皮影戏时不能有灯光"], "ans": 0, "ex": "\"中国民间戏剧\"\"浓厚的乡土气息\"."}]}, {"part": 2, "range": "67", "passage": ["今年，中国广东省青少年手机拥有率达83%，手机主要用于打电话、发短信、听音乐和上网，有41%的青少年使用手机上网，27%的青少年使用手机玩儿游戏。手机在青少年中的拥有率越来越高。"], "qs": [{"n": 67, "stem": "", "o": ["用手机玩儿游戏不好", "越来越多的青少年拥有手机", "中国83%的青少年拥有手机", "大部分青少年都用手机上网"], "ans": 1, "ex": "\"拥有率越来越高\". C sai (chỉ tỉnh Quảng Đông), D sai (41% không phải đa số)."}]}, {"part": 2, "range": "68", "passage": ["在中国北方，冬季常刮西北风。所以冬季常在外活动的人都知道，在肚子里没有食物的时候，往往一张嘴就灌进一肚皮的冷风，人也跟着浑身一颤。这种又冷又饿的滋味十分不好受。后来逐渐用“喝西北风”来形容生活困难，又冷又饿。"], "qs": [{"n": 68, "stem": "", "o": ["西北风的味道不好", "在外活动的人会喝西北风", "人们只会在冬天喝西北风", "“喝西北风”这个词源于中国北方"], "ans": 3, "ex": "Thành ngữ hình thành từ trải nghiệm mùa đông ở miền Bắc Trung Quốc."}]}, {"part": 2, "range": "69", "passage": ["刚出生的儿子对婴儿用品过敏，因此，每次洗完澡后，我都给他抹橄榄油。有一天，4岁的女儿看着我为他抹橄榄油，显得很不安，她不放心地问道：“妈妈，你想把他煎着吃吗？”我哭笑不得。"], "qs": [{"n": 69, "stem": "", "o": ["我要把儿子煎着吃", "橄榄油是婴儿用品", "女儿比儿子大3岁", "抹橄榄油能保护皮肤"], "ans": 3, "ex": "Con dị ứng đồ dùng trẻ em nên mẹ thoa dầu ô liu thay → dầu ô liu bảo vệ da."}]}, {"part": 2, "range": "70", "passage": ["淡水鸟类中，在水下游得最好的当属潜水鸟。小鸟的脚的位置非常靠后，从水里出来后，在地上几乎无法行走。但是到了水里，它们便非常灵活。小鱼遇见它们，很少有能逃脱的。小鸟的父母有分工，一个把它们驮在背上，一个给它们觅食。它们还会非常耐心地一点点喂小鸟吃鱼。"], "qs": [{"n": 70, "stem": "", "o": ["潜水鸟无法在陆地行走", "雄潜水鸟从不喂养孩子", "潜水鸟主要靠吃鱼生活", "潜水鸟是在淡水中生活"], "ans": 3, "ex": "\"淡水鸟类中…当属潜水鸟\" → sống ở nước ngọt. A sai vì \"几乎\" (gần như)."}]}, {"part": 3, "range": "71-74", "passage": ["陶行知先生担任育才学校的校长的时候，一天，他看到一名男生在打一名同学，就将他制止，并命令他到校长室等候。", "陶先生回到办公室，见男生已在等候。陶先生掏出一块糖递给他：“这是奖励你的，因为你按时到了。”接着又掏出一块糖给他：“这也是奖励给你的，我不让你打同学，你立即住手了，说明你很尊重我。”男生疑惑地接过糖果。陶先生又说：“据了解，你打同学是因为他欺负女生，说明你有正义感。”陶先生又掏出第三块糖给他。这时男生哭了：“校长，我错了，同学再不对，我也不能采取这种方式。”陶先生又拿出第四块糖说：“你已经认错，再奖你一块，我们的谈话也该结束了。”"], "qs": [{"n": 71, "stem": "陶先生为什么让那名男生去校长室？", "o": ["他被同学打了", "他在打一名同学", "他和同学吵架", "他不听老师的话"], "ans": 1, "ex": "\"他看到一名男生在打一名同学\"."}, {"n": 72, "stem": "关于这名男生，下列说法正确的是：", "o": ["他常欺负女生", "他比校长晚到", "他很尊敬校长", "他是个爱哭的人"], "ans": 2, "ex": "Được bảo dừng tay là dừng ngay → \"说明你很尊重我\"."}, {"n": 73, "stem": "最后男生为什么哭了？", "o": ["被校长批评了", "校长对他很凶", "只拿到四块糖", "知道自己错了"], "ans": 3, "ex": "\"校长，我错了…\"."}, {"n": 74, "stem": "最适合本文的题目是：", "o": ["校长的批评", "奖励四块糖", "巧妙的教育", "男生的认错"], "ans": 2, "ex": "Hiệu trưởng không phê bình mà dùng kẹo để học sinh tự nhận lỗi → cách giáo dục khéo léo."}]}, {"part": 3, "range": "75-78", "passage": ["养花人在花园里种了几百棵月季花，他认为只有这样才能每个月都看见花。开花的时候，那些同一形状的不同颜色的花，使他的院子呈现出一种单调的热闹。一天晚上，他忽然做了一个梦：许多花走进了院子，它们都愁眉不展地看着他。", "牡丹花抬着高傲的头说：“难道我们长得不美吗？”", "仙人掌说：“我们具有最坚强的灵魂。”", "桃花说：“我和春天一起到来。”", "这时候，月季也说话了：“我们也很寂寞，要是能和姐妹们在一起，我们会更快乐。”", "他醒来的时候，心里很闷，他想：“花都应该有展示自己美丽的机会。而我的偏爱是不对的。从今天起，就让我的花园变得更加丰富多彩吧！”"], "qs": [{"n": 75, "stem": "根据本文，养花人最喜欢什么花？", "o": ["桃花", "月季", "仙人掌", "牡丹"], "ans": 1, "ex": "Ông trồng mấy trăm cây nguyệt quý, tự nhận \"我的偏爱\"."}, {"n": 76, "stem": "关于桃花，以下说法正确的是：", "o": ["春天开花", "每月开花", "十分高傲", "十分坚强"], "ans": 0, "ex": "\"我和春天一起到来\"."}, {"n": 77, "stem": "文中月季所说的“姐妹们”是指：", "o": ["养花人", "其他花", "月季", "花园"], "ans": 1, "ex": "Nguyệt quý muốn ở cùng \"chị em\" = các loài hoa khác."}, {"n": 78, "stem": "养花人梦醒后最有可能做什么？", "o": ["只种牡丹花", "再也不种花", "种更多的月季", "养各种各样的花"], "ans": 3, "ex": "\"让我的花园变得更加丰富多彩\"."}]}, {"part": 3, "range": "79-82", "passage": ["一个小伙子到北京打工，凭着一身力气，当上了一名送奶工。很快，他靠自己的努力，成立了送奶公司。由于他诚实守信，服务优质，经过几年的打拼，他的公司发展到有20万个家庭订户的规模。", "他与一位做广告的朋友谈话时突然想到，公司现有20万个家庭订户，这不就是一个庞大的网络吗？这张网只用于送奶实在是太浪费，为什么不以此为载体，在送奶的同时兼做广告投递呢？于是，他又成立广告传播公司。公司广告传播人员由送奶工兼任。", "初战告捷后，他决定以送奶网络为载体，兼营更多的业务。随后，他与一些商场合作，进行电子商务配送，还创办广告杂志，新业务都依托于公司这张网铺开，其利润远远高于送奶的利润。", "订奶客户很快发展到30万户，员工从最初的3个人，发展到目前的2800人，资产由最初的2000元猛增到现在的1.5亿元。这位已成为亿万富翁的年轻人叫吴作仁，他的公司获得“第三届全国文明社区贡献”大奖，他本人也获得“北京市十佳外来青年”称号。", "机会对于任何人都是公平的，它在我们身边的时候，不是打扮得花枝招展，而是普普通通的，根本就不起眼。看起来耀眼的机会不是机会，是陷阱；真正的机会最初都是朴素的，只有经过主动与勤奋，它才变得格外绚烂。"], "qs": [{"n": 79, "stem": "小伙子的广告传播公司主要是利用了：", "o": ["朋友的帮助", "朋友的资金", "送奶工的关系", "庞大的送奶网"], "ans": 3, "ex": "\"以此（20万订户的网络）为载体…兼做广告投递\"."}, {"n": 80, "stem": "小伙子现在的公司：", "o": ["有3个员工", "有3个分公司", "有2000元资产", "有30万订奶客户"], "ans": 3, "ex": "\"订奶客户很快发展到30万户\"; 3 người và 2000 tệ là lúc ban đầu."}, {"n": 81, "stem": "下列哪项不是小伙子成功的原因？", "o": ["主动进取", "勤奋努力", "懂得抓住机会", "机会比别人多"], "ans": 3, "ex": "\"机会对于任何人都是公平的\" → không phải vì có nhiều cơ hội hơn."}, {"n": 82, "stem": "本文作者主要想告诉我们什么？", "o": ["要抓住机遇", "要去北京打工", "送奶很赚钱", "广告利润很高"], "ans": 0, "ex": "Đoạn cuối bàn về cơ hội: cơ hội bình thường, phải chủ động nắm bắt."}]}, {"part": 3, "range": "83-86", "passage": ["我的一个熟人，一年前结了婚。结婚后的四五个月里，他和妻子片刻不离。但结婚的甜蜜期一过，他就觉得婚姻让他失去了自由，放松娱乐的时间少了，于是他决定恢复婚前的生活状态。某一天，跟往常一样，六点钟就下班了。但他不急着赶回家，而是和同事们去吃饭和唱歌。十点左右回到家时，他的妻子正坐在沙发上等他。她没有盘问或责备他，而是爽快地问他要不要洗澡。虽然觉得妻子很奇怪，但由于很累，他就洗了澡上床睡觉去了。", "第二天凌晨三点半，闹钟响了起来。他匆匆起床，打开电灯。看过钟点后，他对妻子大叫起来，要她作出解释。", "“嗯，”她心平气和地回答，“要是你下班后要花四个小时返回家中，我想你上班也需要同样的时间。我不希望你迟到！”"], "qs": [{"n": 83, "stem": "结婚的甜蜜期是指：", "o": ["结婚当天", "结婚的那个月", "婚后的半年", "婚后的一年"], "ans": 2, "ex": "\"结婚后的四五个月里…片刻不离\" → khoảng nửa năm đầu."}, {"n": 84, "stem": "丈夫婚前的生活状态是：", "o": ["经常加班", "经常约会", "爱睡懒觉", "爱好玩乐"], "ans": 3, "ex": "Muốn \"恢复婚前的生活状态\" → đi ăn, hát với đồng nghiệp → thích vui chơi."}, {"n": 85, "stem": "丈夫大概几点钟上班？", "o": ["凌晨三点半", "早上七点半", "下午六点", "晚上十点"], "ans": 1, "ex": "Vợ đặt chuông 3:30, tính mất 4 tiếng đi làm → giờ vào làm khoảng 7:30."}, {"n": 86, "stem": "妻子为什么要在凌晨三点半叫醒丈夫？", "o": ["她怕丈夫迟到", "她调错了闹钟", "她想盘问丈夫", "她故意惩罚丈夫"], "ans": 3, "ex": "Lời \"怕你迟到\" chỉ là cái cớ; thực chất vợ cố ý \"trừng phạt\" việc chồng về muộn 4 tiếng."}]}, {"part": 3, "range": "87-90", "passage": ["劳丽每天要花费四个小时与狼玩耍。", "晚上，劳丽去寻找公路上被车轧死的野生动物，喂她的朋友。", "现在只有劳丽和这群狼共同生活。“细心观察，你会发现狼有许多地方就像你和我。”劳丽说，“它们绝对不是非常凶残地在树林里乱窜。它们的生活很有规律，照顾狼崽，分享食物。很久以前，人类就是过着这样的生活，像狼一样相互协作。”", "人狼同居，这是国际豺狼中心实施的实验项目之一，目的是：使狼变得像人类一样友善。“狼始终对我有一种吸引力。我欣赏它们有组织的行动方式。”她说，“起初我有些害怕，但现在我非常敬重它们。”", "一天，劳丽走得离它们埋食物的地点太近，狼惩罚了劳丽，咬伤了她的腿。“是我破坏了它们的规矩。”", "杰克和巴扎都是一百磅重的公狼，巴莎是只七十五磅重的母狼，它们既可能凶暴残忍，也可能调皮玩耍。和劳丽在一起，它们的行为像人类最好的朋友——狗。", "然而，劳丽不得不与寄生虫以及野兽的气味打交道。尽管它们有很多缺陷，但当实验结束后，劳丽会恋恋不舍的。"], "qs": [{"n": 87, "stem": "根据劳丽的话，下面哪一项不是狼的特点？", "o": ["凶残地乱跑", "生活有规律", "懂得分享", "相互协作"], "ans": 0, "ex": "\"它们绝对不是非常凶残地在树林里乱窜\"."}, {"n": 88, "stem": "狼为什么咬伤劳丽？", "o": ["狼是凶残的动物", "狼很久没吃东西了", "她拿走了狼的食物", "她破坏了狼的规矩"], "ans": 3, "ex": "\"是我破坏了它们的规矩\"."}, {"n": 89, "stem": "下面关于狼的说法哪一个是正确的？", "o": ["狼是人最好的朋友", "狼非常具有组织性", "狼的缺点比优点多", "狼身上的味道很臭"], "ans": 1, "ex": "\"我欣赏它们有组织的行动方式\". A sai: bạn tốt nhất của người là chó."}, {"n": 90, "stem": "劳丽对狼是什么态度？", "o": ["讨厌", "害怕", "尊敬", "崇拜"], "ans": 2, "ex": "\"起初我有些害怕，但现在我非常敬重它们\"."}]}], "4": [{"part": 1, "range": "46-48", "passage": ["射击队的教练在街墙上[46]了一排气枪弹洞，个个都命中一个很小的粉笔圈。他心想这准是个神枪手，[47]怎么样也应该把他找到。经过查访，他发现射手竟是个七岁的孩童。“小朋友，”教练十分敬佩地问，“你的射击术是从哪儿学来的呀？”“没什么，”小孩子笑着回答说，“很[48]的，我先对着墙开枪，然后在弹洞周围用粉笔画个圆圈。”"], "qs": [{"n": 46, "stem": "", "o": ["发生", "发现", "发挥", "发明"], "ans": 1, "ex": "发现了一排弹洞 = \"phát hiện một hàng lỗ đạn\"."}, {"n": 47, "stem": "", "o": ["不管", "不免", "不如", "不然"], "ans": 0, "ex": "不管怎么样也… = \"dù thế nào cũng (phải tìm ra)\"."}, {"n": 48, "stem": "", "o": ["秘密", "讨厌", "简单", "复杂"], "ans": 2, "ex": "Cách làm của cậu bé rất \"đơn giản\": bắn trước, vẽ vòng sau."}]}, {"part": 1, "range": "49-52", "passage": ["庄子和著名的哲学家惠施一起散步来到一座桥上。他看见鱼儿在水中悠然自得地游戏，便对身边的惠施说：“这是鱼儿的乐趣啊！”", "惠施不以为然地[49]庄子：“你不是鱼，怎么知道鱼儿是快乐的呢？”   modal(`<div class="namelogo"><img src="${LOGO}" alt=""><div><b class="zh" style="font-size:26px">核心</b><div style="font-weight:800;letter-spacing:.08em;color:var(--accent-d)">TIẾNG TRUNG KH</div><div style="font-size:13px;color:var(--muted)">Luyện thi HSK5 · Đọc &amp; Viết</div></div></div>
  <h3>Nhập họ tên của bạn</h3><div style="font-size:14px;color:var(--muted)">Bạn cần điền tên trước khi làm bài. Tên sẽ được lưu cùng kết quả.</div>
  <input id="nmIn" maxlength="40" placeholder="Ví dụ: Nguyễn Văn An" value="${esc(getName())}" autocomplete="name">
  <div class="err" id="nmErr"></div>
  <div class="acts">${closable?'<button class="btn" id="nmCancel">Hủy</button>':''}<button class="btn primary" id="nmOk">Bắt đầu</button></div>`,
  m=>{const i=m.querySelector("#nmIn");setTimeout(()=>i.focus(),50);
    const ok=()=>{const v=i.value.trim().replace(/\s+/g," ");if(v.length<2){m.querySelector("#nmErr").textContent="Vui lòng nhập họ tên (ít nhất 2 ký tự).";i.focus();return}
      LS.set(K.name,v);showWho();closeModal();then&&then()};
    m.querySelector("#nmOk").onclick=ok;i.onkeydown=e=>{if(e.key==="Enter")ok()};
    const c=m.querySelector("#nmCancel");if(c)c.onclick=closeModal;},closable);
}
function showWho(){$("#who").textContent=getName()?"👋 "+getName():""}
$("#btnName").onclick=()=>askName(()=>{if(S.view==="test"&&S.test)renderMain()},!!getName());

/* ---------- history ---------- */
const hist=()=>LS.get(K.hist,[]);
function bestOf(id){const h=hist().filter(r=>r.testId===id);return h.length?Math.max(...h.map(r=>r.score)):null}

/* ---------- left list ---------- */
function renderList(){
  const groups=[...new Set(TESTS.map(t=>t.group))];
  $("#tlist").innerHTML=groups.map(g=>`<div class="grp">${esc(g)}</div><div class="tlist">${TESTS.filter(t=>t.group===g).map(t=>{
    const b=bestOf(t.id);return `<button class="titem ${S.view==="test"&&S.test&&S.test.id===t.id?"on":""}" data-id="${t.id}"><span class="kind ${t.kind}">${t.kind==="read"?"Đọc":"Viết"}</span><span class="nm">${esc(t.short)}</span>${b!==null?`<span class="best" title="Điểm cao nhất">${b}đ</span>`:""}</button>`}).join("")}</div>`).join("");
  $("#tlist").querySelectorAll(".titem").forEach(b=>b.onclick=()=>tryOpen(b.dataset.id));
  const on=$("#tlist .titem.on");if(on&&window.innerWidth<=860)on.scrollIntoView({block:"nearest",inline:"center"});
}
function dirty(){return S.view==="test"&&S.test&&!S.submitted&&S.ans.some(a=>Array.isArray(a)?a.length:a!==null)}
function guard(go){
  if(!dirty()){go();return}
  modal(`<h3>Rời bài đang làm?</h3><p>Bài làm hiện tại chưa nộp sẽ bị hủy.</p><div class="acts"><button class="btn" id="mBack">Ở lại</button><button class="btn primary" id="mGo">Rời bài</button></div>`,
    m=>{m.querySelector("#mBack").onclick=closeModal;m.querySelector("#mGo").onclick=()=>{closeModal();S.submitted=true;go()}});
}
function tryOpen(id){if(S.test&&S.test.id===id&&S.view==="test"&&!S.submitted)return;guard(()=>openTest(id))}

/* ---------- timer ---------- */
function renderTimeOpts(){
  $("#topts").innerHTML=[40,45,50].map(m=>`<button class="topt ${S.dur===m?"on":""}" data-m="${m}">${m} phút</button>`).join("");
  $("#topts").querySelectorAll(".topt").forEach(b=>b.onclick=()=>{
    if(S.submitted||S.view!=="test"||!S.test)return;const m=+b.dataset.m;S.dur=m;LS.set(K.dur+S.test.kind,m);renderTimeOpts();updateTimer();});
}
const elapsed=()=>(Date.now()-S.start)/1000;
function updateTimer(){
  const el=$("#timer");
  if(S.view!=="test"||!S.test){el.textContent="--:--";el.classList.remove("red");return}
  if(S.submitted){el.textContent=fmtMS(S.result?S.result.limit*60-S.result.time:S.dur*60);el.classList.remove("red");return}
  const left=S.dur*60-elapsed();el.textContent=fmtMS(left);el.classList.toggle("red",left<60);
  if(left<=0)submit(true);
}
function startTimer(){clearInterval(S.tick);S.start=Date.now();S.tick=setInterval(updateTimer,250);updateTimer()}

/* ---------- open test ---------- */
function openTest(id,fromHist){
  if(!getName()){askName(()=>openTest(id,fromHist),false);return}
  const t=testById(id);if(!t)return;
  clearInterval(S.tick);
  S.view="test";S.test=t;S.ans=emptyAns(t);S.submitted=false;S.result=null;LS.set(K.last,id);
  S.dur=LS.get(K.dur+t.kind,DEF_DUR[t.kind]);
  $("#side").style.display="";
  if(fromHist){S.ans=JSON.parse(JSON.stringify(fromHist.answers));S.submitted=true;S.result=fromHist;S.dur=fromHist.limit}
  renderList();renderTimeOpts();renderMain();
  if(!fromHist)startTimer();else updateTimer();
  window.scrollTo({top:0,behavior:"smooth"});
}

function histTable(id){
  const h=hist().filter(r=>r.testId===id).sort((a,b)=>b.date-a.date);
  if(!h.length)return "";
  return `<div class="card hist"><h3>Kết quả làm bài của bạn · đã làm ${h.length} lần</h3><div class="tbl-wrap"><table>
  <tr><th>Ngày làm</th><th>Kết quả</th><th>Thời gian làm bài</th><th>Xem chi tiết</th></tr>
  ${h.map(r=>`<tr${S.result&&S.result.rid===r.rid?' style="background:var(--accent-soft)"':''}><td>${fmtDate(r.date)}</td><td><b>${r.correct}/${r.total}</b> câu · ${r.score} điểm</td><td>${fmtHMS(r.time)}</td><td><button class="link" data-rid="${r.rid}">Xem</button></td></tr>`).join("")}
  </table></div></div>`;
}
function bindHistLinks(root){root.querySelectorAll("[data-rid]").forEach(b=>b.onclick=()=>{const r=hist().find(x=>x.rid===b.dataset.rid);if(r)guard(()=>openTest(r.testId,r))})}

/* ---------- main render ---------- */
function renderMain(){
  const t=S.test,m=$("#main");
  const instr=t.kind==="read"
    ?`第46–90题：请选出正确答案。<br>Đọc đoạn văn và <b>chạm vào phương án A/B/C/D</b> để chọn; chạm lại để bỏ chọn. Phần 1: chọn từ/câu điền vào chỗ trống (chạm vào ô trống để tới câu hỏi). Phần 2: chọn câu đúng với nội dung. Phần 3: trả lời câu hỏi theo đoạn văn.`
    :`第91–98题：完成句子。<br>Sắp xếp các từ cho sẵn thành câu hoàn chỉnh. <b>Kéo thả</b> hoặc <b>chạm</b> vào từ để đưa vào khung trả lời; kéo trong khung để đổi thứ tự; kéo ra ngoài hoặc chạm lại để bỏ. Không cần thêm dấu câu.`;
  let html=`<div class="card thead"><h1>${esc(t.title)}</h1><div class="src">📖 ${esc(t.source)} · Học sinh: <b>${esc(getName())}</b></div>
    ${S.submitted?"":`<div class="instr">${instr}</div>`}</div>`;
  if(S.submitted)html+=summaryHTML();
  html+=histTable(t.id);
  if(t.kind==="read")html+=readHTML(t);
  else t.q.forEach((q,i)=>{html+=S.submitted?reviewW(q,i):qHTML(q,i)});
  if(S.submitted)html+=`<div class="actions" style="margin-bottom:20px">${actBtns()}</div>`;
  m.innerHTML=html;bindHistLinks(m);
  if(S.submitted)bindActs(m);
  if(t.kind==="write"){if(!S.submitted)t.q.forEach((q,i)=>renderQ(i))}
  else bindRead(m);
  renderSide();
}

/* ---------- reading ---------- */
function passageHTML(t,gi){
  const grp=t.groups[gi];
  return grp.passage.map(p=>`<p>${esc(p).replace(/&lt;u&gt;(.*?)&lt;\/u&gt;/g,"<u>$1</u>").replace(/\[(\d+)\]/g,(m0,n)=>{
    const i=t.q.findIndex(q=>q.n===+n),a=S.ans[i],q=t.q[i];
    let cls="blank",txt=n;
    if(a!==null&&q.o[a].length<=4){cls+=" filled";txt=n+" "+esc(q.o[a])}else if(a!==null){cls+=" filled";txt=n+" "+"ABCD"[a]}
    if(S.submitted)cls+=a===q.ans?" okb":" badb";
    return `<span class="${cls}" data-go="${i}">${txt}</span>`})}</p>`).join("");
}
function readHTML(t){
  let html="",lastPart=0;
  t.groups.forEach((grp,gi)=>{
    const idx=t.q.map((q,i)=>i).filter(i=>t.q[i].g===gi);
    html+=`<div class="card pg" id="g${gi}">`;
    html+=`<div class="pg-h"><span class="rg">${grp.part===2?grp.range:grp.range.replace("-","–")}.</span><span class="pl">${PARTS[grp.part]}</span></div>`;
    html+=`<div class="passage" id="ps${gi}">${passageHTML(t,gi)}</div>`;
    idx.forEach(i=>{html+=rq(t,i)});
    html+=`</div>`;
  });
  return html;
}
function rq(t,i){
  const q=t.q[i],a=S.ans[i],long=q.o.some(o=>o.length>9);
  const sub=S.submitted,ok=a===q.ans;
  let h=`<div class="rq" id="q${i}"><div class="rq-h"><span class="qno">${q.n}</span>${q.stem?`<span class="stem">${esc(q.stem)}</span>`:`<span class="stem"></span>`}`;
  h+=sub?`<span class="tag ${ok?"ok":"bad"}">${ok?"✓ Đúng":a===null?"✗ Chưa làm":"✗ Sai"}</span>`:`<span class="st ${a===null?"":"done"}" id="st${i}">${a===null?"Chưa làm":"Đã làm"}</span>`;
  h+=`</div><div class="opts ${long?"long":""}">`;
  q.o.forEach((o,k)=>{let c="opt";
    if(sub){if(k===q.ans)c+=" okc";else if(k===a)c+=" badc"}else if(k===a)c+=" sel";
    h+=`<button class="${c}" data-q="${i}" data-k="${k}" ${sub?"disabled":""}><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`});
  h+=`</div>`;
  if(sub)h+=`<div class="ex">💡 <b>Đáp án ${"ABCD"[q.ans]}.</b> ${esc(q.ex)}</div>`;
  return h+`</div>`;
}
function bindRead(m){
  m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(S.submitted)return;const i=+b.dataset.q,k=+b.dataset.k;
    S.ans[i]=S.ans[i]===k?null:k;refreshRQ(i);renderSide()});
  m.querySelectorAll("[data-go]").forEach(s=>s.onclick=()=>{const el=$("#q"+s.dataset.go);if(el)el.scrollIntoView({behavior:"smooth",block:"center"})});
}
function refreshRQ(i){
  const t=S.test,el=$("#q"+i);el.outerHTML=rq(t,i);
  const gi=t.q[i].g;if(t.groups[gi].part===1){$("#ps"+gi).innerHTML=passageHTML(t,gi)}
  bindRead($("#g"+gi));
}

/* ---------- writing ---------- */
function qHTML(q,i){
  return `<div class="card q" id="q${i}"><div class="qtop"><span class="qno">${91+i}</span><span class="st" id="st${i}">Chưa làm</span><span class="sp"></span><button class="btn small" data-clear="${i}">Xóa câu này</button></div>
  <div class="lbl">Từ cho sẵn</div><div class="zone bank" id="bank${i}" data-q="${i}" data-z="bank"></div>
  <div class="lbl" style="margin-top:8px">Câu trả lời của bạn</div><div class="zone ans" id="ans${i}" data-q="${i}" data-z="ans"></div></div>`;
}
function renderQ(i){
  const q=S.test.q[i],a=S.ans[i],bank=$("#bank"+i),ans=$("#ans"+i);
  bank.innerHTML="";ans.innerHTML="";
  q.w.forEach((w,k)=>{if(!a.includes(k))bank.appendChild(chip(i,k))});
  a.forEach(k=>ans.appendChild(chip(i,k)));
  const st=$("#st"+i),s=status(i);st.className="st "+s;st.textContent={todo:"Chưa làm",doing:"Đang làm",done:"Đã làm"}[s];
  const cb=document.querySelector(`[data-clear="${i}"]`);if(cb)cb.onclick=()=>{S.ans[i]=[];renderQ(i);renderSide()};
}
function chip(qi,k){const c=document.createElement("span");c.className="chip";c.textContent=S.test.q[qi].w[k];c.dataset.q=qi;c.dataset.k=k;c.addEventListener("pointerdown",onDown);return c}

let D=null;
function onDown(e){
  if(S.submitted||e.button>0)return;
  const c=e.currentTarget;e.preventDefault();
  D={c,qi:+c.dataset.q,k:+c.dataset.k,x:e.clientX,y:e.clientY,drag:false,ghost:null,ph:null,id:e.pointerId};
  try{c.setPointerCapture(e.pointerId)}catch(_){}
  c.addEventListener("pointermove",onMove);c.addEventListener("pointerup",onUp);c.addEventListener("pointercancel",onCancel);
}
function onMove(e){
  if(!D||e.pointerId!==D.id)return;
  if(!D.drag){if(Math.hypot(e.clientX-D.x,e.clientY-D.y)<6)return;
    D.drag=true;D.ghost=D.c.cloneNode(true);D.ghost.classList.add("ghost");document.body.appendChild(D.ghost);D.c.classList.add("lift");
    D.ph=document.createElement("span");D.ph.className="ph";}
  D.ghost.style.left=e.clientX+"px";D.ghost.style.top=e.clientY+"px";
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const zone=el&&el.closest(".zone");
  document.querySelectorAll(".zone.hot").forEach(z=>z.classList.remove("hot"));
  if(zone&&+zone.dataset.q===D.qi){zone.classList.add("hot");
    if(zone.dataset.z==="ans"){const before=insertBefore(zone,e.clientX,e.clientY);if(before)zone.insertBefore(D.ph,before);else zone.appendChild(D.ph)}
    else D.ph.remove();
  }else D.ph.remove();
  const mg=60;if(e.clientY<mg)window.scrollBy(0,-12);else if(e.clientY>innerHeight-mg)window.scrollBy(0,12);
}
function insertBefore(zone,x,y){
  const kids=[...zone.querySelectorAll(".chip")].filter(c=>c!==D.c);
  for(const c of kids){const r=c.getBoundingClientRect();if(y<r.top)return c;if(y<=r.bottom&&x<r.left+r.width/2)return c}
  return null;
}
function endDrag(){if(!D)return;const c=D.c;c.removeEventListener("pointermove",onMove);c.removeEventListener("pointerup",onUp);c.removeEventListener("pointercancel",onCancel);
  if(D.ghost)D.ghost.remove();c.classList.remove("lift");document.querySelectorAll(".zone.hot").forEach(z=>z.classList.remove("hot"))}
function onCancel(){if(D&&D.ph)D.ph.remove();const qi=D?D.qi:null;endDrag();D=null;if(qi!==null)renderQ(qi)}
function onUp(){
  if(!D)return;const {qi,k}=D;const a=S.ans[qi];
  if(!D.drag){const p=a.indexOf(k);if(p>=0)a.splice(p,1);else a.push(k)}
  else{
    if(D.ph&&D.ph.parentNode){
      const seq=[...D.ph.parentNode.children].filter(n=>n===D.ph||(n.classList.contains("chip")&&n!==D.c));
      const idx=seq.indexOf(D.ph);const rest=a.filter(x=>x!==k);rest.splice(idx,0,k);S.ans[qi]=rest;
    }else{const p=a.indexOf(k);if(p>=0)a.splice(p,1)}
    if(D.ph)D.ph.remove();
  }
  endDrag();D=null;renderQ(qi);renderSide();
}

/* ---------- side panel ---------- */
function renderSide(){
  if(!S.test)return;const t=S.test,n=t.q.length;
  const done=t.q.filter((_,i)=>status(i)==="done").length;
  $("#nDone").textContent=done;$("#nTodo").textContent=n-done;
  const g=$("#grid");g.className="grid"+(t.kind==="read"?" g45":"");
  let html="",lp=0;
  t.q.forEach((q,i)=>{
    if(t.kind==="read"&&q.part!==lp&&window.innerWidth>860){lp=q.part;html+=`<div class="gsec">Phần ${lp}</div>`}
    let c="";if(S.submitted)c=isOk(t,i,S.ans[i])?"ok":"bad";else{const s=status(i);c=s==="done"?"d":s==="doing"?"p":""}
    html+=`<button class="gn ${c}" data-i="${i}">${qNo(t,i)}</button>`});
  g.innerHTML=html;
  g.querySelectorAll(".gn").forEach(b=>b.onclick=()=>{const el=$("#q"+b.dataset.i);if(el)el.scrollIntoView({behavior:"smooth",block:t.kind==="read"?"center":"start"})});
  const sb=$("#btnSubmit");sb.disabled=S.submitted;sb.textContent=S.submitted?"Đã nộp bài":"Nộp bài";sb.style.opacity=S.submitted?.6:1;
  $("#sideNote").textContent=t.kind==="read"?"Phần Đọc · 阅读（第46–90题）":"Phần Viết · 书写 第一部分（第91–98题）";
}
$("#btnSubmit").onclick=()=>{
  if(S.submitted||!S.test)return;const t=S.test;
  const all=t.q.map((_,i)=>i);
  const todo=all.filter(i=>status(i)==="todo").map(i=>qNo(t,i));
  const part=all.filter(i=>status(i)==="doing").map(i=>qNo(t,i));
  const lst=a=>a.length>12?a.slice(0,12).join(", ")+"…":a.join(", ");
  const go=m=>{m.querySelector("#mBack").onclick=closeModal;m.querySelector("#mGo").onclick=()=>{closeModal();submit(false)}};
  if(todo.length||part.length)
    modal(`<h3>Bạn chắc chắn muốn nộp bài?</h3>
      ${todo.length?`<p>Còn <b>${todo.length}</b> câu chưa làm: ${lst(todo)}.</p>`:""}
      ${part.length?`<p>Còn <b>${part.length}</b> câu chưa dùng hết từ: ${lst(part)}.</p>`:""}
      <div class="acts"><button class="btn" id="mBack">Làm tiếp</button><button class="btn primary" id="mGo">Vẫn nộp bài</button></div>`,go);
  else modal(`<h3>Nộp bài?</h3><p>Bạn đã làm đủ ${t.q.length} câu.</p><div class="acts"><button class="btn" id="mBack">Kiểm tra lại</button><button class="btn primary" id="mGo">Nộp bài</button></div>`,go);
};

/* ---------- submit & review ---------- */
function submit(auto){
  if(S.submitted)return;clearInterval(S.tick);closeModal();
  const t=S.test,correct=t.q.filter((q,i)=>isOk(t,i,S.ans[i])).length;
  const r={rid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),testId:t.id,title:t.title,kind:t.kind,name:getName(),date:Date.now(),
    correct,total:t.q.length,score:Math.round(correct/t.q.length*100),time:Math.round(Math.min(elapsed(),S.dur*60)),limit:S.dur,auto:!!auto,
    parts:partStats(t,S.ans),answers:JSON.parse(JSON.stringify(S.ans))};
  const h=hist();h.push(r);LS.set(K.hist,h);
  S.submitted=true;S.result=r;renderList();renderMain();updateTimer();window.scrollTo({top:0,behavior:"smooth"});
  if(auto)modal(`<h3>⏰ Hết giờ!</h3><p>Bài làm đã được tự động nộp.</p><div class="acts"><button class="btn primary" id="mOk">Xem kết quả</button></div>`,m=>m.querySelector("#mOk").onclick=closeModal);
}
function summaryHTML(){
  const r=S.result,parts=r.parts||partStats(S.test,r.answers);
  return `<div class="card sum"><h2>${r.score>=80?"🎉":r.score>=50?"👍":"💪"} Kết quả: ${r.score}/100 điểm</h2>
  <div class="stats">
    <div class="stat"><b>${r.score}</b><span>Tổng điểm</span></div>
    <div class="stat"><b>${r.correct}/${r.total}</b><span>Số câu đúng</span></div>
    <div class="stat"><b>${fmtHMS(r.time)}</b><span>Thời gian làm (giới hạn ${r.limit} phút)</span></div>
    <div class="stat"><b>${r.total-r.correct}</b><span>Câu sai / chưa làm</span></div>
  </div>
  <div class="partrow">${parts.map(p=>`<span>${esc(p.name)}: <b>${p.c}/${p.n}</b></span>`).join("")}</div>
  <div class="part">Học sinh: <b>${esc(r.name)}</b> · Nộp lúc ${fmtDate(r.date)}${r.auto?" · tự động nộp khi hết giờ":""}</div>
  <div class="actions">${actBtns()}</div></div>`;
}
function actBtns(){return `<button class="btn primary" data-act="redo">🔁 Làm lại đề này</button><button class="btn" data-act="next">Đề tiếp theo ➜</button>`}
function bindActs(root){root.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
  if(b.dataset.act==="redo")openTest(S.test.id);
  else{const i=TESTS.indexOf(S.test);openTest(TESTS[(i+1)%TESTS.length].id)}})}
function reviewW(q,i){
  const a=S.ans[i],ok=isOk(S.test,i,a),mine=a.map(k=>q.w[k]).join("");
  return `<div class="card q rv ${ok?"okq":"badq"}" id="q${i}"><div class="qtop"><span class="qno">${91+i}</span><span class="tag ${ok?"ok":"bad"}">${ok?"✓ Đúng":mine?"✗ Sai":"✗ Chưa làm"}</span></div>
  <div class="row"><span class="k">Từ cho sẵn</span><div class="wbank">${q.w.map(w=>`<span>${esc(w)}</span>`).join("")}</div></div>
  <div class="row"><span class="k">Câu trả lời của bạn</span>${mine?`<span class="zhs ${ok?"right":"wrong"}">${esc(mine)}。</span>`:`<i style="color:var(--bad)">(chưa làm)</i>`}</div>
  <div class="row"><span class="k">Đáp án đúng</span><span class="zhs right">${esc(q.a[0])}。</span>
    ${q.a.length>1?`<div style="margin-top:3px"><span class="k">Cũng chấp nhận</span>${q.a.slice(1).map(x=>`<div class="zhs">${esc(x)}。</div>`).join("")}</div>`:""}</div>
  <div class="row"><span class="k">Dịch nghĩa</span>${esc(q.vi)}</div>
  <div class="ex">💡 <b>Ngữ pháp:</b> ${esc(q.ex)}</div></div>`;
}

/* ---------- results board ---------- */
function openBoard(filter){guard(()=>showBoard(filter))}
function showBoard(filter){
  clearInterval(S.tick);S.view="board";S.test=null;renderList();$("#side").style.display=window.innerWidth<=860?"none":"";
  $("#timer").textContent="--:--";$("#timer").classList.remove("red");$("#grid").innerHTML="";$("#nDone").textContent="–";$("#nTodo").textContent="–";$("#sideNote").textContent="";
  {const sb=$("#btnSubmit");sb.disabled=true;sb.textContent="Chọn một đề để làm";sb.style.opacity=.6}
  const f=filter||"all";const all=hist().sort((a,b)=>b.date-a.date);const rows=f==="all"?all:all.filter(r=>r.testId===f);
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
  $("#main").innerHTML=`<div class="card thead"><h1>📊 Bảng kết quả</h1><div class="src">Lịch sử tất cả các lần làm bài trên trình duyệt này</div>
    <div class="filters"><label>Lọc theo đề: <select id="flt"><option value="all">Tất cả các đề</option>${TESTS.map(t=>`<option value="${t.id}" ${f===t.id?"selected":""}>${esc(t.group+" – "+t.short)}</option>`).join("")}</select></label>
    <span style="flex:1"></span><button class="btn small" id="csv">⬇️ Tải CSV</button><button class="btn small danger" id="clr">🗑 Xóa lịch sử</button></div>
    <div class="stats">
      <div class="stat"><b>${rows.length}</b><span>Số lần làm</span></div>
      <div class="stat"><b>${rows.length?avg(rows.map(r=>r.score)).toFixed(1):"–"}</b><span>Điểm trung bình</span></div>
      <div class="stat"><b>${rows.length?Math.max(...rows.map(r=>r.score)):"–"}</b><span>Điểm cao nhất</span></div>
      <div class="stat"><b>${rows.length?fmtHMS(avg(rows.map(r=>r.time))):"–"}</b><span>Thời gian trung bình</span></div>
    </div></div>
    <div class="card hist">${rows.length?`<div class="tbl-wrap"><table><tr><th>Ngày làm</th><th>Học sinh</th><th>Đề</th><th>Kết quả</th><th>Thời gian làm bài</th><th>Xem chi tiết</th></tr>
    ${rows.map(r=>{const t=testById(r.testId);return `<tr><td>${fmtDate(r.date)}</td><td>${esc(r.name||"")}</td><td>${esc(t?t.short:r.title)}</td><td><b>${r.correct}/${r.total}</b> · ${r.score}đ</td><td>${fmtHMS(r.time)}</td><td>${t?`<button class="link" data-rid="${r.rid}">Xem</button>`:""}</td></tr>`}).join("")}
    </table></div>`:`<div class="empty">Chưa có lần làm bài nào${f!=="all"?" cho đề này":""}.</div>`}</div>`;
  bindHistLinks($("#main"));
  $("#flt").onchange=e=>showBoard(e.target.value);
  $("#csv").onclick=()=>downloadCSV(rows);
  const clr=$("#clr");let armed=false,tm;
  clr.onclick=()=>{if(!armed){armed=true;clr.classList.add("armed");clr.textContent="Bấm lần nữa để xóa";tm=setTimeout(()=>{armed=false;clr.classList.remove("armed");clr.textContent="🗑 Xóa lịch sử"},4000);return}
    clearTimeout(tm);LS.set(K.hist,f==="all"?[]:hist().filter(r=>r.testId!==f));showBoard(f)};
  window.scrollTo({top:0,behavior:"smooth"});
}
$("#btnBoard").onclick=()=>openBoard();
function downloadCSV(rows){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const head=["Ngày làm","Học sinh","Đề","Phần","Số câu đúng","Tổng số câu","Điểm","Chi tiết theo phần","Thời gian làm bài","Giới hạn (phút)","Tự động nộp","Câu trả lời"];
  const lines=[head.map(q).join(",")];
  rows.forEach(r=>{const t=testById(r.testId);let ansTxt="",parts="";
    if(t){parts=(r.parts||partStats(t,r.answers)).map(p=>p.name+" "+p.c+"/"+p.n).join("; ");
      ansTxt=r.answers.map((a,i)=>{const no=qNo(t,i);
        if(t.kind==="read")return no+":"+(a===null?"-":"ABCD"[a])+(isOk(t,i,a)?"✓":"✗");
        return no+": "+(a.map(k=>t.q[i].w[k]).join("")||"(trống)")+(isOk(t,i,a)?" ✓":" ✗")}).join(t.kind==="read"?" ":" | ")}
    lines.push([fmtDate(r.date),r.name||"",t?t.group+" – "+t.short:r.title,(t||r).kind==="read"?"Đọc":"Viết",r.correct,r.total,r.score,parts,fmtHMS(r.time),r.limit,r.auto?"Có":"Không",ansTxt].map(q).join(","))});
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ket-qua-HSK5-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
let rzT;window.addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S.view==="board")$("#side").style.display=window.innerWidth<=860?"none":"";else renderSide()},150)});

/* ---------- boot ---------- */
showWho();renderTimeOpts();renderList();
const boot=()=>{const last=LS.get(K.last,null);openTest(testById(last)?last:"doc1")};
if(getName())boot();else askName(boot,false);
</script>
