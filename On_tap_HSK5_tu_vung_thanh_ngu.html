<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KH Chinese – Ôn tập HSK 5</title>
<style>
:root{
  --bg:#FFF6F1; --card:#FFFFFF; --pink:#F9C9D1; --pink2:#FDE3E7; --peach:#FFD9C2; --peach2:#FFEDE2;
  --accent:#F28B82; --accent2:#F6A57E; --deep:#D9677A; --text:#5B3A41; --muted:#9A7C82;
  --ok:#7CC6A4; --okbg:#E6F6EE; --bad:#EE7D86; --badbg:#FDE7E9; --line:#F5D8D3;
  --grad:linear-gradient(135deg,#FBC2CE 0%,#FFD3B8 100%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Nunito",-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.zh{font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","Noto Serif SC","PingFang SC","Microsoft YaHei",serif}
button{font-family:inherit;cursor:pointer}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--grad);box-shadow:0 2px 14px rgba(217,103,122,.18)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 20px}
.logo{height:76px;width:auto;max-width:180px;object-fit:contain;border-radius:12px;background:#fff;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.titles h1{margin:0;font-size:21px;color:#8E3A47;letter-spacing:.3px}
.titles p{margin:2px 0 0;font-size:13px;color:#B86A76}
.tabs{margin-left:auto;display:flex;gap:6px;background:rgba(255,255,255,.35);padding:5px;border-radius:999px}
.tab{border:0;background:transparent;color:#A9475A;font-weight:700;padding:9px 18px;border-radius:999px;font-size:15px}
.tab.on{background:#fff;color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.08)}
main{max-width:1180px;margin:0 auto;padding:18px}
.panel{background:var(--card);border-radius:20px;box-shadow:0 4px 20px rgba(242,139,130,.12);padding:18px 20px;margin-bottom:16px;border:1px solid var(--line)}
.panel h2{margin:0 0 10px;font-size:16px;color:var(--deep);display:flex;align-items:center;gap:8px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
/* day chips */
.days{display:flex;flex-wrap:wrap;gap:7px;max-height:150px;overflow:auto;padding:2px}
.chip{border:1.5px solid var(--pink);background:var(--pink2);color:var(--text);border-radius:12px;padding:6px 10px;font-size:13px;min-width:74px;text-align:center;line-height:1.25}
.chip small{display:block;color:var(--muted);font-size:11px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on small{color:#fff;opacity:.9}
.dayact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.mini{border:0;background:var(--peach2);color:var(--deep);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.mini:hover{background:var(--peach)}
.sel-info{font-size:13px;color:var(--muted);margin-left:auto}
/* modes */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{border:0;background:var(--peach2);border-radius:16px;padding:12px 10px;text-align:left;color:var(--text);transition:.15s;border:2px solid transparent}
.mode b{display:block;font-size:14px;margin-top:4px}
.mode span{font-size:12px;color:var(--muted)}
.mode .ic{font-size:22px}
.mode:hover{transform:translateY(-2px);background:var(--peach)}
.mode.on{border-color:var(--accent);background:#fff;box-shadow:0 3px 12px rgba(242,139,130,.25)}
/* stage */
#stage{min-height:300px}
.stage-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stage-head h3{margin:0;font-size:18px;color:var(--deep)}
.prog{flex:1;min-width:160px;height:10px;background:var(--pink2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);width:0;transition:.3s}
.score{font-weight:700;color:var(--deep);font-size:14px}
.q{text-align:center;padding:10px 0 4px}
.q .big{font-size:64px;line-height:1.2;color:var(--text)}
.q .med{font-size:24px}
.q .sub{color:var(--muted);font-size:15px;margin-top:6px}
.q .sent{font-size:24px;line-height:1.7;max-width:820px;margin:0 auto}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);margin:0 4px;color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:760px;margin:16px auto 0}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:17px;color:var(--text);transition:.12s}
.opt.zh{font-size:24px}
.opt:hover:not(:disabled){border-color:var(--accent2);background:var(--peach2)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{text-align:center;margin-top:12px;min-height:26px;font-size:15px}
.fb .ok{color:#3E9C72;font-weight:700}.fb .no{color:var(--bad);font-weight:700}
.nav{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:#fff;padding:11px 22px;border-radius:999px;font-size:15px;font-weight:700;box-shadow:0 3px 10px rgba(242,139,130,.35)}
.btn:hover{background:var(--deep)}
.btn.ghost{background:var(--peach2);color:var(--deep);box-shadow:none}
.btn.ghost:hover{background:var(--peach)}
.spk{border:0;background:var(--pink2);border-radius:50%;width:38px;height:38px;font-size:17px;vertical-align:middle}
.spk:hover{background:var(--pink)}
/* list */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{background:var(--pink2);color:var(--deep);text-align:left;padding:9px 10px;}
.tbl th:first-child{border-radius:12px 0 0 12px}.tbl th:last-child{border-radius:0 12px 12px 0}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.w{font-size:22px;white-space:nowrap}
.tbl .py{color:var(--accent);font-size:14px}
.tbl .pos{display:inline-block;background:var(--peach2);color:var(--deep);border-radius:6px;padding:0 6px;font-size:12px;margin-left:4px}
.tbl .col{color:var(--muted)}
.tbl .ex{font-size:16px}
.hidecol .m-cell span{filter:blur(6px);cursor:pointer}
/* flashcard */
.fc-wrap{perspective:1200px;max-width:560px;margin:4px auto}
.fc{position:relative;height:330px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.front{background:var(--grad);color:#fff}
.front .big{font-size:72px;text-shadow:0 2px 4px rgba(150,60,70,.25)}
.back{background:#fff;border:2px solid var(--pink);transform:rotateY(180deg)}
.back .py{color:var(--accent);font-size:22px;font-weight:700}
.back .m{font-size:22px;margin:8px 0}
.back .ex{font-size:18px;color:var(--text);margin-top:8px;line-height:1.6}
.back .col{font-size:15px;color:var(--muted)}
.fc-count{text-align:center;color:var(--muted);margin-top:10px;font-size:14px}
/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:820px;margin:0 auto}
.mcol{display:flex;flex-direction:column;gap:9px}
.mi{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-size:16px;min-height:50px;color:var(--text)}
.mi.zh{font-size:22px}
.mi.sel{border-color:var(--accent2);background:var(--peach2)}
.mi.done{background:var(--okbg);border-color:var(--ok);opacity:.65;cursor:default}
.mi.err{animation:shake .35s;border-color:var(--bad);background:var(--badbg)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* typing */
.inp{display:block;margin:14px auto 0;width:min(420px,90%);font-size:22px;padding:12px 16px;border-radius:14px;border:2px solid var(--pink);text-align:center;color:var(--text);outline:none;font-family:inherit}
.inp:focus{border-color:var(--accent)}
/* order */
.slots{min-height:64px;border:2px dashed var(--pink);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:860px;margin:10px auto;background:var(--pink2)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:860px;margin:10px auto}
.tok{border:2px solid var(--peach);background:#fff;border-radius:12px;padding:8px 12px;font-size:21px;color:var(--text)}
.tok:hover{background:var(--peach2)}
.slots .tok{border-color:var(--accent2)}
/* result */
.result{text-align:center;padding:14px}
.result .pct{font-size:60px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wronglist{max-width:760px;margin:12px auto 0;text-align:left}
.wronglist div{padding:8px 12px;border-bottom:1px dashed var(--line);font-size:15px}
.badge{display:inline-block;background:var(--pink2);color:var(--deep);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 26px}
@media (max-width:640px){
  .bar{flex-wrap:wrap;padding:8px 12px}.logo{height:42px}
  .titles h1{font-size:16px}.tabs{margin-left:0;width:100%;justify-content:center}
  .opts{grid-template-columns:1fr}.q .big{font-size:44px}.fc{height:300px}.front .big{font-size:56px}
  .tbl .colcell{display:none}
}

/* ===== layout v2 ===== */
.layout{display:grid;grid-template-columns:270px 1fr;gap:20px;max-width:1320px;margin:0 auto;padding:18px 20px}
.side{position:sticky;top:112px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 20px rgba(242,139,130,.12);max-height:calc(100vh - 130px);display:flex;flex-direction:column}
.side-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:10px}
.side-head h2{margin:0;font-size:17px;color:var(--deep)}
.sel-info{font-size:12px;color:var(--muted);margin:0}
.days{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:none;flex:1;padding:2px 4px 2px 0}
.chip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid transparent;background:var(--bg);border-radius:14px;padding:9px 10px;min-width:0;font-size:14px}
.chip:hover{background:var(--peach2)}
.chip .n{flex:none;width:34px;height:34px;border-radius:10px;background:var(--pink2);color:var(--deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.chip .t{flex:1;min-width:0}
.chip .t b{display:block;font-size:14px}
.chip small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .star{font-size:11px;color:var(--deep);background:var(--peach2);border-radius:99px;padding:2px 7px;font-weight:700}
.chip.on{background:var(--accent);border-color:transparent;color:#fff}
.chip.on .n{background:#fff;color:var(--accent)}
.chip.on small{color:#fff}
.chip.on .star{background:rgba(255,255,255,.4);color:#fff}
.dayact{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.dayact .mini{flex:1 1 auto;font-size:12px;padding:7px 10px}
.side .hint{font-size:12px;margin:10px 0 0}
.day-select{display:none}
main{max-width:none;margin:0;padding:0;min-width:0}
.modes{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:22px;margin-bottom:16px;box-shadow:0 4px 20px rgba(242,139,130,.10);scrollbar-width:thin}
.mode{flex:none;display:flex;align-items:center;gap:6px;border:0;background:var(--bg);border-radius:999px;padding:9px 14px;color:var(--text);font-size:14px;font-weight:600;white-space:nowrap;transition:.15s}
.mode .ic{font-size:18px}
.mode b{display:inline;font-size:14px;margin:0}
.mode span:not(.ic){display:none}
.mode:hover{background:var(--peach2);transform:none}
.mode.on{background:var(--accent);color:#fff;border:0;box-shadow:0 3px 10px rgba(242,139,130,.35)}
#stage{min-height:calc(100vh - 230px);padding:26px 30px}
.stage-desc{color:var(--muted);font-size:14px;margin:-6px 0 14px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:12px}
  .side{position:static;max-height:none;padding:12px}
  .days{display:none}
  .day-select{display:block;width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--pink);font-size:15px;color:var(--text);background:#fff;font-family:inherit}
  .modes{border-radius:18px;display:grid;grid-template-columns:repeat(2,1fr)}
  .mode{justify-content:flex-start;font-size:13px;padding:9px 10px}
  #stage{padding:18px 14px;min-height:0}
}

/* ===== student & results ===== */
.who{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 8px 6px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:14px;color:var(--text);margin-left:auto}
.who b{color:#8E3A47}
.who button{border:0;background:var(--peach2);color:var(--deep);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.tabs{margin-left:10px}
.modal{position:fixed;inset:0;background:rgba(91,58,65,.35);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.hide{display:none}
.mbox{background:#fff;border-radius:26px;width:min(440px,100%);padding:28px 26px;text-align:center;box-shadow:0 20px 50px rgba(150,60,70,.25);border-top:8px solid var(--accent)}
.mbox img{height:84px;margin-bottom:6px}
.mbox h2{margin:4px 0 4px;color:#8E3A47;font-size:22px}
.mbox p{color:var(--muted);margin:0 0 16px;font-size:14px}
.mbox label{display:block;text-align:left;font-size:13px;font-weight:700;color:var(--deep);margin:10px 0 5px}
.mbox input{width:100%;font-size:17px;padding:12px 14px;border-radius:14px;border:2px solid var(--pink);outline:none;font-family:inherit;color:var(--text)}
.mbox input:focus{border-color:var(--accent)}
.mbox .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.mbox .btn{width:100%;margin-top:10px;padding:13px}
.rcard{max-width:760px;margin:0 auto;border:2px solid var(--pink);border-radius:22px;overflow:hidden;background:#fff}
.rcard .rtop{background:var(--grad);padding:18px 22px;display:flex;align-items:center;gap:16px;text-align:left}
.rcard .rtop img{height:58px;background:#fff;border-radius:12px;padding:3px}
.rcard .rtop h3{margin:0;color:#8E3A47;font-size:20px}
.rcard .rtop div.s{color:#8E3A47;font-size:13px;opacity:.85}
.rcard .rtop .pct{margin-left:auto;font-size:44px;font-weight:800;color:#fff;-webkit-background-clip:initial;background:none;text-shadow:0 2px 4px rgba(150,60,70,.3)}
.rtable{width:100%;border-collapse:collapse;font-size:15px}
.rtable th{width:38%;text-align:left;background:var(--peach2);color:var(--deep);padding:10px 16px;font-weight:700;border-bottom:1px solid var(--line)}
.rtable td{padding:10px 16px;border-bottom:1px solid var(--line);color:var(--text)}
.rtable td.big{font-size:18px;font-weight:800;color:#8E3A47}
.grade{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;font-size:14px}
.g-a{background:var(--okbg);color:#3E9C72}.g-b{background:#FFF1DA;color:#C27B1E}.g-c{background:var(--badbg);color:var(--bad)}
.hist{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.hist th{background:var(--pink2);color:var(--deep);text-align:left;padding:9px 10px}
.hist td{padding:9px 10px;border-bottom:1px solid var(--line)}
@media print{
  header,.side,.modes,footer,.nav,.no-print,.modal{display:none!important}
  .layout{display:block;padding:0}
  #stage{box-shadow:none;border:0;padding:0;min-height:0}
  body{background:#fff}
  .rcard{border-color:#ddd}
}

.modes{display:flex!important;flex-direction:column;gap:6px!important;border-radius:22px!important;padding:10px!important}
.mgroup{background:var(--bg);border-radius:14px;padding:6px 8px;display:flex;align-items:center;gap:10px}
.mglabel{flex:none;width:128px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);margin:0 4px}
.mgrow{display:flex;flex-wrap:wrap;gap:6px}
.mgroup .mode{background:#fff;padding:7px 11px;font-size:13px}
.mgroup .mode b{font-size:13px}
.mgroup .mode.on{background:var(--accent);color:#fff}
.q mark{background:var(--peach);color:#8E3A47;padding:0 4px;border-radius:6px}
.tfbox{display:flex;gap:14px;justify-content:center;margin-top:16px}
.tfbox .opt{min-width:150px;font-weight:800}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px auto 14px;max-width:860px}
.bank span{background:var(--peach2);border:2px solid var(--peach);border-radius:12px;padding:6px 12px;font-size:20px}
.bank span b{color:var(--accent);margin-right:5px;font-family:inherit;font-size:14px}
.bsent{max-width:860px;margin:0 auto;text-align:left}
.bsent div{font-size:20px;line-height:1.9;padding:6px 0;border-bottom:1px dashed var(--line)}
.bsent select{font-size:17px;padding:4px 8px;border-radius:10px;border:2px solid var(--pink);margin:0 4px;font-family:inherit;color:var(--text);background:#fff}
.bsent select.right{border-color:var(--ok);background:var(--okbg)}
.bsent select.wrong{border-color:var(--bad);background:var(--badbg)}
.bsent .ans{font-size:14px;color:#3E9C72;margin-left:6px}
.opt.sentopt{font-size:19px;text-align:left;line-height:1.6}
.timer{font-weight:800;color:#fff;background:var(--accent);border-radius:99px;padding:4px 12px;font-size:14px}
@media (max-width:900px){.mgroup{flex-direction:column;align-items:flex-start;gap:4px}.mglabel{width:auto}}

.th-group{border:2px solid var(--pink2);border-radius:20px;margin-bottom:16px;overflow:hidden}
.th-head{background:var(--grad);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.th-head .no{background:#fff;color:var(--accent);font-weight:800;border-radius:10px;padding:3px 9px;font-size:13px}
.th-head .ws{font-size:24px;color:#8E3A47}
.th-head .pys{font-size:13px;color:#8E3A47;opacity:.85}
.th-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0}
.th-w{padding:12px 16px;border-right:1px dashed var(--line);border-top:1px dashed var(--line)}
.th-w .hw{font-size:24px}.th-w .py{color:var(--accent);font-size:14px;margin-left:6px}
.th-w .pos{display:inline-block;background:var(--peach2);color:var(--deep);border-radius:6px;padding:1px 7px;font-size:12px;margin:4px 0}
.th-w .d{font-size:14px;line-height:1.55;margin:4px 0}
.th-w .e{font-size:17px;color:var(--text);margin:3px 0}
.synchoices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.synchoices .opt{min-width:120px;font-size:24px}
.q select.sy{font-size:20px;padding:4px 8px;border-radius:10px;border:2px solid var(--pink);margin:0 4px;font-family:inherit;background:#fff;color:var(--text)}
.q select.sy.right{border-color:var(--ok);background:var(--okbg)} .q select.sy.wrong{border-color:var(--bad);background:var(--badbg)}
.grouptag{display:inline-block;background:var(--pink2);color:var(--deep);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;margin-bottom:8px}
.syn-search{width:100%;padding:9px 12px;border-radius:12px;border:2px solid var(--pink);font-size:14px;margin-bottom:10px;font-family:inherit;color:var(--text);outline:none}
.syn-search:focus{border-color:var(--accent)}
@media (max-width:900px){.syn-search{display:none!important}}
</style>
</head>
<body>
<header>

function loadVoices(){ const vs=speechSynthesis.getVoices(); zhVoice = vs.find(v=>/zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null; }

function say(t){ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.85; if(zhVoice) u.voice=zhVoice; speechSynthesis.speak(u); }
const spk = t=>`<button class="spk" title="Nghe" onclick="event.stopPropagation();say('${esc(t).replace(/'/g,"\\'")}')">🔊</button>`;
function distract(item, n, key){
  const src = pool().length>=n+1 ? pool() : allItems();
  let c = shuffle(src.filter(x=>x[key]!==item[key]));
  if(item.pos && key==='w'){ const same=c.filter(x=>x.pos===item.pos); if(same.length>=n) c=same.concat(c.filter(x=>x.pos!==item.pos)); }
  const res=[]; const seen=new Set([item[key]]);
  for(const x of c){ if(!seen.has(x[key])){ seen.add(x[key]); res.push(x); } if(res.length>=n) break; }
  if(res.length<n){ for(const x of shuffle(allItems())){ if(!seen.has(x[key])){seen.add(x[key]);res.push(x);} if(res.length>=n) break; } }
  return res;
}
function blankSentence(ex, w){

}

function synQ(g,q,which){
  const k=(q.s.match(/＿/g)||[]).length;

$('#ordBtn').onclick=()=>{ bookOrder=!bookOrder; $('#ordBtn').textContent=bookOrder?'📚 Thứ tự: theo sách':'🔀 Thứ tự: xáo trộn'; start(); };
$('#multiBtn').onclick=()=>{ multi=!multi; const b=$('#multiBtn'); b.textContent=(multi?'☑':'☐')+(sec==='S'?' Chọn nhiều nhóm':' Chọn nhiều ngày'); b.style.background=multi?'var(--pink)':''; };

// ---------- stage ----------
function head(title, extra=''){ const m=(MODES[sec].find(x=>x[0]===mode[sec])||[]); return `<div class="stage-head"><h3>${title}</h3>${extra}</div>`; }
function dayLabel(){ const d=[...selected[sec]].sort((a,b)=>a-b); if(sec==='S'){ return d.length===1?`Nhóm ${String(DAYS.S[d[0]][0].n).padStart(3,'0')}`:(d.length===125?'Tất cả 125 nhóm':`${d.length} nhóm`); } return d.length===1?`Ngày ${d[0]+1}`:(d.length===DAYS[sec].length?'Tất cả các ngày':`${d.length} ngày`); }

let activeTimer=null;
function start(){
  if(activeTimer){ clearInterval(activeTimer); activeTimer=null; }
  const m=mode[sec]; const st=$('#stage');
  if(m==='history') return renderHistory(st);
  if(m==='list') return renderList(st);
  if(m==='theory') return renderTheory(st);
  if(m==='flash') return renderFlash(st);
  if(!['list','flash','history','theory'].includes(m) && needName(st)) return;
  if(sec==='S'){ if(m==='synEx') return runQuiz(st, synQs(false)); if(m==='synMix') return runQuiz(st, synQs(true)); if(m==='synWhich') return runQuiz(st, synQs(true,true)); if(m==='speed') return runQuiz(st, synSpeed(), false, 60); if(m==='test') return runQuiz(st, shuffle(synQs(true)).slice(0,20), true); }
  if(m==='match') return renderMatch(st);
  if(m==='order') return runQuiz(st, buildOrder());
  if(m==='test') return runQuiz(st, buildTest(), true);
  if(m==='bank') return runQuiz(st, buildBank());
  if(m==='speed') return runQuiz(st, buildSpeed(), false, 60);
  return runQuiz(st, buildQs(m));
}

// LIST
function renderList(st){
  const items=pool(); let hide=false;
  const draw=()=>{
    st.innerHTML=head(`📖 Danh sách – ${dayLabel()}`,`<button class="mini" id="hideM">${hide?'👁 Hiện nghĩa':'🙈 Che nghĩa'}</button><button class="mini" id="readAll">🔊 Đọc lần lượt</button>`)+
    `<div style="overflow:auto"><table class="tbl ${hide?'hidecol':''}"><thead><tr><th>#</th><th>${sec==='V'?'Từ vựng':'Thành ngữ'}</th><th>Nghĩa</th>${sec==='V'?'<th class="colcell">Cụm từ</th>':''}<th>Ví dụ</th></tr></thead><tbody>`+
    items.map((x,i)=>`<tr><td>${x.n?`<b>${x.n}</b><div class="py" style="font-size:11px">U${x.u}</div>`:i+1}</td><td class="w zh">${esc(x.w)} ${spk(x.w)}<div class="py">${esc(x.py)}${x.pos?`<span class="pos">${esc(x.pos)}</span>`:''}</div></td><td class="m-cell"><span onclick="this.parentNode.parentNode.parentNode.parentNode.classList.remove('hidecol')">${esc(x.m)}</span></td>${sec==='V'?`<td class="col zh colcell">${esc(x.col||'')}</td>`:''}<td class="ex zh">${esc(x.ex||'')} ${x.ex?spk(x.ex):''}</td></tr>`).join('')+
    `</tbody></table></div>`;
    $('#hideM').onclick=()=>{hide=!hide;draw();};
    $('#readAll').onclick=()=>{ let i=0; const next=()=>{ if(i>=items.length) return; const u=new SpeechSynthesisUtterance(items[i++].w); u.lang='zh-CN'; u.rate=.8; if(zhVoice) u.voice=zhVoice; u.onend=()=>setTimeout(next,600); speechSynthesis.speak(u); }; speechSynthesis.cancel(); next(); };
  };
  draw();
}

// FLASH
function renderFlash(st){
  let items=(sec==='S'?synWords():pool()), i=0, flip=false;
  const known=new Set(store('known_'+sec)||[]);
  const draw=()=>{
    const x=items[i];
    st.innerHTML=head(`🃏 Flashcard – ${dayLabel()}`,`<button class="mini" id="shuf">🔀 Trộn thẻ</button><button class="mini" id="onlyNew">Chỉ thẻ chưa thuộc</button>`)+
    `<div class="fc-wrap"><div class="fc ${flip?'flip':''}" id="card">
      <div class="face front"><div class="big zh">${esc(x.w)}</div><div style="margin-top:12px;opacity:.9">Bấm để lật thẻ</div></div>
      <div class="face back"><div class="zh" style="font-size:34px">${esc(x.w)} ${spk(x.w)}</div><div class="py">${esc(x.py)}${x.pos?` · ${esc(x.pos)}`:''}</div><div class="m">${esc(x.m)}</div>${x.col?`<div class="col zh">${esc(x.col)}</div>`:''}<div class="ex zh">${esc(x.ex||'')}</div></div>
    </div></div>
    <div class="fc-count">${i+1} / ${items.length}${x.u?` · Unit ${x.u} · #${x.n}`:''} ${known.has(x.id)?'· <span class="badge">✓ Đã thuộc</span>':''}</div>
    <div class="nav"><button class="btn ghost" id="prev">← Trước</button><button class="btn ghost" id="know">${known.has(x.id)?'Bỏ đánh dấu':'✓ Đã thuộc'}</button><button class="btn" id="next">Tiếp →</button></div>`;
    $('#card').onclick=()=>{flip=!flip;$('#card').classList.toggle('flip');};
    $('#prev').onclick=()=>{i=(i-1+items.length)%items.length;flip=false;draw();};
    $('#next').onclick=()=>{i=(i+1)%items.length;flip=false;draw();};
    $('#know').onclick=()=>{known.has(x.id)?known.delete(x.id):known.add(x.id);store('known_'+sec,[...known]);draw();};
    $('#shuf').onclick=()=>{items=shuffle(items);i=0;flip=false;draw();};
    $('#onlyNew').onclick=()=>{const f=(sec==='S'?synWords():pool()).filter(y=>!known.has(y.id)); if(!f.length){alert('Bạn đã thuộc hết các thẻ đã chọn! 🎉');return;} items=f;i=0;flip=false;draw();};
  };
  document.onkeydown=e=>{ if(mode[sec]!=='flash') return; if(e.key==='ArrowRight') $('#next')&&$('#next').click(); if(e.key==='ArrowLeft') $('#prev')&&$('#prev').click(); if(e.key===' '){e.preventDefault();$('#card')&&$('#card').click();} };
  draw();
}

// MATCH
function renderMatch(st){
  const all=ord(pool()); const per=sec==='V'?6:5; let round=0, errors=0, done=0;
  const rounds=[]; for(let k=0;k<all.length;k+=per) rounds.push(all.slice(k,k+per));
  if(rounds.length>1 && rounds[rounds.length-1].length<3){ const last=rounds.pop(); rounds[rounds.length-1].push(...last); }
  const draw=()=>{
    const set=rounds[round]; let pick=null;
    const L=shuffle(set), R=shuffle(set);
    st.innerHTML=head(`🔗 Nối ${sec==='V'?'từ':'thành ngữ'} với nghĩa – ${dayLabel()}`,`<div class="prog"><i style="width:${round/rounds.length*100}%"></i></div><span class="score">Lượt ${round+1}/${rounds.length} · Sai: ${errors}</span>`)+
    `<div class="match"><div class="mcol">${L.map(x=>`<button class="mi zh" data-id="${x.id}" data-s="L">${esc(x.w)}</button>`).join('')}</div><div class="mcol">${R.map(x=>`<button class="mi" data-id="${x.id}" data-s="R">${esc(x.m)}</button>`).join('')}</div></div><div class="fb" id="fb"></div>`;
    let left=set.length;
    st.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('done')) return;
      if(b.dataset.s==='L') say(set.find(x=>x.id===b.dataset.id).w);
      if(!pick || pick.dataset.s===b.dataset.s){ st.querySelectorAll('.mi.sel').forEach(z=>z.classList.remove('sel')); pick=b; b.classList.add('sel'); return; }
      if(pick.dataset.id===b.dataset.id){ [pick,b].forEach(z=>{z.classList.remove('sel');z.classList.add('done');}); pick=null; left--; done++;
        if(!left){ setTimeout(()=>{ round++; if(round<rounds.length) draw(); else finishMatch(); },500); }
      } else { errors++; [pick,b].forEach(z=>{z.classList.remove('sel');z.classList.add('err');setTimeout(()=>z.classList.remove('err'),400);}); pick=null; st.querySelector('.score').textContent=`Lượt ${round+1}/${rounds.length} · Sai: ${errors}`; }
    });
  };
  const t0=Date.now();
  const finishMatch=()=>{
    const pct=Math.max(0,Math.round(done/(done+errors)*100));
    saveBest(pct);
    const o={name:student?student.name:'', cls:student?student.cls:'', sec, day:dayRange(), mode:'Nối '+(sec==='V'?'từ':'nghĩa'), right:done, total:done+errors, unit:'lượt nối (đúng/tổng)', pct, secs:(Date.now()-t0)/1000, when:fmtDate(new Date())};
    saveResult(o);
    st.innerHTML=head('🔗 Hoàn thành!')+resultCard(o)+`<p style="text-align:center;margin-top:12px">Nối đúng ${done} cặp · Nhầm ${errors} lần</p><div class="nav"><button class="btn" onclick="start()">Làm lại</button><button class="btn ghost" onclick="window.print()">🖨️ In / Lưu PDF</button></div>`;
  };
  draw();
}
function saveBest(pct){ if(selected[sec].size!==1) return; const d=[...selected[sec]][0]; const k=`best_${sec}_${d}`; const b=store(k); if(b==null||pct>b){ store(k,pct); renderDays(); } }

// QUESTION BUILDERS
function qMC(x, kind){
  if(kind==='mcM'){ const o=shuffle([x,...distract(x,3,'m')]); return {type:'mc', prompt:`<div class="big zh">${esc(x.w)}</div><div class="sub">${spk(x.w)} Chọn nghĩa đúng</div>`, opts:o.map(y=>({t:esc(y.m),ok:y===x})), item:x}; }
  if(kind==='mcW'){ const o=shuffle([x,...distract(x,3,'w')]); return {type:'mc', prompt:`<div class="med">${esc(x.m)}</div><div class="sub">Chọn ${sec==='V'?'từ':'thành ngữ'} tiếng Trung đúng</div>`, opts:o.map(y=>({t:esc(y.w),ok:y===x,zh:1})), item:x}; }
  if(kind==='mcP'){ const o=shuffle([x,...distract(x,3,'py')]); return {type:'mc', prompt:`<div class="big zh">${esc(x.w)}</div><div class="sub">${esc(x.m)} – chọn pinyin đúng</div>`, opts:o.map(y=>({t:esc(y.py),ok:y===x})), item:x}; }
  if(kind==='listen'){ const o=shuffle([x,...distract(x,3,'w')]); return {type:'mc', listen:x.w, prompt:`<div style="font-size:60px">🎧</div><div class="sub">Nghe và chọn ${sec==='V'?'từ':'thành ngữ'} đúng <button class="btn ghost" style="padding:6px 14px" onclick="say('${esc(x.w)}')">🔊 Nghe lại</button></div>`, opts:o.map(y=>({t:esc(y.w),ok:y===x,zh:1})), item:x}; }
  if(kind==='fill'){ const s=blankSentence(x.ex,x.w); if(!s) return null; const o=shuffle([x,...distract(x,3,'w')]); return {type:'mc', prompt:`<div class="sent zh">${s}</div><div class="sub">Chọn ${sec==='V'?'từ':'thành ngữ'} điền vào chỗ trống</div>`, opts:o.map(y=>({t:esc(y.w),ok:y===x,zh:1})), item:x, after:x.ex}; }
  if(kind==='miss'){ const chars=[...x.w].map((c,i)=>[c,i]).filter(([c])=>/[\u4e00-\u9fff]/.test(c)); const [c,pos]=chars[Math.random()*chars.length|0];
    const others=new Set(); shuffle(allItems()).forEach(y=>[...y.w].forEach(ch=>{ if(/[\u4e00-\u9fff]/.test(ch)&&ch!==c&&!x.w.includes(ch)) others.add(ch); }));
    const o=shuffle([c,...shuffle([...others]).slice(0,3)]);
    const shown=[...x.w].map((ch,i)=>i===pos?'<span class="blank">？</span>':esc(ch)).join('');
    return {type:'mc', prompt:`<div class="big zh">${shown}</div><div class="sub">${esc(x.m)} – chọn chữ còn thiếu</div>`, opts:o.map(y=>({t:esc(y),ok:y===c,zh:1})), item:x}; }
  if(kind==='tf'){ const ok=Math.random()<.5; const m=ok?x.m:distract(x,1,'m')[0].m; return {type:'mc', tf:1, prompt:`<div class="big zh">${esc(x.w)}</div><div class="sub">${spk(x.w)} có nghĩa là</div><div class="med" style="margin-top:8px">“${esc(m)}”</div>`, opts:[{t:'✓ Đúng',ok:ok},{t:'✗ Sai',ok:!ok}], item:x}; }
  if(kind==='ctx'){ if(!x.ex||!x.ex.includes(x.w)) return null; const s=esc(x.ex).split(esc(x.w)).join(`<mark>${esc(x.w)}</mark>`); const o=shuffle([x,...distract(x,3,'m')]); return {type:'mc', prompt:`<div class="sent zh">${s}</div><div class="sub">Từ được tô màu trong câu có nghĩa là gì?</div>`, opts:o.map(y=>({t:esc(y.m),ok:y===x})), item:x}; }
  if(kind==='col'){ if(!x.col) return null; const segs=x.col.split(/[，；]/).map(z=>z.trim()).filter(z=>z.includes(x.w)&&z.length>x.w.length&&!/^Lt/.test(z)).slice(0,3); if(!segs.length) return null;
    const shown=segs.map(z=>esc(z).split(esc(x.w)).join('<span class="blank">＿＿</span>')).join('　·　'); const o=shuffle([x,...distract(x,3,'w')]);
    return {type:'mc', prompt:`<div class="sent zh">${shown}</div><div class="sub">Chọn từ điền vào các cụm từ cố định (搭配)</div>`, opts:o.map(y=>({t:esc(y.w),ok:y===x,zh:1})), item:x, after:segs.join('，')}; }
  if(kind==='missW'){ const cs=[...x.w]; if(cs.length<2) return null; const pos=Math.random()*cs.length|0; const c=cs[pos];
    const others=new Set(); shuffle(allItems()).slice(0,80).forEach(y=>[...y.w].forEach(ch=>{ if(ch!==c&&!x.w.includes(ch)) others.add(ch); }));
    const o=shuffle([c,...[...others].slice(0,3)]); const shown=cs.map((ch,i)=>i===pos?'<span class="blank">？</span>':esc(ch)).join('');
    return {type:'mc', prompt:`<div class="big zh">${shown}</div><div class="sub">${esc(x.py)} · ${esc(x.m)} – chọn chữ còn thiếu</div>`, opts:o.map(y=>({t:esc(y),ok:y===c,zh:1})), item:x}; }
  if(kind==='usage'){ if(!x.ex||!x.ex.includes(x.w)) return null;
    const cands=shuffle(allItems().filter(y=>y!==x&&y.ex&&y.ex.includes(y.w)&&y.pos!==x.pos&&y.w.length===x.w.length&&!y.ex.includes(x.w))).slice(0,2);
    if(cands.length<2) return null; const wrongS=cands.map(y=>y.ex.split(y.w).join(x.w));
    const o=shuffle([{s:x.ex,ok:true},...wrongS.map(s=>({s,ok:false}))]);
    return {type:'mc', one:1, prompt:`<div class="big zh" style="font-size:44px">${esc(x.w)}</div><div class="sub">${esc(x.m)} – câu nào dùng từ này đúng?</div>`, opts:o.map(z=>({t:esc(z.s).split(esc(x.w)).join(`<b>${esc(x.w)}</b>`),ok:z.ok,zh:1,sent:1})), item:x}; }
  if(kind==='half'){ const sp=halves(x.ex); if(!sp) return null;
    const others=shuffle(allItems().filter(y=>y!==x).map(y=>halves(y.ex)).filter(Boolean)).slice(0,3).map(h=>h[1]);
    const o=shuffle([{s:sp[1],ok:true},...others.map(s=>({s,ok:false}))]);
    return {type:'mc', one:1, prompt:`<div class="sent zh">${esc(sp[0])}<span class="blank">　……　</span></div><div class="sub">Chọn vế sau phù hợp để hoàn thành câu</div>`, opts:o.map(z=>({t:esc(z.s),ok:z.ok,zh:1,sent:1})), item:x, after:x.ex}; }
  if(kind==='listenS'){ if(!x.ex||!x.ex.includes(x.w)) return null; const o=shuffle([x,...distract(x,3,'w')]);
    return {type:'mc', listen:x.ex, prompt:`<div style="font-size:56px">📻</div><div class="sub">Nghe câu và chọn ${sec==='V'?'từ':'thành ngữ'} xuất hiện trong câu <button class="btn ghost" style="padding:6px 14px" onclick="say(${JSON.stringify(x.ex).replace(/"/g,'&quot;')})">🔊 Nghe lại</button></div>`, opts:o.map(y=>({t:esc(y.w),ok:y===x,zh:1})), item:x, after:x.ex}; }
  return null;
}
function halves(s){ if(!s) return null; const k=s.indexOf('，'); if(k<4||s.length-k<6) return null; return [s.slice(0,k+1), s.slice(k+1)]; }
function buildQs(kind){ return ord(pool()).map(x=>qMC(x,kind)).filter(Boolean); }
function buildOrder(){ return ord(pool()).filter(x=>x.ch&&x.ch.length>=3||(x.ex&&x.ex.length>6)).map(x=>({type:'order', item:x, parts:x.ch&&x.ch.length>=3?x.ch:chunkJS(x.ex), prompt:`<div class="sub">${esc(x.m)} · <b class="zh">${esc(x.w)}</b></div>`})); }
function chunkJS(s){ const parts=s.split(/(?<=[，。！？、；])/).filter(Boolean); if(parts.length>=3) return parts; const n=Math.min(6,Math.max(3,Math.round(s.length/4))); const L=Math.ceil(s.length/n); const out=[]; for(let i=0;i<s.length;i+=L) out.push(s.slice(i,i+L)); return out; }
function buildBank(){
  const its=ord(pool()).filter(x=>x.ex&&x.ex.includes(x.w)); const qs=[];
  for(let k=0;k<its.length;k+=5){ const g=its.slice(k,k+5); if(g.length<3){ if(qs.length){ qs[qs.length-1].items.push(...g); qs[qs.length-1].pts+=g.length; } else qs.push({type:'bank',items:g,pts:g.length,item:g[0]}); continue; } qs.push({type:'bank',items:g,pts:g.length,item:g[0]}); }
  qs.forEach(q=>q.prompt=`<div class="sub">Chọn ${sec==='V'?'từ':'thành ngữ'} thích hợp điền vào mỗi chỗ trống (mỗi từ dùng 1 lần)</div>`);
  return qs;
}
function buildSpeed(){ let a=[]; for(let r=0;r<6;r++) a=a.concat(shuffle(pool())); return a.map(x=>qMC(x, Math.random()<.5?'mcM':(Math.random()<.5?'tf':'mcW'))).filter(Boolean); }
function buildTest(){
  const kinds = sec==='V'?['mcM','ctx','col','mcW','fill','tf','half','missW','mcP']:['mcM','ctx','mcW','miss','fill','tf','half'];
  const items=ord(pool()).slice(0, sec==='V'?20:Math.min(15,Math.max(10,pool().length)));
  const qs=[]; let src=items; if(src.length<10) src=src.concat(ord(pool())).slice(0,10);
  src.forEach((x,i)=>{ let q=null, t=0; while(!q && t<5){ q=qMC(x,kinds[(i+t)%kinds.length]); t++; } if(q) qs.push(q); });
  return qs;
}

// QUIZ RUNNER
function runQuiz(st, qs, isTest, speed){
  if(!qs.length){ st.innerHTML='<div class="empty">Không có câu hỏi phù hợp cho lựa chọn này.</div>'; return; }
  const title = (MODES[sec].find(m=>m[0]===mode[sec])||[])[2];
  let i=0, right=0, done=0; const wrong=[]; const t0=Date.now(); const totalPts=qs.reduce((a,q)=>a+(q.pts||1),0); let timer=null, left=speed||0, over=false;
  if(speed){ timer=activeTimer=setInterval(()=>{ left--; const el=$('#tmr'); if(el) el.textContent='⏱ '+left+'s'; if(left<=0){ clearInterval(timer); over=true; finish(); } },1000); }
  const alive=()=>document.body.contains(st)&&!over;
  const draw=()=>{
    const q=qs[i];
    st.innerHTML=head(`${(MODES[sec].find(m=>m[0]===mode[sec])||[])[1]} ${title} – ${dayLabel()}`,(speed?`<span class="timer" id="tmr">⏱ ${left}s</span><span class="score">Đã làm ${done} · Đúng ${right}</span>`:`<div class="prog"><i style="width:${i/qs.length*100}%"></i></div><span class="score">${q.type==='bank'?'Đoạn':'Câu'} ${i+1}/${qs.length} · Đúng ${right}</span>`))+
      `<div class="q">${q.prompt}</div><div id="body"></div><div class="fb" id="fb"></div><div class="nav" id="nav"></div>`;
    const body=$('#body'), fb=$('#fb'), nav=$('#nav');
    const next=()=>{ if(over) return; i++; if(i<qs.length) draw(); else finish(); };
    const reveal=(ok, extra='')=>{
      done++; q._ok=!!ok;
      if(ok){ right++; fb.innerHTML=`<span class="ok">✓ Chính xác!</span> ${extra}`; }
      else { wrong.push(q.item); fb.innerHTML=`<span class="no">✗ Chưa đúng.</span> ${extra}`; }
      const it=q.item; if(q.type!=='syn') fb.innerHTML+=`<div style="margin-top:6px"><span class="zh" style="font-size:20px">${esc(it.w)}</span> · ${esc(it.py)} · ${esc(it.m)} ${spk(it.w)}</div>`;
      if(speed){ setTimeout(next, ok?350:1100); return; }
      nav.innerHTML=`<button class="btn" id="nx">${i+1<qs.length?'Câu tiếp →':'Xem kết quả'}</button>`; $('#nx').onclick=next; $('#nx').focus();
    };
    if(q.type==='mc'){
      body.innerHTML= q.tf ? `<div class="tfbox">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join('')}</div>` : `<div class="opts" ${q.one?'style="grid-template-columns:1fr"':''}>${q.opts.map((o,k)=>`<button class="opt ${o.zh?'zh':''} ${o.sent?'sentopt':''}" data-k="${k}">${o.t}</button>`).join('')}</div>`;
      if(q.listen) setTimeout(()=>say(q.listen),250);
      body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        const o=q.opts[+b.dataset.k];
        body.querySelectorAll('.opt').forEach((z,k)=>{ z.disabled=true; if(q.opts[k].ok) z.classList.add('right'); });
        if(!o.ok) b.classList.add('wrong');
        reveal(o.ok, q.after?`<div class="zh" style="font-size:18px;margin-top:6px">${esc(q.after)}</div>`:'');
      });
    } else if(q.type==='syn'){
      const parts=q.s.split('＿'); const optsW=q.g.opts;
      const accepted=q.a.map(x=>x.join('|'));
      const filled=(arr)=>parts.map((p,j)=>esc(p)+(j<arr.length?`<b style="color:#3E9C72">${esc(arr[j])}</b>`:'')).join('');
      const tag=`<div class="grouptag">Nhóm ${q.g.n}: <span class="zh">${esc(q.g.w)}</span></div>`;
      if(q.k===1){
        $('.q').innerHTML=tag+`<div class="sent zh">${parts.map(esc).join('<span class="blank">　？　</span>')}</div><div class="sub">Chọn từ thích hợp điền vào chỗ trống</div>`;
        body.innerHTML=`<div class="synchoices">${optsW.map((w,j)=>`<button class="opt zh" data-j="${j}">${esc(w)}</button>`).join('')}</div>`;
        body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const w=optsW[+b.dataset.j]; const ok=accepted.includes(w);
          body.querySelectorAll('.opt').forEach((z,j)=>{ z.disabled=true; if(accepted.includes(optsW[j])) z.classList.add('right'); }); if(!ok) b.classList.add('wrong');
          reveal(ok, `<div class="zh" style="font-size:19px;margin-top:6px">${filled(q.a[0])}</div>${q.a.length>1?`<div class="sub">Đáp án chấp nhận: ${q.a.map(x=>x.join('…')).join(' / ')}</div>`:''}`); });
      } else {
        $('.q').innerHTML=tag+`<div class="sent zh">${parts.map((p,j)=>esc(p)+(j<q.k?`<select class="sy" data-j="${j}"><option value="">（　）</option>${optsW.map(w=>`<option>${esc(w)}</option>`).join('')}</select>`:'')).join('')}</div><div class="sub">Chọn từ cho từng chỗ trống</div>`;
        body.innerHTML=`<div class="nav"><button class="btn" id="chk">Kiểm tra</button></div>`;
        $('#chk').onclick=()=>{ const sels=[...document.querySelectorAll('.q select.sy')]; const v=sels.map(s=>s.value); if(v.some(x=>!x)){ fb.innerHTML='<span class="no">Hãy chọn đủ các chỗ trống nhé!</span>'; return; }
          const ok=accepted.includes(v.join('|')); sels.forEach(s=>{ s.disabled=true; s.classList.add(ok?'right':'wrong'); }); $('#chk').disabled=true;
          reveal(ok, `<div class="zh" style="font-size:19px;margin-top:6px">${filled(q.a[0])}</div>`); };
      }
    } else if(q.type==='bank'){
      const L='ABCDEFGHIJ'; const bankItems=shuffle(q.items);
      body.innerHTML=`<div class="bank">${bankItems.map((y,k)=>`<span class="zh"><b>${L[k]}</b>${esc(y.w)}</span>`).join('')}</div><div class="bsent">${q.items.map((y,n)=>`<div class="zh">${n+1}. ${esc(y.ex).split(esc(y.w)).join(`<select data-n="${n}"><option value="">（　）</option>${bankItems.map((z,k)=>`<option value="${z.id}">${L[k]}</option>`).join('')}</select>`)}</div>`).join('')}</div><div class="nav"><button class="btn" id="chk">Kiểm tra</button></div>`;
      $('#chk').onclick=()=>{ let got=0; const sels=[...body.querySelectorAll('select')];
        q.items.forEach((y,n)=>{ const ss=sels.filter(s=>+s.dataset.n===n); const ok=ss.every(s=>s.value===y.id); if(ok) got++; else wrong.push(y);
          ss.forEach(s=>{ s.disabled=true; s.classList.add(ok?'right':'wrong'); }); const row=ss[0].parentNode; row.insertAdjacentHTML('beforeend',`<span class="ans">→ ${esc(y.w)} (${esc(y.m)})</span>`); });
        $('#chk').disabled=true; right+=got; done++;
        fb.innerHTML=`<span class="${got===q.items.length?'ok':'no'}">Đúng ${got}/${q.items.length} chỗ trống</span>`;
        nav.innerHTML=`<button class="btn" id="nx">${i+1<qs.length?'Đoạn tiếp →':'Xem kết quả'}</button>`; $('#nx').onclick=next; };
    } else if(q.type==='order'){
      const parts=q.parts; let order=shuffle(parts.map((p,k)=>k)); if(order.every((v,k)=>v===k)&&parts.length>1) order.reverse(); const placed=[];
      const rd=()=>{
        body.innerHTML=`<div class="slots" id="slots">${placed.length?placed.map((k,j)=>`<button class="tok zh" data-j="${j}">${esc(parts[k])}</button>`).join(''):'<span style="color:var(--muted);align-self:center">Bấm các mảnh bên dưới theo đúng thứ tự</span>'}</div><div class="pool">${order.filter(k=>!placed.includes(k)).map(k=>`<button class="tok zh" data-k="${k}">${esc(parts[k])}</button>`).join('')}</div><div class="nav"><button class="btn" id="chk">Kiểm tra</button><button class="btn ghost" id="rs">Làm lại</button></div>`;
        body.querySelectorAll('.pool .tok').forEach(b=>b.onclick=()=>{placed.push(+b.dataset.k);rd();});
        body.querySelectorAll('.slots .tok').forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.j,1);rd();});
        $('#rs').onclick=()=>{placed.length=0;rd();};
        $('#chk').onclick=()=>{ if(placed.length<parts.length){ fb.innerHTML='<span class="no">Hãy xếp hết các mảnh nhé!</span>'; return; }
          const ans=placed.map(k=>parts[k]).join(''); const ok=ans===parts.join('');
          body.querySelectorAll('button').forEach(z=>z.disabled=true);
          reveal(ok, `<div class="zh" style="font-size:20px;margin-top:6px">${esc(parts.join(''))} ${spk(parts.join(''))}</div>`); };
      }; rd();
    }
  };
  const finish=()=>{
    if(timer) clearInterval(timer); over=true; if(!document.body.contains(st)) return;
    const tot = speed ? Math.max(done,1) : totalPts;
    const pct=Math.round(right/tot*100); if(!speed) saveBest(pct);
    const o={name:student?student.name:'', cls:student?student.cls:'', sec, day:dayRange(), mode:title+(speed?` (${done} câu/60s)`:''), right, total:speed?done:totalPts, unit:qs[0].type==='bank'?'chỗ trống':'câu', pct, secs:Math.min((Date.now()-t0)/1000, speed||1e9), when:fmtDate(new Date())};
    saveResult(o);
    const ws=[...new Map(wrong.map(w=>[w.id,w])).values()];
    st.innerHTML=head(`🎉 Hoàn thành – ${title}`)+resultCard(o)+
      (ws.length?`<div class="wronglist"><p class="badge">${sec==='S'?'Các nhóm cần ôn lại':'Các '+(sec==='V'?'từ':'thành ngữ')+' làm sai'} (${ws.length})</p>${ws.map(w=>`<div><span class="zh" style="font-size:20px">${esc(w.w)}</span> · ${esc(w.py)} · ${esc(w.m)} <span class="no-print">${spk(w.w)}</span></div>`).join('')}</div>`:'<p style="text-align:center;margin-top:14px">🌸 Không sai câu nào, tuyệt vời!</p>')+
      `<div class="nav"><button class="btn" id="again">Làm lại</button>${ws.length?'<button class="btn ghost" id="redo">Luyện lại câu sai</button>':''}<button class="btn ghost" onclick="window.print()">🖨️ In / Lưu PDF</button><button class="btn ghost" id="toHist">📋 Lịch sử</button></div>`;
    $('#toHist').onclick=()=>{ mode[sec]='history'; renderModes(); start(); };
    $('#again').onclick=start;
    if(wrong.length) $('#redo').onclick=()=>{ const ws=[...new Map(wrong.map(w=>[w.id,w])).values()]; const k=mode[sec]; const qs2 = sec==='S' ? qs.filter(z=>!z._ok) : k==='order'? buildOrder().filter(q=>ws.includes(q.item)) : ws.map(x=>qMC(x, ['test','speed','bank'].includes(k)?'mcM':k)).filter(Boolean); runQuiz(st, qs2, isTest); };
  };
  draw();
}

showWho(); renderDays(); renderModes(); start(); if(!student) askName(); else $('#nameModal').classList.add('hide');
</script>
</body>
</html>
