<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đề kiểm tra cuối khóa HSK 2 - Viết, Dịch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4FAF2;
  --sheet:#FFFFFF;
  --mint:#DFF1DD;
  --pastel:#BFE3C0;
  --sage:#8CC79A;
  --deep:#2C6147;
  --ink:#1E3A2C;
  --muted:#557364;
  --line:#CDE3CD;
  --warn:#F7E7B4;
  --warn-ink:#715711;
  --alert:#F8D4CB;
  --alert-ink:#8E3424;
  --sans:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --han:"Noto Serif SC","Songti SC","SimSun","Microsoft YaHei",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
[hidden]{display:none!important}
.han{font-family:var(--han);font-weight:500}

/* Màn hình bắt đầu */
.start{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.start-box{width:100%;max-width:520px;background:var(--sheet);border:2px solid var(--pastel);border-radius:6px;padding:32px 28px}
.start-cells{display:flex;gap:0;margin-bottom:22px}
.start-cells .cell{width:64px;height:64px;font-size:38px}
.start-cells .cell+.cell{border-left:0}
.start h1{margin:0 0 4px;font-size:26px;line-height:1.3}
.start .sub{margin:0 0 20px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 24px;border:1px solid var(--line);border-radius:4px}
.facts div{padding:10px 8px;text-align:center}
.facts div+div{border-left:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;font-size:20px;font-weight:700}
.field-label{display:block;font-weight:600;margin-bottom:6px}
.name-input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:4px;background:#fff}
.name-input:focus{border-color:var(--sage);outline:none}
.err{min-height:24px;margin:4px 0 8px;color:var(--alert-ink);font-size:14px}

.btn{border:0;border-radius:4px;padding:11px 20px;font-weight:600;cursor:pointer;background:var(--pastel);color:var(--ink);transition:background .15s}
.btn:hover{background:var(--sage)}
.btn.quiet{background:transparent;box-shadow:inset 0 0 0 2px var(--pastel)}
.btn.quiet:hover{background:var(--mint)}
.btn.wide{width:100%}

/* Thanh trên cùng */
.bar{position:sticky;top:0;z-index:20;background:var(--mint);border-bottom:2px solid var(--pastel)}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:20px}
.timer{display:flex;flex-direction:column;line-height:1.1;padding:4px 12px;border-radius:4px;transition:background .3s,color .3s}
.timer small{font-size:12px;color:inherit;opacity:.8}
.timer b{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.warn{background:var(--warn);color:var(--warn-ink)}
.timer.alert{background:var(--alert);color:var(--alert-ink)}
.counts{display:flex;gap:18px;margin-left:auto}
.counts div{line-height:1.15;text-align:center}
.counts small{display:block;font-size:12px;color:var(--muted)}
.counts b{font-size:24px;font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--pastel)}
.progress i{display:block;height:100%;width:100%;background:var(--deep);transform-origin:left;transition:transform 1s linear}

/* Bố cục */
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 72px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:32px;align-items:start}
.head{margin-bottom:24px}
.head h1{margin:0;font-size:25px;line-height:1.3}
.head p{margin:4px 0 0;color:var(--muted)}
.head strong{color:var(--ink)}
.side{position:sticky;top:96px}
.side h2{font-size:15px;margin:0 0 4px}
.side h3{font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 6px}
.nav-grid{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;width:34px;height:34px;display:grid;place-items:center;background:#fff;border:1.5px solid var(--pastel);border-radius:3px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.chip:hover{background:var(--mint)}
.chip.done{background:var(--pastel);border-color:var(--sage)}
.legend{margin:14px 0 0;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border:1.5px solid var(--sage);background:var(--pastel);vertical-align:-1px;margin-right:4px}

/* Phần đề */
.part{margin:0 0 32px}
.part>h2{margin:0;font-size:20px;line-height:1.35}
.part>.hint{margin:2px 0 14px;color:var(--muted)}
.q{scroll-margin-top:96px;background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--pastel);border-radius:3px;padding:16px 18px;margin-bottom:12px}
.q.done{border-left-color:var(--sage)}
.q-num{font-weight:700;margin-right:6px}
.sentence{font-size:21px;line-height:2.1}
.direction{margin:0 0 8px;color:var(--muted);font-size:14px}
.prompt{margin:0 0 4px;font-size:18px}
.prompt.han{font-size:21px}

/* Ô chữ điền từ: lấy cảm hứng từ vở tập viết */
.cell{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;font:500 25px/1 var(--han);color:var(--deep);border:1.5px solid var(--sage);background:
  linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,
  linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,#fff;vertical-align:middle}
.blank{display:inline-flex;margin:0 6px;vertical-align:middle}
.blank .cell+.cell{border-left:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt{cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:block;min-width:76px;text-align:center;padding:6px 14px;border:1.5px solid var(--pastel);border-radius:3px;font:500 19px/1.4 var(--han);background:#fff}
.opt:hover span{background:var(--mint)}
.opt input:checked+span{background:var(--pastel);border-color:var(--deep)}
.opt input:focus-visible+span{outline:3px solid var(--deep);outline-offset:2px}
textarea{width:100%;min-height:68px;margin-top:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:3px;background:#FBFEFA;resize:vertical;font-size:18px;line-height:1.5}
textarea:focus{border-color:var(--sage);outline:none;background:#fff}
.make{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.make figure{margin:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--mint)}
.make svg{display:block;width:100%;height:auto}
.word{margin:0;font-size:17px}
.word .han{font-size:27px;color:var(--deep);margin-right:6px}

/* Kết quả */
.result{background:var(--mint);border:2px solid var(--sage);border-radius:4px;padding:20px 22px;margin-bottom:28px}
.result h2{margin:0;font-size:22px}
.result .notice{margin:2px 0 14px;color:var(--muted)}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 28px;margin-bottom:12px}
.score .total{font-size:44px;font-weight:700;line-height:1;color:var(--deep);font-variant-numeric:tabular-nums}
.score .total small{font-size:20px;font-weight:500}
.result .todo{margin:0 0 14px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.review{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px}
.review p{margin:0 0 4px}
.tag{display:inline-block;font-weight:600;padding:1px 8px;border-radius:3px;font-size:14px}
.tag.right{background:var(--pastel);color:var(--ink)}
.tag.wrong{background:var(--alert);color:var(--alert-ink)}
.review .han{font-size:18px}
.grade{display:flex;align-items:center;gap:8px;margin-top:6px}
.grade select{padding:5px 8px;border:1.5px solid var(--pastel);border-radius:3px;background:#fff}
body.finished textarea{background:#F6FAF5;resize:none}
body.finished .opt{cursor:default}
body.finished .opt:hover span{background:#fff}
body.finished .opt input:checked+span{background:var(--pastel)}
.bar .finished-label{font-weight:600}

/* Hộp xác nhận */
dialog{border:2px solid var(--sage);border-radius:6px;padding:24px;max-width:400px;width:calc(100% - 32px);color:var(--ink)}
dialog::backdrop{background:rgba(30,58,44,.4)}
dialog h2{margin:0 0 6px;font-size:20px}
dialog p{margin:0 0 18px}
dialog .actions{justify-content:flex-end}

@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:0}
  .side{position:static;grid-row:1;margin-bottom:22px}
  .side h3{margin-top:8px}
  .q{scroll-margin-top:84px}
  .bar-in{gap:10px;padding:8px 12px}
  .timer{padding:2px 6px}
  .timer b{font-size:25px}
  .counts{gap:10px}
  .counts b{font-size:19px}
  .counts small{font-size:11px}
  #submitBtn{padding:10px 12px;font-size:14px;white-space:nowrap}
  .make{grid-template-columns:minmax(0,1fr)}
  .make figure{max-width:280px}
  .sentence{font-size:19px;line-height:2.2}
  .cell{width:38px;height:38px;font-size:22px}
  .start-box{padding:24px 18px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .progress i,.timer,.btn{transition:none}
}
@media print{
  .bar,.side,.actions,.start{display:none!important}
  body{background:#fff}
  .wrap{display:block;padding:0}
  .q{break-inside:avoid}
}
</style>
</head>
<body>

<section class="start" id="startScreen">
  <div class="start-box">
    <div class="start-cells" aria-hidden="true"><span class="cell">汉</span><span class="cell">语</span></div>
    <h1>Đề kiểm tra cuối khóa HSK 2</h1>
    <p class="sub">Phần Viết - Dịch</p>
    <dl class="facts">
      <div><dt>Thời gian</dt><dd>20 phút</dd></div>
      <div><dt>Số câu</dt><dd>14 câu</dd></div>
      <div><dt>Thang điểm</dt><dd>10 điểm</dd></div>
    </dl>
    <form id="startForm" novalidate>
      <label class="field-label" for="nameInput">Họ và tên</label>
      <input class="name-input" id="nameInput" autocomplete="name" maxlength="80">
      <p class="err" id="nameErr" role="alert"></p>
      <button class="btn wide" type="submit">Bắt đầu làm bài</button>
    </form>
  </div>
</section>

<div id="examScreen" hidden>
  <header class="bar">
    <div class="bar-in">
      <div class="timer" id="timer">
        <small>Thời gian còn lại</small>
        <b id="timerText" role="timer">20:00</b>
      </div>
      <div class="counts">
        <div><small>Đã làm</small><b id="doneCount">0</b></div>
        <div><small>Chưa làm</small><b id="leftCount">14</b></div>
      </div>
      <button class="btn" id="submitBtn" type="button">Nộp bài</button>
    </div>
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    <span id="timeAnnounce" class="sr" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></span>
  </header>

  <div class="wrap">
    <main>
      <div class="head">
        <h1>Đề kiểm tra cuối khóa HSK 2</h1>
        <p>Phần Viết - Dịch. Thời gian: 20 phút. Họ và tên: <strong id="nameShow"></strong></p>
      </div>
      <section class="result" id="result" hidden tabindex="-1"></section>
      <div id="parts"></div>
      <button class="btn wide" id="submitBottom" type="button">Nộp bài</button>
    </main>
    <aside class="side" aria-label="Danh sách câu hỏi">
      <h2>Danh sách câu</h2>
      <div id="nav"></div>
      <p class="legend"><i></i>Câu đã làm</p>
    </aside>
  </div>
</div>

<dialog id="confirmDlg">
  <h2>Nộp bài?</h2>
  <p id="confirmText"></p>
  <div class="actions">
    <button class="btn quiet" id="confirmNo" type="button">Làm tiếp</button>
    <button class="btn" id="confirmYes" type="button">Nộp bài</button>
  </div>
</dialog>

<script>
(function(){
  var DURATION = 20 * 60 * 1000;
  var KEY = 'hsk2-viet-dich-v1';

  var slowSvg = '<svg viewBox="0 0 240 150" role="img" aria-label="Một chú rùa đang bò rất chậm trên đường"><rect width="240" height="150" fill="#E6F4FA"/><circle cx="205" cy="30" r="15" fill="#F8E3A0"/><rect y="112" width="240" height="38" fill="#CDE8C6"/><path d="M10 124h20M42 124h20M74 124h20" stroke="#8CC79A" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/><g transform="translate(18 2)"><ellipse cx="95" cy="113" rx="11" ry="7" fill="#9FCF8F"/><ellipse cx="143" cy="113" rx="11" ry="7" fill="#9FCF8F"/><path d="M72 104a47 39 0 0 1 94 0z" fill="#6FAF7E"/><path d="M92 104l13-26h28l13 26M105 78l14 26 14-26" fill="none" stroke="#2C6147" stroke-width="3" stroke-linejoin="round"/><path d="M66 104h106a5 5 0 0 1 0 10H66a5 5 0 0 1 0-10z" fill="#5A9A6C"/><circle cx="185" cy="90" r="17" fill="#9FCF8F"/><path d="M168 106l13-14" stroke="#9FCF8F" stroke-width="15" stroke-linecap="round"/><circle cx="191" cy="85" r="3" fill="#1E3A2C"/><path d="M188 96q6 4 11-1" stroke="#1E3A2C" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M73 108l-13 5" stroke="#9FCF8F" stroke-width="7" stroke-linecap="round"/></g></svg>';

  var soccerSvg = '<svg viewBox="0 0 240 150" role="img" aria-label="Một bạn nhỏ đang đá bóng trên sân cỏ"><rect width="240" height="150" fill="#E6F4FA"/><rect y="108" width="240" height="42" fill="#BFE3C0"/><path d="M186 108V48h46v60" fill="none" stroke="#fff" stroke-width="5"/><path d="M186 62h46M186 76h46M186 90h46M198 48v60M212 48v60M224 48v60" stroke="#fff" stroke-width="1.5"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M68 92l-10 17-16 1" fill="none" stroke="#2C6147" stroke-width="10"/><path d="M72 92l25 7 14-5" fill="none" stroke="#2C6147" stroke-width="10"/><path d="M41 112h10" stroke="#1E3A2C" stroke-width="7"/><path d="M112 88l6 8" stroke="#1E3A2C" stroke-width="7"/><path d="M60 58q11-8 22 0l-3 36H63z" fill="#F2A98E"/><path d="M63 62L44 78" stroke="#F4CDAE" stroke-width="7"/><path d="M80 62l20-11" stroke="#F4CDAE" stroke-width="7"/><circle cx="72" cy="40" r="15" fill="#F4CDAE"/><path d="M57 39q0-15 15-15t15 13q-9-8-15-6t-15 8z" fill="#3B3028"/><circle cx="78" cy="42" r="1.8" fill="#1E3A2C"/><path d="M74 49q4 2 7-1" fill="none" stroke="#1E3A2C" stroke-width="1.6"/></g><g transform="translate(142 88)"><circle r="15" fill="#fff" stroke="#1E3A2C" stroke-width="2.5"/><path d="M0-6l6 4-2 7h-8l-2-7z" fill="#1E3A2C"/><path d="M0-6v-8M6-2l8-3M4 5l5 7M-4 5l-5 7M-6-2l-8-3" stroke="#1E3A2C" stroke-width="1.8"/></g><path d="M118 72q6-3 11-2M116 82h10" fill="none" stroke="#8CC79A" stroke-width="3" stroke-linecap="round"/></svg>';

  var PARTS = [
    {
      title:'Bài tập 1: Điền từ vào chỗ trống',
      hint:'0,4 điểm/câu. Chọn từ thích hợp trong ngoặc để điền vào chỗ trống.',
      items:[
        {id:'a1',type:'choice',before:'这件衣服太贵了，能不能',after:'点儿？',options:['便宜','贵','晴'],answer:'便宜',point:.4},
        {id:'a2',type:'choice',before:'天阴了，可能会',after:'。',options:['下雨','经常','游泳'],answer:'下雨',point:.4},
        {id:'a3',type:'choice',before:'我今天晚上有点儿',after:'，可能不能去帮你做饭了。',options:['忙','空儿','进'],answer:'忙',point:.4},
        {id:'a4',type:'choice',before:'听说这家饭馆的菜非常好吃，我们去',after:'吧！',options:['买','跑步','游泳'],answer:'买',point:.4},
        {id:'a5',type:'choice',before:'离火车站还有很远，我们坐出租车去',after:'。',options:['吧','呢','吗'],answer:'吧',point:.4}
      ]
    },
    {
      title:'Bài tập 2: Dịch các câu sau sang tiếng Việt hoặc tiếng Trung',
      hint:'1,0 điểm/câu.',
      items:[
        {id:'b1',type:'text',prompt:'Hôm nay thời tiết rất đẹp, chúng ta đi ra ngoài chơi đi.',to:'zh',ref:'今天天气很好，我们出去玩儿吧。',point:1},
        {id:'b2',type:'text',prompt:'Mỗi ngày tôi đều đi bộ đến trường.',to:'zh',ref:'我每天都走路去学校。',point:1},
        {id:'b3',type:'text',prompt:'Anh ấy cao hơn tôi, nhưng tôi học tiếng Trung giỏi hơn anh ấy.',to:'zh',ref:'他比我高，但是我汉语学得比他好。',point:1},
        {id:'b4',type:'text',prompt:'Đừng đọc sách nữa, nghỉ ngơi một lát đi!',to:'zh',ref:'别看书了，休息一会儿吧！',point:1},
        {id:'b5',type:'text',prompt:'你觉得学习汉语难不难？',to:'vi',ref:'Bạn thấy học tiếng Trung có khó không?',point:1},
        {id:'b6',type:'text',prompt:'昨天下午你在医院还是在家？',to:'vi',ref:'Chiều hôm qua bạn ở bệnh viện hay ở nhà?',point:1},
        {id:'b7',type:'text',prompt:'虽然今天很累，但是我觉得很开心。',to:'vi',ref:'Tuy hôm nay rất mệt nhưng tôi cảm thấy rất vui.',point:1}
      ]
    },
    {
      title:'Bài tập 3: Đặt câu với từ cho sẵn',
      hint:'0,5 điểm/câu. Dùng ảnh minh hoạ để gợi ý ý tưởng.',
      items:[
        {id:'c1',type:'make',word:'慢',pinyin:'màn',mean:'chậm',svg:slowSvg,ref:'乌龟走得很慢。',point:.5},
        {id:'c2',type:'make',word:'踢足球',pinyin:'tī zúqiú',mean:'đá bóng',svg:soccerSvg,ref:'他每天下午都踢足球。',point:.5}
      ]
    }
  ];

  var ALL = [];
  PARTS.forEach(function(p){ p.items.forEach(function(q){ ALL.push(q); }); });

  var state = {name:'',endAt:0,startedAt:0,answers:{},marks:{},submitted:false,timeUp:false,submittedAt:0};
  var ticking = null;
  var lastBand = '';
  var $ = function(id){ return document.getElementById(id); };

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var s = JSON.parse(raw); if(s && s.endAt){ state = s; state.answers = s.answers||{}; state.marks = s.marks||{}; return true; } }
    }catch(e){}
    return false;
  }
  function clearSaved(){ try{ localStorage.removeItem(KEY); }catch(e){} }

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined) n.textContent = text;
    return n;
  }
  function fmt(x){ return String(Math.round(x*100)/100).replace('.',','); }

  function blankCells(q){
    var val = state.answers[q.id] || '';
    var chars = Array.from(val);
    var wrap = $('blank-'+q.id);
    wrap.textContent = '';
    for(var i=0;i<2;i++){ wrap.appendChild(el('span','cell',chars[i]||'')); }
  }

  function render(){
    var box = $('parts'), nav = $('nav');
    PARTS.forEach(function(part){
      var sec = el('section','part');
      sec.appendChild(el('h2','',part.title));
      sec.appendChild(el('p','hint',part.hint));
      var navTitle = el('h3','',part.title.split(':')[0]);
      nav.appendChild(navTitle);
      var grid = el('div','nav-grid');
      nav.appendChild(grid);

      part.items.forEach(function(q,idx){
        var chip = el('a','chip',String(idx+1));
        chip.href = '#q-'+q.id;
        chip.id = 'chip-'+q.id;
        chip.setAttribute('aria-label', part.title.split(':')[0]+', câu '+(idx+1));
        grid.appendChild(chip);

        var card = el('article','q');
        card.id = 'q-'+q.id;

        if(q.type === 'choice'){
          var s = el('div','sentence han');
          s.appendChild(el('span','q-num',(idx+1)+'.'));
          s.appendChild(document.createTextNode(q.before));
          var b = el('span','blank');
          b.id = 'blank-'+q.id;
          b.setAttribute('aria-hidden','true');
          s.appendChild(b);
          s.appendChild(document.createTextNode(q.after));
          card.appendChild(s);
          var opts = el('div','opts');
          opts.setAttribute('role','radiogroup');
          opts.setAttribute('aria-label','Câu '+(idx+1)+', chọn từ');
          q.options.forEach(function(o){
            var l = el('label','opt');
            var i = document.createElement('input');
            i.type = 'radio'; i.name = q.id; i.value = o;
            if(state.answers[q.id] === o) i.checked = true;
            i.addEventListener('change', function(){ setAnswer(q,o); blankCells(q); });
            l.appendChild(i);
            l.appendChild(el('span','',o));
            opts.appendChild(l);
          });
          card.appendChild(opts);
        } else if(q.type === 'text'){
          var toZh = q.to === 'zh';
          card.appendChild(el('p','direction',toZh ? 'Dịch sang tiếng Trung' : 'Dịch sang tiếng Việt'));
          var p = el('p','prompt'+(toZh?'':' han'));
          p.appendChild(el('span','q-num',(idx+1)+'.'));
          p.appendChild(document.createTextNode(q.prompt));
          card.appendChild(p);
          card.appendChild(makeArea(q, toZh?'zh':'vi', toZh?'Nhập câu tiếng Trung':'Nhập câu tiếng Việt', 'Câu '+(idx+1)+', bản dịch'));
        } else {
          var mk = el('div','make');
          var fig = el('figure');
          fig.innerHTML = q.svg;
          mk.appendChild(fig);
          var right = el('div');
          var w = el('p','word');
          w.appendChild(el('span','q-num',(idx+1)+'.'));
          w.appendChild(el('span','han',q.word));
          w.appendChild(document.createTextNode('('+q.pinyin+' - '+q.mean+')'));
          right.appendChild(w);
          right.appendChild(makeArea(q,'zh','Viết một câu tiếng Trung có từ '+q.word,'Câu '+(idx+1)+', đặt câu với từ '+q.word));
          mk.appendChild(right);
          card.appendChild(mk);
        }
        sec.appendChild(card);
      });
      box.appendChild(sec);
    });
    ALL.forEach(function(q){ if(q.type==='choice') blankCells(q); });
    updateCounts();
  }

  function makeArea(q,lang,ph,label){
    var t = document.createElement('textarea');
    t.id = 'input-'+q.id;
    t.lang = lang;
    t.rows = 2;
    t.placeholder = ph;
    t.setAttribute('aria-label',label);
    t.value = state.answers[q.id] || '';
    t.addEventListener('input', function(){ setAnswer(q,t.value); });
    return t;
  }

  function setAnswer(q,v){
    if(state.submitted) return;
    state.answers[q.id] = v;
    save();
    updateCounts();
  }
  function isDone(q){ return ((state.answers[q.id]||'').trim().length > 0); }

  function updateCounts(){
    var done = 0;
    ALL.forEach(function(q){
      var d = isDone(q);
      if(d) done++;
      $('chip-'+q.id).classList.toggle('done',d);
      $('q-'+q.id).classList.toggle('done',d);
    });
    $('doneCount').textContent = done;
    $('leftCount').textContent = ALL.length - done;
  }

  function tick(){
    var left = Math.max(0, state.endAt - Date.now());
    var sec = Math.ceil(left/1000);
    var m = Math.floor(sec/60), s = sec%60;
    $('timerText').textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    $('progress').style.transform = 'scaleX('+(left/DURATION)+')';
    var band = sec<=60 ? 'alert' : sec<=300 ? 'warn' : '';
    if(band !== lastBand){
      $('timer').className = 'timer '+band;
      if(band==='warn') $('timeAnnounce').textContent = 'Còn 5 phút';
      if(band==='alert') $('timeAnnounce').textContent = 'Còn 1 phút';
      lastBand = band;
    }
    if(left <= 0){ submit(true); }
  }

  function startTimer(){
    tick();
    if(!state.submitted){ ticking = setInterval(tick, 250); }
  }

  function showExam(){
    $('startScreen').hidden = true;
    $('examScreen').hidden = false;
    $('nameShow').textContent = state.name;
  }

  function askSubmit(){
    var left = ALL.filter(function(q){ return !isDone(q); }).length;
    $('confirmText').textContent = left
      ? 'Bạn còn '+left+' câu chưa làm. Sau khi nộp, bạn không thể sửa bài.'
      : 'Bạn đã làm đủ 14 câu. Sau khi nộp, bạn không thể sửa bài.';
    var d = $('confirmDlg');
    if(d.showModal){ d.showModal(); }
    else if(window.confirm($('confirmText').textContent)){ submit(false); }
  }

  function submit(timeUp){
    if(state.submitted) return;
    state.submitted = true;
    state.timeUp = !!timeUp;
    state.submittedAt = Math.min(Date.now(), state.endAt);
    save();
    if(ticking) clearInterval(ticking);
    var d = $('confirmDlg');
    if(d.open) d.close();
    showResults(true);
  }

  function autoScore(){
    var total = 0;
    ALL.forEach(function(q){ if(q.type==='choice' && state.answers[q.id]===q.answer) total += q.point; });
    return Math.round(total*100)/100;
  }

  function refreshTotal(){
    var sum = autoScore(), pending = 0;
    ALL.forEach(function(q){
      if(q.type==='choice') return;
      if(state.marks[q.id]===undefined || state.marks[q.id]==='') pending++;
      else sum += parseFloat(state.marks[q.id]);
    });
    $('totalScore').textContent = fmt(sum);
    $('pendingText').textContent = pending
      ? 'Còn '+pending+' câu tự luận chưa chấm. Điểm tổng sẽ tăng khi giáo viên chọn điểm ở từng câu.'
      : 'Đã chấm xong toàn bộ bài.';
  }

  function showResults(focus){
    document.body.classList.add('finished');
    $('submitBtn').hidden = true;
    $('submitBottom').hidden = true;
    var ms = Math.min(DURATION, Math.max(0,(state.submittedAt||state.endAt) - state.startedAt));
    var left = Math.max(0, state.endAt - (state.submittedAt||state.endAt));
    var sl = Math.ceil(left/1000);
    $('timerText').textContent = (sl>=600?'':'0')+Math.floor(sl/60)+':'+(sl%60<10?'0':'')+(sl%60);
    $('timer').querySelector('small').textContent = state.timeUp ? 'Hết giờ' : 'Còn lại khi nộp';
    $('progress').style.transform = 'scaleX('+(left/DURATION)+')';
    var used = Math.round(ms/1000);

    var done = ALL.filter(isDone).length;
    var r = $('result');
    r.hidden = false;
    r.textContent = '';
    r.appendChild(el('h2','',state.timeUp ? 'Hết giờ, bài đã được nộp tự động' : 'Đã nộp bài'));
    r.appendChild(el('p','notice',state.name+' đã làm '+done+'/14 câu trong '+Math.floor(used/60)+' phút '+(used%60)+' giây.'));
    var sc = el('div','score');
    var tot = el('div','total');
    var totNum = el('span'); totNum.id = 'totalScore';
    tot.appendChild(totNum);
    tot.appendChild(el('small','',' / 10 điểm'));
    sc.appendChild(tot);
    sc.appendChild(el('span','','Bài tập 1 chấm tự động: '+fmt(autoScore())+'/2 điểm'));
    r.appendChild(sc);
    var pend = el('p','todo'); pend.id = 'pendingText';
    r.appendChild(pend);
    var act = el('div','actions');
    var pr = el('button','btn','In hoặc lưu PDF'); pr.type='button';
    pr.addEventListener('click', function(){ window.print(); });
    var re = el('button','btn quiet','Làm lại từ đầu'); re.type='button';
    re.addEventListener('click', function(){
      if(window.confirm('Xóa bài làm hiện tại và làm lại từ đầu?')){ clearSaved(); location.reload(); }
    });
    act.appendChild(pr); act.appendChild(re);
    r.appendChild(act);

    document.querySelectorAll('input[type=radio]').forEach(function(i){ i.disabled = true; });
    document.querySelectorAll('textarea').forEach(function(t){ t.readOnly = true; });

    ALL.forEach(function(q){
      var card = $('q-'+q.id);
      if(card.querySelector('.review')) return;
      var rv = el('div','review');
      if(q.type==='choice'){
        var ok = state.answers[q.id]===q.answer;
        var line = el('p');
        line.appendChild(el('span','tag '+(ok?'right':'wrong'), ok?'Đúng, +0,4 điểm':(isDone(q)?'Sai':'Chưa làm')));
        if(!ok){ line.appendChild(document.createTextNode(' Đáp án: ')); line.appendChild(el('span','han',q.answer)); }
        rv.appendChild(line);
      } else {
        var rf = el('p');
        rf.appendChild(document.createTextNode(q.type==='make'?'Câu mẫu: ':'Đáp án tham khảo: '));
        rf.appendChild(el('span',q.to==='vi'?'':'han',q.ref));
        rv.appendChild(rf);
        var g = el('label','grade');
        g.appendChild(document.createTextNode('Điểm giáo viên chấm:'));
        var sel = document.createElement('select');
        var vals = q.point===1 ? ['0','0.25','0.5','0.75','1'] : ['0','0.25','0.5'];
        var o0 = el('option','','Chưa chấm'); o0.value=''; sel.appendChild(o0);
        vals.forEach(function(v){ var o = el('option','',fmt(parseFloat(v))); o.value=v; sel.appendChild(o); });
        sel.value = state.marks[q.id] || '';
        sel.addEventListener('change', function(){ state.marks[q.id]=sel.value; save(); refreshTotal(); });
        g.appendChild(sel);
        rv.appendChild(g);
      }
      card.appendChild(rv);
    });
    refreshTotal();
    if(focus){ window.scrollTo(0,0); r.focus({preventScroll:true}); }
  }

  // Sự kiện
  $('startForm').addEventListener('submit', function(e){
    e.preventDefault();
    var n = $('nameInput').value.trim();
    if(!n){ $('nameErr').textContent = 'Nhập họ và tên để bắt đầu.'; $('nameInput').focus(); return; }
    state.name = n;
    state.startedAt = Date.now();
    state.endAt = state.startedAt + DURATION;
    save();
    showExam();
    render();
    startTimer();
    window.scrollTo(0,0);
  });
  $('submitBtn').addEventListener('click', askSubmit);
  $('submitBottom').addEventListener('click', askSubmit);
  $('confirmNo').addEventListener('click', function(){ $('confirmDlg').close(); });
  $('confirmYes').addEventListener('click', function(){ submit(false); });

  // Khôi phục khi tải lại trang, đồng hồ không bị đặt lại
  if(load()){
    showExam();
    render();
    if(state.submitted){ showResults(false); }
    else { startTimer(); }
  }
})();
</script>
</body>
</html>
